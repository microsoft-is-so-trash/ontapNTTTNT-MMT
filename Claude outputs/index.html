the last fetch."],"dung":[0,1,3],"giai_thich":"Số ahead/behind chỉ mới bằng lần fetch cuối; muốn số mới: <code>git fetch --all; git branch -vv<\/code>.","nguon":"week02.pdf tr.54; Pro Git tr.100","muc":"k2-trap-vv","demo":null,"hoi":null},{"id":"K2-10","mon":"TTNT","khoi":"K2","loai":"multi","de":"Which statements about this sequence are correct?","code":"git checkout experiment\ngit rebase master\ngit checkout master\ngit merge experiment","lang":"bash","dap_an":["The final snapshot equals what a three-way merge would produce.","The history becomes linear.","The final <code>git merge experiment<\/code> is a fast-forward.","The original experiment commits keep their hashes."],"dung":[0,1,2],"giai_thich":"Rebase phát lại các patch thành commit mới (C3', C4' — hash mới). Sau đó merge từ master là fast-forward. Snapshot cuối giống merge.","nguon":"week02.pdf tr.58–62","muc":"k2-trap-rebase","demo":null,"hoi":null},{"id":"K2-11","mon":"TTNT","khoi":"K2","loai":"single","de":"Which practice follows the lecture's guidance on rebase vs. merge?","code":null,"lang":null,"dap_an":["Rebase local, unpushed commits to clean up; never rebase anything already pushed publicly.","Always rebase the shared main branch after every push.","Never use merge once rebase is available.","Rebase is always correct; merge is always wrong."],"dung":[0],"giai_thich":"Không có cách nào đúng tuyệt đối; thỏa hiệp: rebase thay đổi local chưa push, không rebase thứ đã public.","nguon":"week02.pdf tr.67; Pro Git tr.106","muc":"k2-rebase","demo":null,"hoi":null},{"id":"K2-12","mon":"TTNT","khoi":"K2","loai":"single","de":"<code>client<\/code> branched off <code>server<\/code>, which branched off <code>master<\/code>. What does this command do?","code":"git rebase --onto master server client","lang":"bash","dap_an":["Replays the commits of client made since it diverged from server onto master.","Replays server onto client.","Merges master into server and client.","Deletes server after rebasing client."],"dung":[0],"giai_thich":"--onto master server client: lấy client, tìm các patch kể từ khi tách khỏi server, phát lại như thể dựa trực tiếp trên master; sau đó có thể fast-forward master.","nguon":"week02.pdf tr.63–64; Pro Git tr.104","muc":"k2-rebase","demo":null,"hoi":null},{"id":"K2-13","mon":"TTNT","khoi":"K2","loai":"single","de":"A collaborator pushed <code>serverfix<\/code>. After <code>git fetch origin<\/code>, what does this command create?","code":"git checkout -b sf origin/serverfix","lang":"bash","dap_an":["A local branch <code>sf<\/code> that tracks <code>origin/serverfix<\/code>; <code>git pull<\/code> on sf pulls from it.","A remote branch named sf.","A tag called sf.","Nothing; fetch already created an editable local serverfix."],"dung":[0],"giai_thich":"Fetch chỉ tạo remote-tracking branch origin/serverfix (không sửa được). <code>checkout -b sf origin/serverfix<\/code> tạo nhánh local (tên khác) có upstream là origin/serverfix.","nguon":"week02.pdf tr.48–52","muc":"k2-remote","demo":null,"hoi":null},{"id":"K3-01","mon":"TTNT","khoi":"K3","loai":"single","de":"A prompt reads <code>admin@web01:/var/log#<\/code>. Which statement is correct?","code":null,"lang":null,"dap_an":["The session has superuser privileges and the current directory is /var/log.","The user is admin without privileges, in the home directory.","The last command failed.","The shell is not bash."],"dung":[0],"giai_thich":"Định dạng prompt: user@máy:thư-mục; kết thúc bằng # thay vì $ = superuser.","nguon":"week3.pdf tr.4","muc":"k3-nav","demo":null,"hoi":null},{"id":"K3-02","mon":"TTNT","khoi":"K3","loai":"single","de":"What does the last command print?","code":"me@linuxbox:~$ cd Desktop\nme@linuxbox:~/Desktop$ cd ../..\n$ pwd","lang":"bash","dap_an":["<code>/home<\/code>","<code>/home/me<\/code>","<code>/<\/code>","<code>/home/me/Desktop/../..<\/code>"],"dung":[0],"giai_thich":"<code>..<\/code> lên một cấp: Desktop → me → home.","nguon":"week3.pdf tr.8–9","muc":"k3-nav","demo":null,"hoi":null},{"id":"K3-03","mon":"TTNT","khoi":"K3","loai":"multi","de":"Which file names match the pattern <code>BACKUP.[0-9][0-9][0-9]<\/code>?","code":null,"lang":null,"dap_an":["<code>BACKUP.001<\/code>","<code>BACKUP.1<\/code>","<code>BACKUP.123<\/code>","<code>backup.123<\/code>"],"dung":[0,2],"giai_thich":"Pattern yêu cầu đúng “BACKUP.” (phân biệt hoa thường) và đúng ba chữ số.","nguon":"week3.pdf tr.11","muc":"k3-files","demo":null,"hoi":null},{"id":"K3-04","mon":"TTNT","khoi":"K3","loai":"multi","de":"In <code>dir2<\/code>, <code>Hi.txt<\/code> contains \"hello\". After running the commands below, which statements are correct?","code":"ln Hi.txt Hi-hard\nln -s Hi.txt Hi-sym\nrm Hi.txt","lang":"bash","dap_an":["<code>cat Hi-hard<\/code> still prints hello.","<code>Hi-sym<\/code> is now a broken link.","Before the rm, Hi-hard and Hi.txt showed the same inode number in <code>ls -li<\/code>.","Hi-sym has the same inode number as Hi.txt."],"dung":[0,1,2],"giai_thich":"Hard link chia sẻ inode nên dữ liệu còn khi xoá một tên. Symlink là file riêng chứa đường dẫn, đích mất thì link hỏng.","nguon":"week3.pdf tr.17–18; ex3.docx Part B; TLCL tr.63–65","muc":"k3-trap-link","demo":null,"hoi":null},{"id":"K3-05","mon":"TTNT","khoi":"K3","loai":"multi","de":"Which statements about these pipelines are correct?","code":null,"lang":null,"dap_an":["<code>ls /bin | sort | uniq | wc -l<\/code> counts unique program names.","<code>ls /bin | grep zip<\/code> prints only names containing \"zip\".","<code>ls /bin | tee list.txt<\/code> saves the list to list.txt and still shows it on the screen.","<code>uniq<\/code> removes all duplicates correctly even if its input is not sorted."],"dung":[0,1,2],"giai_thich":"uniq chỉ bỏ dòng trùng liền kề → cần sort trước. tee ghi file đồng thời chuyển tiếp ra stdout.","nguon":"week3.pdf tr.19; ex3.docx Part C; TLCL tr.89","muc":"k3-trap-uniq","demo":null,"hoi":null},{"id":"K3-06","mon":"TTNT","khoi":"K3","loai":"multi","de":"Exercise 3 asks: secret.txt → only the owner can read/write; shared.txt → owner and group read/write, others read only; public.txt → everyone can read, write and execute. Which commands are correct?","code":null,"lang":null,"dap_an":["<code>chmod 600 secret.txt<\/code>","<code>chmod 664 shared.txt<\/code>","<code>chmod 777 public.txt<\/code>","<code>chmod 644 shared.txt<\/code>"],"dung":[0,1,2],"giai_thich":"rw- = 6, r-- = 4, rwx = 7, --- = 0. 644 cho group chỉ đọc nên sai yêu cầu của shared.txt.","nguon":"week3.pdf tr.23; ex3.docx Part D","muc":"k3-trap-octal","demo":null,"hoi":null},{"id":"K3-07","mon":"TTNT","khoi":"K3","loai":"single","de":"What permissions does the new file get?","code":"umask 0022\n> foo.txt\nls -l foo.txt","lang":"bash","dap_an":["<code>-rw-r--r--<\/code>","<code>-rw-rw-r--<\/code>","<code>-rwxr-xr-x<\/code>","<code>-rw-rw-rw-<\/code>"],"dung":[0],"giai_thich":"Quyền gốc của file rw-rw-rw-; mask 0022 tắt bit w của group và others → rw-r--r--.","nguon":"week3.pdf tr.25; TLCL tr.126–127","muc":"k3-trap-umask","demo":null,"hoi":null},{"id":"K3-08","mon":"TTNT","khoi":"K3","loai":"single","de":"<code>file<\/code> currently has mode <code>rw-------<\/code>. What is its mode after this command?","code":"chmod go+rx,u+x file","lang":"bash","dap_an":["<code>rwxr-xr-x<\/code>","<code>rw-r-xr-x<\/code>","<code>rwx------<\/code>","<code>r-xr-xr-x<\/code>"],"dung":[0],"giai_thich":"u+x thêm x cho owner → rwx; go+rx thêm r và x cho group và others → r-x. Ký hiệu chỉ thêm phần được nêu, giữ nguyên phần còn lại.","nguon":"week3.pdf tr.24","muc":"k3-perm","demo":null,"hoi":null},{"id":"K3-09","mon":"TTNT","khoi":"K3","loai":"multi","de":"Which statements about the r, w, x attributes are correct?","code":null,"lang":null,"dap_an":["r on a directory allows listing its contents.","x on a directory allows entering it with cd.","w on a directory alone (without x) is enough to delete files inside it.","x on a file allows executing it as a program."],"dung":[0,1,3],"giai_thich":"w trên thư mục cho tạo/xoá/đổi tên file bên trong nhưng cần kèm x.","nguon":"week3.pdf tr.22","muc":"k3-trap-dir","demo":null,"hoi":null},{"id":"K3-10","mon":"TTNT","khoi":"K3","loai":"multi","de":"Which statements about SSH key-pair authentication are correct?","code":null,"lang":null,"dap_an":["The private key stays on the local machine and must never be shared.","The public key is stored on the server and used to verify the user.","<code>ssh-keygen<\/code> creates the key pair on the local machine.","The server needs a copy of the private key to verify the connection."],"dung":[0,1,2],"giai_thich":"Local dùng private key tạo yêu cầu kết nối; server dùng public key để xác minh; hợp lệ thì lập kết nối mã hoá.","nguon":"week3.pdf tr.30–31","muc":"k3-trap-key","demo":null,"hoi":null},{"id":"K3-11","mon":"TTNT","khoi":"K3","loai":"single","de":"You must repeatedly synchronise a whole project folder with many files to the VPS. Which command fits the lecture's recommendation?","code":null,"lang":null,"dap_an":["<code>rsync -av folder/ user@&lt;vps-address&gt;:/path/<\/code>","<code>scp file.txt user@&lt;vps-address&gt;:/path/<\/code>","<code>ssh-keygen folder/<\/code>","<code>ln -s folder/ user@&lt;vps-address&gt;<\/code>"],"dung":[0],"giai_thich":"scp hợp với copy một file nhanh; rsync đồng bộ cả thư mục, nhiều file, cập nhật lặp lại.","nguon":"week3.pdf tr.32","muc":"k3-ssh","demo":null,"hoi":null},{"id":"K3-12","mon":"TTNT","khoi":"K3","loai":"multi","de":"Which statements about <code>su<\/code> and <code>sudo<\/code> are correct?","code":null,"lang":null,"dap_an":["<code>sudo command<\/code> runs a single command with elevated privileges and asks for your own password.","<code>su -<\/code> starts a login shell as another user (root by default) and needs that user's password.","<code>sudo<\/code> always starts a new root shell.","Ubuntu enables direct root login and does not rely on sudo."],"dung":[0,1],"giai_thich":"sudo không mở shell/môi trường mới; Ubuntu tắt đăng nhập root trực tiếp và dựa vào sudo.","nguon":"week3.pdf tr.26","muc":"k3-perm","demo":null,"hoi":null},{"id":"K3-13","mon":"TTNT","khoi":"K3","loai":"multi","de":"Consider this line from <code>ls -l<\/code>. Which statements are correct?","code":"drwxr-x--- 2 me dev 4096 2026-09-10 10:00 reports","lang":"text","dap_an":["reports is a directory.","Members of group dev can list it and enter it.","Other users can enter it.","The owner can create files inside it."],"dung":[0,1,3],"giai_thich":"d = thư mục; owner rwx; group r-x (đọc + vào); others --- (không có quyền gì).","nguon":"week3.pdf tr.21–22","muc":"k3-perm-model","demo":null,"hoi":null},{"id":"K3-14","mon":"TTNT","khoi":"K3","loai":"single","de":"<code>ssh ubuntu@203.0.113.25<\/code> cannot connect. According to the lecture, what should you check first?","code":null,"lang":null,"dap_an":["Network reachability with <code>ping<\/code> (and <code>traceroute<\/code>), before suspecting key configuration or firewall issues.","Regenerate the key pair immediately.","Run <code>chmod 777<\/code> on the home directory.","Reinstall bash on the server."],"dung":[0],"giai_thich":"Ghi chú cuối slide: ssh không kết nối được → kiểm tra mạng bằng ping trước khi nghi key/firewall.","nguon":"week3.pdf tr.33","muc":"k3-ssh","demo":null,"hoi":null},{"id":"K4-D01","mon":"TTNT","khoi":"K4","loai":"single","de":"Consider the following file:","code":"# app/main.py\nfrom fastapi import FastAPI\n\napi = FastAPI()","lang":"python","dap_an":["<code>uvicorn main.app:api --port 9000<\/code>","<code>uvicorn app.api:main --port 9000<\/code>","<code>uvicorn app.main:api --port 9000<\/code>","<code>uvicorn app.main:app --port 9000<\/code>"],"dung":[2],"giai_thich":"Cú pháp <code>uvicorn module_path:biến<\/code>. File <code>app/main.py<\/code> → <code>app.main<\/code>; biến là <code>api<\/code> → <code>:api<\/code>. Phương án a/b đảo vị trí; d dùng nhầm tên biến <code>app<\/code>.","nguon":"week4.pdf tr.9; đề mẫu Q1","muc":"k4-uvicorn","demo":1,"hoi":"Which command correctly serves this application on port 9000?"},{"id":"K4-D02","mon":"TTNT","khoi":"K4","loai":"single","de":"Consider:","code":"router = APIRouter(prefix=\"/chat\", tags=[\"messages\"])\n\n@router.get(\"/history\")\nasync def history():\n    return []","lang":"python","dap_an":["<code>GET /history/chat<\/code>","<code>GET /chat/ messages<\/code>","<code>GET /messages/history<\/code>","<code>GET /chat/history<\/code>"],"dung":[3],"giai_thich":"URL = prefix <code>/chat<\/code> + path <code>/history<\/code> = <code>/chat/history<\/code>. <code>tags=[\"messages\"]<\/code> chỉ nhóm endpoint trên /docs, không vào URL.","nguon":"week4.pdf tr.11; đề mẫu Q2","muc":"k4-router","demo":2,"hoi":"The router is included without an additional prefix. Which request directly matches this route?"},{"id":"K4-D03","mon":"TTNT","khoi":"K4","loai":"single","de":"The endpoint accepts this request model:","code":"class ChatRequest(BaseModel):\n    role: str\n    content: str","lang":"python","dap_an":["PostgreSQL rejects the request before FastAPI validates it.","FastAPI returns a 422 response for the missing field.","FastAPI assigns an empty string to content","The endpoint receives content=None and continues."],"dung":[1],"giai_thich":"Thiếu field bắt buộc <code>content<\/code> → Pydantic từ chối, FastAPI trả <b>422 Unprocessable Entity<\/b> trước khi hàm chạy. Không có giá trị mặc định nên không tự gán \"\" hay None; DB chưa hề được chạm tới.","nguon":"week4.pdf tr.12–13; đề mẫu Q3","muc":"k4-trap-422","demo":3,"hoi":"The client sends: <code>{\"role\": \"user\"}<\/code>\nWhat is the standard result?"},{"id":"K4-D04","mon":"TTNT","khoi":"K4","loai":"multi","de":"Consider only the validation rules declared here:","code":"class ChatRequest(BaseModel):\n    role: str\n    content: str","lang":"python","dap_an":["<code>{\"role\": \"moderator\", \"content\": \"Hello\"}<\/code>","<code>{\"role\": \"user\", \"content\": \"Hello\"}<\/code>","<code>{\"role\": \"user\"}<\/code>","<code>{\"role\": \"assistant\", \"content\": \"\"}<\/code>"],"dung":[0,1,3],"giai_thich":"Luật chỉ là: có <code>role<\/code> kiểu str và <code>content<\/code> kiểu str. \"moderator\" vẫn là str (không có ràng buộc giá trị); chuỗi rỗng \"\" vẫn là str (không có min_length). Chỉ (c) thiếu content → 422.","nguon":"week4.pdf tr.13; đề mẫu Q4","muc":"k4-trap-422","demo":4,"hoi":"Which JSON bodies satisfy these rules?"},{"id":"K4-D05","mon":"TTNT","khoi":"K4","loai":"single","de":"Consider:","code":"class PublicMessage(BaseModel):\n    id: int\n    content: str\n\n@app.get(\"/message\", response_model=PublicMessage)\nasync def message():\n    return {\n        \"id\": 7,\n        \"content\": \"Hello\",\n        \"internal_token\": \"secret\"\n    }","lang":"python","dap_an":["<code>{\"id\": 7, \"content\": \"Hello\", \"internal_token\": null}<\/code>","<code>{\"id\": 7, \"content\": \"Hello\", \"internal_token\": \"secret\"}<\/code>","<code>{\"id\": 7, \"content\": \"Hello\"}<\/code>","<code>{\"content\": \"Hello\"}<\/code>"],"dung":[2],"giai_thich":"<code>response_model=PublicMessage<\/code> định hình dữ liệu ra: chỉ giữ field đã khai báo (<code>id<\/code>, <code>content<\/code>), bỏ hẳn <code>internal_token<\/code> (không thành null). Đây là cách ẩn field nội bộ.","nguon":"week4.pdf tr.13; đề mẫu Q5","muc":"k4-trap-respmodel","demo":5,"hoi":"Which JSON object is returned to the client?"},{"id":"K4-06","mon":"TTNT","khoi":"K4","loai":"multi","de":"Which statements about Uvicorn and ASGI are correct?","code":null,"lang":null,"dap_an":["Uvicorn is an ASGI server that listens on a network port and hands each HTTP request to the FastAPI app.","Without a server such as Uvicorn, <code>app = FastAPI()<\/code> is just an object in memory that nobody outside can reach.","WSGI is preferred for a chat app because it serves other users while one request waits on an LLM call.","<code>--reload<\/code> is recommended in production so the server restarts on every change."],"dung":[0,1],"giai_thich":"ASGI (không phải WSGI) phục vụ nhiều request đồng thời khi một request đang chờ LLM/DB. <code>--reload<\/code> chỉ dùng khi phát triển (dev only).","nguon":"week4.pdf tr.7–9","muc":"k4-uvicorn","demo":null,"hoi":null},{"id":"K4-07","mon":"TTNT","khoi":"K4","loai":"single","de":"Based on this router (from the course sample app), which request returns the stored messages of conversation 5?","code":"router = APIRouter(prefix=\"/chat\", tags=[\"chat\"])\n\n@router.get(\"/history\", response_model=list[MessageResponse])\nasync def get_history(conversation_id: int, conn=Depends(get_conn)):\n    ...","lang":"python","dap_an":["<code>GET /chat/history?conversation_id=5<\/code>","<code>GET /history/chat/5<\/code>","<code>POST /chat/history<\/code> with body <code>5<\/code>","<code>GET /conversations/5/history<\/code>"],"dung":[0],"giai_thich":"prefix <code>/chat<\/code> + <code>/history<\/code>; tham số <code>conversation_id: int<\/code> không nằm trong path nên được truyền qua query string <code>?conversation_id=5<\/code>.","nguon":"materials/llm_app/completed/routers/chat.py","muc":"k4-router","demo":null,"hoi":null},{"id":"K4-08","mon":"TTNT","khoi":"K4","loai":"multi","de":"The project uses this settings class, and <code>.env<\/code> contains only one line: <code>DATABASE_URL=postgresql://user:secret@localhost:5432/chatdb<\/code>. Which statements are correct?","code":"from pydantic_settings import BaseSettings\n\nclass Settings(BaseSettings):\n    database_url: str\n    app_env: str = \"development\"\n\n    class Config:\n        env_file = \".env\"\n\nsettings = Settings()","lang":"python","dap_an":["<code>settings.app_env<\/code> equals <code>\"development\"<\/code>.","<code>settings.database_url<\/code> is loaded from the .env file.","If DATABASE_URL were removed from .env, <code>settings.database_url<\/code> would silently become None.","The .env file should be committed so teammates share the same password."],"dung":[0,1],"giai_thich":"<code>app_env<\/code> có giá trị mặc định. <code>database_url: str<\/code> bắt buộc: thiếu thì app lỗi rõ ràng khi khởi động (không âm thầm thành None — đó là hành vi của <code>os.getenv<\/code>). .env không bao giờ commit.","nguon":"week4.pdf tr.22–24","muc":"k4-env","demo":null,"hoi":null},{"id":"K4-09","mon":"TTNT","khoi":"K4","loai":"multi","de":"Consider <code>DATABASE_URL=postgresql://user:password@localhost:5432/chatdb<\/code>. Which statements are correct?","code":null,"lang":null,"dap_an":["<code>chatdb<\/code> is the target database name.","<code>5432<\/code> is PostgreSQL's default port.","<code>user:password<\/code> names the table where messages are stored.","A typo in the host gives a warning but still connects to the closest match."],"dung":[0,1],"giai_thich":"Các phần: scheme/driver · user:password (đăng nhập) · host:port (5432 là cổng mặc định PG) · tên DB. Sai một phần là bị từ chối hẳn, không có “gần đúng”.","nguon":"week4.pdf tr.20–21","muc":"k4-env","demo":null,"hoi":null},{"id":"K4-10","mon":"TTNT","khoi":"K4","loai":"single","de":"After deploying, the log shows:\n<code>relation \"messages\" does not exist<\/code>\nWhat is the most likely cause?","code":null,"lang":null,"dap_an":["The table was never created, or the migration was never run against this database.","The password in DATABASE_URL is wrong.","A string was inserted into an INTEGER column.","The PostgreSQL container is not running."],"dung":[0],"giai_thich":"Ba lỗi hay gặp: <code>connection refused<\/code> (sai host/port, DB chưa chạy) · <code>relation ... does not exist<\/code> (chưa tạo bảng/chưa migrate) · <code>invalid input syntax for type integer<\/code> (sai kiểu).","nguon":"week4.pdf tr.32","muc":"k4-sql","demo":null,"hoi":null},{"id":"K4-11","mon":"TTNT","khoi":"K4","loai":"multi","de":"Which statements about <code>Depends(get_conn)<\/code> and the connection pool are correct?","code":null,"lang":null,"dap_an":["FastAPI calls <code>get_conn<\/code> before the endpoint runs and passes its result in.","Within a single request, calling the same dependency twice reuses the first result.","A new connection pool is created for every incoming request.","Dependency injection makes it impossible to replace <code>get_conn<\/code> in tests."],"dung":[0,1],"giai_thich":"Pool được tạo <b>một lần<\/b> khi server khởi động và đóng khi tắt. Dependency injection còn giúp test override <code>get_conn<\/code> bằng kết nối giả.","nguon":"week4.pdf tr.15–16, 30–31","muc":"k4-depends","demo":null,"hoi":null},{"id":"K4-12","mon":"TTNT","khoi":"K4","loai":"single","de":"The FastAPI app calls the Gemini API and receives HTTP 429. What does it mean and what is the recommended reaction?","code":null,"lang":null,"dap_an":["The API key is wrong; create a new key in .env.","Rate limit exceeded; wait, reduce the request rate or switch provider.","The server code crashed; restart Uvicorn with --reload.","The request body failed Pydantic validation; fix the JSON."],"dung":[1],"giai_thich":"401 = sai API key; 429 = rate limit (chờ, giảm tần suất, đổi provider như Groq); timeout = đặt thời gian chờ và retry; 422 = lỗi validation.","nguon":"fastapi_llm.pdf tr.16–17","muc":"k4-status","demo":null,"hoi":null},{"id":"K4-13","mon":"TTNT","khoi":"K4","loai":"multi","de":"In the course sample app, <code>/health<\/code> is defined as below. Which test assertions pass?","code":"@app.get(\"/health\", tags=[\"health\"])\nasync def health():\n    return {\n        \"status\": \"ok\",\n        \"model\": settings.gemini_model,\n    }\n\n# test\nresponse = client.get(\"/health\")","lang":"python","dap_an":["<code>assert response.status_code == 200<\/code>","<code>assert response.json()[\"status\"] == \"ok\"<\/code>","<code>assert response.json() == {\"status\": \"ok\"}<\/code>","<code>assert response.json == 200<\/code>"],"dung":[0,1],"giai_thich":"Body thật là <code>{\"status\": \"ok\", \"model\": ...}<\/code> nên so sánh toàn bộ với <code>{\"status\": \"ok\"}<\/code> sẽ fail. <code>response.json<\/code> (không ngoặc) là method, không phải dữ liệu.","nguon":"llm_app/completed/main.py; CI.pdf tr.19","muc":"k4-test","demo":null,"hoi":null},{"id":"K4-14","mon":"TTNT","khoi":"K4","loai":"single","de":"Given the table definition, which statement succeeds?","code":"CREATE TABLE messages (\n  id SERIAL PRIMARY KEY,\n  role VARCHAR(20) NOT NULL,\n  content TEXT NOT NULL,\n  created_at TIMESTAMP DEFAULT now()\n);","lang":"sql","dap_an":["<code>INSERT INTO messages (role, content) VALUES ('user', 'Xin chao');<\/code>","<code>INSERT INTO messages (content) VALUES ('hi');<\/code>","<code>INSERT INTO messages (role, content) VALUES ('user', NULL);<\/code>","<code>INSERT INTO messages (id, role, content) VALUES ('abc', 'user', 'hi');<\/code>"],"dung":[0],"giai_thich":"<code>role<\/code> và <code>content<\/code> đều NOT NULL nên (b), (c) lỗi. (d) chèn 'abc' vào cột số → <code>invalid input syntax for type integer<\/code>. id tự tăng (SERIAL), created_at mặc định now().","nguon":"week4.pdf tr.26–27, 32","muc":"k4-sql","demo":null,"hoi":null},{"id":"K5-D18","mon":"TTNT","khoi":"K5","loai":"single","de":"An application works on a developer's laptop but fails on a server because a required library is missing. Which Docker approach most directly addresses this problem?","code":null,"lang":null,"dap_an":["Replace the server's operating-system kernel with the laptop's.","Package the application and its required libraries in an image.","Copy the application's logs into a shared registry.","Run the application using the server's installed libraries."],"dung":[1],"giai_thich":"Cách tiếp cận của Docker: đóng gói ứng dụng cùng môi trường nó cần (thư viện, runtime, cấu hình) rồi chạy nhất quán ở mọi nơi. Container dùng chung kernel của host nên không thay kernel.","nguon":"week5.pdf tr.3; đề mẫu Q18","muc":"k5-trap-q18","demo":18,"hoi":null},{"id":"K5-D19","mon":"TTNT","khoi":"K5","loai":"multi","de":"Which statements correctly describe the Docker platform?","code":null,"lang":null,"dap_an":["The client sends requests to the Docker daemon.","The daemon manages containers and local images.","A registry distributes images that hosts can pull.","A registry executes each container's main process."],"dung":[0,1,2],"giai_thich":"Kiến trúc: client gửi lệnh tới daemon; daemon tạo và quản lý image, container, network, volume; registry cung cấp image để host pull. Registry không chạy container.","nguon":"week5.pdf tr.6; đề mẫu Q19","muc":"k5-trap-q19","demo":19,"hoi":null},{"id":"K5-D20","mon":"TTNT","khoi":"K5","loai":"multi","de":"Which statement(s) correctly distinguish an Docker image from a container?","code":null,"lang":null,"dap_an":["A container has a writable layer for runtime file changes.","An image provides the template used to create containers.","Each image can be used to create only one container.","Stopping a container converts its writable layer into an image."],"dung":[0,1],"giai_thich":"Image: template bất biến, chỉ đọc. Container: instance chạy được, có lớp ghi mỏng. Một image tạo được nhiều container. Dừng container không biến nó thành image.","nguon":"week5.pdf tr.8, 10, 12; đề mẫu Q20","muc":"k5-trap-q20","demo":20,"hoi":null},{"id":"K5-04","mon":"TTNT","khoi":"K5","loai":"multi","de":"What does Docker do when this command is executed?","code":"docker run --rm hello-world","lang":"bash","dap_an":["Checks whether the hello-world image exists locally and pulls it from a registry if it is missing.","Creates a new container from the image and starts its default process.","Removes the container after it exits because of <code>--rm<\/code>.","Removes the hello-world image after the container exits."],"dung":[0,1,2],"giai_thich":"6 bước trong slide: kiểm tra image local → pull nếu chưa có → tạo container mới → chạy process mặc định → in kết quả → xoá container khi thoát (vì --rm). Image vẫn còn.","nguon":"week5.pdf tr.7","muc":"k5-run-steps","demo":null,"hoi":null},{"id":"K5-05","mon":"TTNT","khoi":"K5","loai":"single","de":"After running the command below on your machine, which request reaches the nginx server inside the container?","code":"docker run -d --name web -p 8080:80 nginx:alpine","lang":"bash","dap_an":["<code>curl http://localhost:8080<\/code>","<code>curl http://localhost:80<\/code> only","<code>curl http://web:8080<\/code> from the registry","No request can reach it because of <code>-d<\/code>"],"dung":[0],"giai_thich":"<code>-p 8080:80<\/code> = host 8080 → container 80. <code>-d<\/code> chỉ cho container chạy nền.","nguon":"week5.pdf tr.13","muc":"k5-trap-port","demo":null,"hoi":null},{"id":"K5-06","mon":"TTNT","khoi":"K5","loai":"single","de":"In the image name <code>nginx:alpine<\/code>, what is <code>alpine<\/code>?","code":null,"lang":null,"dap_an":["The repository name","The tag identifying a variant/version","The registry host","The container name"],"dung":[1],"giai_thich":"nginx là repository, alpine là tag.","nguon":"week5.pdf tr.8","muc":"k5-naming","demo":null,"hoi":null},{"id":"K5-07","mon":"TTNT","khoi":"K5","loai":"single","de":"What does the final command show?","code":"docker run -d --name web -p 8080:80 nginx:alpine\ndocker stop web\ndocker rm web\ndocker images nginx","lang":"bash","dap_an":["The nginx image is still listed, because removing a container does not remove its image.","Nothing, because <code>docker rm<\/code> deleted the image.","The web container.","An error: the image was removed by <code>docker stop<\/code>."],"dung":[0],"giai_thich":"stop dừng container, rm xoá container; image vẫn còn trong cache local.","nguon":"week5.pdf tr.13","muc":"k5-trap-rm","demo":null,"hoi":null},{"id":"K5-08","mon":"TTNT","khoi":"K5","loai":"multi","de":"Which statements match the lecture's image vs. container comparison?","code":null,"lang":null,"dap_an":["An image does not execute by itself.","Each container has its own identity and state.","A container is stored only in the registry.","An image's lifecycle includes pull, build, tag, push and remove."],"dung":[0,1,3],"giai_thich":"Container được lưu trên Docker host (không phải registry). Image lưu trong cache local hoặc registry.","nguon":"week5.pdf tr.12","muc":"k5-sosanh","demo":null,"hoi":null},{"id":"K5-09","mon":"TTNT","khoi":"K5","loai":"single","de":"Why do containers normally require fewer resources than complete virtual machines?","code":null,"lang":null,"dap_an":["They share the host operating-system kernel instead of running a full OS each.","They do not have a filesystem.","They run only inside the registry.","They cannot run more than one process."],"dung":[0],"giai_thich":"Isolation: các ứng dụng chạy trong môi trường riêng nhưng dùng chung kernel của host OS; VM phải chạy hệ điều hành đầy đủ cho mỗi máy.","nguon":"week5.pdf tr.5; Docker Deep Dive tr.87, 91","muc":"k5-sosanh","demo":null,"hoi":null},{"id":"K5-10","mon":"TTNT","khoi":"K5","loai":"single","de":"You built <code>chatbot-api:1.0<\/code> locally and want it on Docker Hub under account <code>yourusername<\/code>. Which sequence matches the lecture?","code":null,"lang":null,"dap_an":["<code>docker login<\/code> → <code>docker tag chatbot-api:1.0 yourusername/chatbot-api:1.0<\/code> → <code>docker push yourusername/chatbot-api:1.0<\/code>","<code>docker push chatbot-api:1.0<\/code> → <code>docker tag<\/code> → <code>docker login<\/code>","<code>docker commit<\/code> → <code>docker run<\/code> → <code>docker push<\/code>","<code>docker pull yourusername/chatbot-api:1.0<\/code> → <code>docker build<\/code>"],"dung":[0],"giai_thich":"Đăng nhập, gắn tag có namespace tài khoản, rồi push. Máy khác pull bằng cùng tên (repo private phải login trước).","nguon":"week5.pdf tr.15","muc":"k5-cmd","demo":null,"hoi":null},{"id":"K5-11","mon":"TTNT","khoi":"K5","loai":"multi","de":"Which statements about this command are correct?","code":"docker run --rm \\\n  --name chatbot-api \\\n  -p 8000:8000 \\\n  --env-file .env \\\n  chatbot-api:1.0","lang":"bash","dap_an":["<code>--env-file .env<\/code> passes the variables in .env to the container at run time.","<code>-p 8000:8000<\/code> maps host port 8000 to container port 8000.","<code>--rm<\/code> deletes the image <code>chatbot-api:1.0<\/code> when the container stops.","The image must contain the .env file for this command to work."],"dung":[0,1],"giai_thich":"--rm chỉ xoá container. Slide nhấn mạnh image KHÔNG được chứa .env; tạo .env trên máy chạy và truyền vào bằng --env-file.","nguon":"week5.pdf tr.14–15","muc":"k5-cmd","demo":null,"hoi":null},{"id":"K5-12","mon":"TTNT","khoi":"K5","loai":"single","de":"You start a container, then type <code>exit<\/code> inside it. What is true afterwards?","code":"docker run -it --name ubuntu-lab ubuntu:24.04 bash","lang":"bash","dap_an":["The container stops because its main process (bash) ended; <code>docker ps -a<\/code> still lists it and <code>docker start -ai ubuntu-lab<\/code> can restart it.","The container keeps running in the background.","The container and the ubuntu image are both deleted.","The container is converted into a new image."],"dung":[0],"giai_thich":"Container hoạt động khi process chính còn chạy; process thoát → container dừng (không bị xoá vì không có --rm).","nguon":"week5.pdf tr.10–11","muc":"k5-trap-life","demo":null,"hoi":null},{"id":"K5-13","mon":"TTNT","khoi":"K5","loai":"multi","de":"Consider the course app's Dockerfile (its <code>.dockerignore<\/code> lists <code>.env<\/code>). Which statements are correct?","code":"FROM python:3.12-slim\n\nENV PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1 \\\n    PIP_NO_CACHE_DIR=1\n\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --upgrade pip \\\n    && pip install -r requirements.txt\n\nCOPY . .\n\nRUN useradd --create-home --uid 10001 appuser \\\n    && chown -R appuser:appuser /app\n\nUSER appuser\n\nEXPOSE 8000\n\nCMD [\"uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]","lang":"dockerfile","dap_an":["<code>python:3.12-slim<\/code> is the base image.","<code>CMD<\/code> sets the default command run when a container starts.","Because of .dockerignore, <code>COPY . .<\/code> does not put .env into the image.","<code>EXPOSE 8000<\/code> alone publishes port 8000 on the host; <code>-p<\/code> is unnecessary."],"dung":[0,1,2],"giai_thich":"EXPOSE chỉ ghi chú (metadata) cổng app dùng; muốn truy cập từ host vẫn cần <code>-p host:container<\/code>. .dockerignore loại file khỏi build context nên .env không được COPY vào image.","nguon":"llm_app/completed/Dockerfile, .dockerignore; Docker Deep Dive tr.116; week5.pdf tr.15","muc":"k5-dockerfile","demo":null,"hoi":null},{"id":"K6-D07","mon":"TTNT","khoi":"K6","loai":"single","de":"Consider:","code":"on:\n  push:\n    branches: [main]","lang":"yaml","dap_an":["Pushing a commit to a branch named experiment.","Pushing a commit to the repository's main branch.","Creating a commit locally without pushing it.","Opening any pull request without a matching push to main."],"dung":[1],"giai_thich":"<code>on: push<\/code> + <code>branches: [main]<\/code>: chỉ push lên nhánh main mới kích hoạt. Commit local không lên GitHub thì GitHub không biết; PR không phải sự kiện được khai báo.","nguon":"CI.pdf tr.11; CD.pdf tr.13; đề mẫu Q7","muc":"k6-trap-trigger","demo":7,"hoi":"Which event matches this trigger?"},{"id":"K6-D12","mon":"TTNT","khoi":"K6","loai":"single","de":"Compared with relying on developers to run checks manually, what can a configured CI workflow provide?","code":null,"lang":null,"dap_an":["Automatic correction of every failed build instruction.","Earlier feedback when a change breaks an existing test.","All the statements are correct.","A consistent sequence of checks for matching events."],"dung":[2],"giai_thich":"Đáp án tham khảo của đề: <b>c<\/b>. Theo slide, CI loại bỏ lỗi thao tác tay, quy trình lặp lại được (d) và phát hiện lỗi sớm (b).\n⚠ Lưu ý: phương án a (tự sửa mọi lỗi build) không có trong slide — CI chỉ phát hiện, không tự sửa. Web chấm theo đáp án tham khảo của đề; xem ghi chú ở trang ôn K6.","nguon":"CI.pdf tr.4, 7; đề mẫu Q12 (đáp án tham khảo)","muc":"k6-trap-q12","demo":12,"hoi":null},{"id":"K6-D13","mon":"TTNT","khoi":"K6","loai":"single","de":"Which hierarchy correctly describes GitHub Actions?","code":null,"lang":null,"dap_an":["A runner contains triggers, and a trigger contains jobs.","A workflow contains jobs, and a job contains steps.","A job contains repositories, and a repository contains steps.","A step contains workflows, and a workflow contains runners."],"dung":[1],"giai_thich":"workflow chứa job · job chứa step (chạy lần lượt) · tất cả chạy trên runner do GitHub cấp.","nguon":"CI.pdf tr.10; đề mẫu Q13","muc":"k6-file","demo":13,"hoi":null},{"id":"K6-D14","mon":"TTNT","khoi":"K6","loai":"multi","de":"Which statements correctly describe a runner?","code":null,"lang":null,"dap_an":["It is the registry where the built image is published.","It is the YAML file that declares workflow events.","It provides the environment in which job steps execute.","It is the machine or execution environment that runs a job."],"dung":[2,3],"giai_thich":"Runner là máy thực thi workflow/job và cung cấp môi trường cho các step. Registry (a) là Docker Hub/ECR; file YAML (b) là workflow.","nguon":"CI.pdf tr.6, 10; đề mẫu Q14","muc":"k6-trap-runner","demo":14,"hoi":null},{"id":"K6-D15","mon":"TTNT","khoi":"K6","loai":"multi","de":"Consider the workflow:","code":"name: CI\n\non:\n  push:\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n\n      - run: pip install -r requirements.txt\n      - run: pytest\n      - run: docker build -t chat-app .","lang":"yaml","dap_an":["Opening a pull request that matches this configuration.","Editing a file locally without updating GitHub.","Creation of a local Git commit without a push.","A push to the repository."],"dung":[0,3],"giai_thich":"<code>on: push<\/code> và <code>on: pull_request<\/code> → hai trigger là push lên repo và mở PR. Việc chỉ diễn ra ở local không kích hoạt gì.","nguon":"CI.pdf tr.11, 15; đề mẫu Q15","muc":"k6-trap-q15","demo":15,"hoi":"Which event(s) is/are configured as workflow triggers?"},{"id":"K6-D16","mon":"TTNT","khoi":"K6","loai":"single","de":"Where should the repository store the lecture's workflow file so GitHub Actions recognizes it?","code":null,"lang":null,"dap_an":["<code>app/actions/ci.yml<\/code>","<code>.github/steps/ci.yml<\/code>","<code>.github/workflows/ci.yml<\/code>","<code>.git/workflows/ci.yml<\/code>"],"dung":[2],"giai_thich":"GitHub Actions đọc các file workflow trong thư mục <code>.github/workflows<\/code>. <code>.git/<\/code> là thư mục nội bộ của Git, không phải nơi đặt workflow.","nguon":"CI.pdf tr.13; đề mẫu Q16","muc":"k6-file","demo":16,"hoi":null},{"id":"K6-D17","mon":"TTNT","khoi":"K6","loai":"single","de":"A student wants to check both the status code and the complete JSON response body.\nWhich test does that?","code":null,"lang":null,"dap_an":["<pre>assert response.status_code == 200\nassert {\"status\": \"ok\"}<\/pre>","<pre>assert response.status_code == 200\nassert response.json<\/pre>","<pre>assert response.status_code == 200\nassert response.json() is not None<\/pre>","<pre>assert response.status_code == 200\nassert response.json() == {\"status\": \"ok\"}<\/pre>"],"dung":[3],"giai_thich":"Chỉ (d) so sánh toàn bộ body. (a) assert một dict khác rỗng → luôn đúng. (b) <code>response.json<\/code> không gọi hàm → luôn truthy. (c) chỉ kiểm tra khác None.","nguon":"CI.pdf tr.19; đề mẫu Q17","muc":"k6-trap-json","demo":17,"hoi":null},{"id":"K6-08","mon":"TTNT","khoi":"K6","loai":"single","de":"Which event triggers this workflow?","code":"name: PR checks\non:\n  pull_request:\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: pytest","lang":"yaml","dap_an":["Pushing a commit to main.","Opening a pull request.","Creating a tag locally.","Pushing to any branch."],"dung":[1],"giai_thich":"Chỉ khai báo <code>pull_request<\/code> nên push (kể cả lên main) không kích hoạt workflow này.","nguon":"CI.pdf tr.11","muc":"k6-trigger","demo":null,"hoi":null},{"id":"K6-09","mon":"TTNT","khoi":"K6","loai":"single","de":"In the workflow from the lecture, one assertion inside <code>pytest<\/code> fails. What is the result of that run?","code":"name: CI\n\non:\n  push:\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n\n      - run: pip install -r requirements.txt\n      - run: pytest\n      - run: docker build -t chat-app .","lang":"yaml","dap_an":["The pytest step reports an error, the job fails and the run turns red; the later docker build step does not run.","The job stays green because the remaining tests passed.","GitHub automatically reverts the commit that broke the test.","Only the docker build step is marked red."],"dung":[0],"giai_thich":"Cơ chế đỏ/xanh: một test không đạt → step pytest báo lỗi → job hỏng → lần chạy chuyển đỏ. Step lỗi dừng job nên bước build sau đó không chạy. Có thể cấu hình chặn gộp PR đang đỏ.","nguon":"CI.pdf tr.18","muc":"k6-trap-red","demo":null,"hoi":null},{"id":"K6-10","mon":"TTNT","khoi":"K6","loai":"multi","de":"Which statements about the steps of this job are correct?","code":"name: CI\n\non:\n  push:\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n\n      - run: pip install -r requirements.txt\n      - run: pytest\n      - run: docker build -t chat-app .","lang":"yaml","dap_an":["<code>uses: actions/checkout@v4<\/code> runs a ready-made action that brings the repository code onto the runner.","<code>run:<\/code> executes a shell command on the runner.","<code>docker build<\/code> runs before <code>pytest<\/code> because it is the last line.","All steps of the job run in parallel on different runners."],"dung":[0,1],"giai_thich":"Step trong một job chạy <b>lần lượt<\/b> theo thứ tự khai báo: checkout → setup python → pip install → pytest → docker build. <code>uses<\/code> gọi action có sẵn, <code>run<\/code> chạy lệnh shell.","nguon":"CI.pdf tr.10, 14–15","muc":"k6-file","demo":null,"hoi":null},{"id":"K6-11","mon":"TTNT","khoi":"K6","loai":"single","de":"A workflow run is red. Following the lecture, what is the right way to find the cause?","code":null,"lang":null,"dap_an":["Actions tab → open the red run → open the failed job → open the failed step → read the message.","Delete the workflow file and push again.","Re-run until it turns green.","Read the Docker Hub repository page."],"dung":[0],"giai_thich":"Thứ tự đọc log: tab Actions → lần chạy đỏ → job hỏng → step lỗi → đọc thông báo tìm nguyên nhân.","nguon":"CI.pdf tr.23","muc":"k6-log","demo":null,"hoi":null},{"id":"K6-12","mon":"TTNT","khoi":"K6","loai":"single","de":"Which description matches <b>CI<\/b> rather than CD?","code":null,"lang":null,"dap_an":["Automatically test and build whenever the source code changes.","Automatically deploy to the server after test and build pass.","Manually copy files to EC2 with scp.","Store images in a registry for EC2 to pull."],"dung":[0],"giai_thich":"CI: tự động kiểm thử và build mỗi khi mã nguồn thay đổi. CD: tự động triển khai sau khi kiểm thử và build đạt.","nguon":"CI.pdf tr.5","muc":"k6-file","demo":null,"hoi":null},{"id":"K6-13","mon":"TTNT","khoi":"K6","loai":"single","de":"Why does the lecture add <code>docker build -t chat-app .<\/code> as a step after the tests?","code":null,"lang":null,"dap_an":["To check that the image still builds after each change, so a broken Dockerfile is detected immediately in the workflow.","To deploy the container to EC2.","To publish the image to Docker Hub.","To make pytest run faster."],"dung":[0],"giai_thich":"Bước build image trong CI chỉ kiểm tra image vẫn build được; việc push lên registry và deploy thuộc CD (K8).","nguon":"CI.pdf tr.21","muc":"k6-pipeline","demo":null,"hoi":null},{"id":"K7-01","mon":"TTNT","khoi":"K7","loai":"single","de":"Which cloud service model does AWS EC2 belong to?","code":null,"lang":null,"dap_an":["Infrastructure as a Service (IaaS)","Software as a Service (SaaS)","Platform as a Service (PaaS)","On-premises hosting"],"dung":[0],"giai_thich":"IaaS: thuê hạ tầng như một dịch vụ, ví dụ máy chủ ảo; người dùng tự cài và quản lý phần mềm. EC2 là dịch vụ IaaS của AWS.","nguon":"cloudcomputing.pdf tr.7, 9","muc":"k7-trap-iaas","demo":null,"hoi":null},{"id":"K7-02","mon":"TTNT","khoi":"K7","loai":"single","de":"Which statements about cloud computing (as presented in the lecture) are correct?","code":null,"lang":null,"dap_an":["Instead of buying and operating physical servers, you rent computing resources over the Internet.","Servers can be created in minutes and resources scaled up or down when needed.","You pay for the resources you use and can delete machines when no longer needed.","All the statements are correct."],"dung":[3],"giai_thich":"Cả ba ý đều là định nghĩa/lợi ích của điện toán đám mây trong slide → “All the statements are correct”.","nguon":"cloudcomputing.pdf tr.6","muc":"k7-terms","demo":null,"hoi":null},{"id":"K7-03","mon":"TTNT","khoi":"K7","loai":"single","de":"Which order matches the lecture's steps to create an EC2 instance?","code":null,"lang":null,"dap_an":["Choose an AMI → choose an instance type (Free Tier) → create a key pair → launch and wait until ready","Create a key pair → install Docker → choose an AMI → push to GitHub","Launch → choose an AMI → choose the region's SaaS plan","Open port 8000 → choose an AMI → delete the key pair"],"dung":[0],"giai_thich":"Thứ tự: AMI → loại máy (ưu tiên Free Tier) → key pair để SSH → khởi tạo và chờ sẵn sàng.","nguon":"cloudcomputing.pdf tr.10","muc":"k7-steps","demo":null,"hoi":null},{"id":"K7-04","mon":"TTNT","khoi":"K7","loai":"single","de":"What is an AMI?","code":null,"lang":null,"dap_an":["The operating-system image used to create an instance (for example Ubuntu)","The firewall attached to the instance","The private key file used for SSH","The public IP of the instance"],"dung":[0],"giai_thich":"AMI là ảnh hệ điều hành; chọn AMI nào thì instance chạy hệ điều hành đó.","nguon":"cloudcomputing.pdf tr.11","muc":"k7-terms","demo":null,"hoi":null},{"id":"K7-05","mon":"TTNT","khoi":"K7","loai":"multi","de":"You connect with the command below. Which statements are correct?","code":"ssh -i my-key.pem ubuntu@203.0.113.25","lang":"bash","dap_an":["<code>my-key.pem<\/code> is the private key of the key pair.","<code>ubuntu<\/code> is the user name used to log in to the instance.","The .pem file should be committed to GitHub as a backup.","AWS keeps the matching public key on the instance."],"dung":[0,1,3],"giai_thich":"Key pair: AWS giữ public key trên instance, sinh viên giữ private key và phải bảo quản an toàn — không bao giờ đưa lên Git.","nguon":"cloudcomputing.pdf tr.12–13","muc":"k7-trap-key","demo":null,"hoi":null},{"id":"K7-06","mon":"TTNT","khoi":"K7","loai":"single","de":"Your container serves HTTP on port 80 of the instance and works with curl from inside the instance, but a browser on your laptop times out. The Security Group only has an inbound rule for port 22. What is the fix?","code":null,"lang":null,"dap_an":["Add an inbound rule for port 80 from 0.0.0.0/0.","Add an outbound rule for port 22.","Re-create the key pair.","Change the AMI."],"dung":[0],"giai_thich":"Security Group mặc định chặn phần lớn lưu lượng vào; phải mở đúng port cần dùng. Lỗi timeout khi truy cập từ ngoài là dấu hiệu điển hình.","nguon":"cloudcomputing.pdf tr.14–15, 19","muc":"k7-trap-timeout","demo":null,"hoi":null},{"id":"K7-07","mon":"TTNT","khoi":"K7","loai":"single","de":"Which Security Group configuration follows the principle of least privilege for the course project?","code":null,"lang":null,"dap_an":["Port 22 from My IP only; ports 80 and 443 from 0.0.0.0/0; remove rules no longer used.","All ports open to 0.0.0.0/0 to avoid connection problems.","Port 22 from 0.0.0.0/0 so you can connect from anywhere.","Keep all old rules after the lab in case they are needed again."],"dung":[0],"giai_thich":"Nên: chỉ mở port cần dùng, SSH chỉ My IP, xoá rule thừa. Không nên: mở tất cả, SSH Anywhere, giữ rule cũ.","nguon":"cloudcomputing.pdf tr.15–16","muc":"k7-trap-ssh","demo":null,"hoi":null},{"id":"K7-08","mon":"TTNT","khoi":"K7","loai":"single","de":"Why should port 22 be restricted while ports 80 and 443 are open to everyone?","code":null,"lang":null,"dap_an":["Port 22 is administrative SSH access only you need; users must reach the website over HTTP/HTTPS from anywhere.","Port 22 is slower than 80.","AWS charges extra for port 22.","Ports 80/443 are encrypted, so they cannot be attacked."],"dung":[0],"giai_thich":"Ghi chú trong slide: giải thích vì sao 22 nên giới hạn còn 80/443 mở rộng để người dùng truy cập.","nguon":"cloudcomputing.pdf tr.15","muc":"k7-ports","demo":null,"hoi":null},{"id":"K7-09","mon":"TTNT","khoi":"K7","loai":"single","de":"How do you avoid unexpected AWS charges according to the lecture?","code":null,"lang":null,"dap_an":["Choose instance types within the Free Tier and stop or delete instances when not in use.","Open every port so AWS does not throttle traffic.","Use a bigger instance type.","Never create a key pair."],"dung":[0],"giai_thich":"Free Tier có giới hạn loại máy và thời lượng; tắt hoặc xoá instance khi không dùng.","nguon":"cloudcomputing.pdf tr.17","muc":"k7-trap-cost","demo":null,"hoi":null},{"id":"K7-10","mon":"TTNT","khoi":"K7","loai":"multi","de":"Which steps belong to putting the Docker stack on EC2 in this lecture?","code":null,"lang":null,"dap_an":["SSH into the instance and install Docker and Docker Compose.","Copy the source and docker-compose.yml to the instance, then run <code>docker compose up -d<\/code>.","Pass sensitive information through a .env file as in previous sessions.","Disable the Security Group so the app is reachable."],"dung":[0,1,2],"giai_thich":"Không tắt Security Group; chỉ mở đúng port cần dùng rồi gọi endpoint qua địa chỉ công khai.","nguon":"cloudcomputing.pdf tr.18–19","muc":"k7-deploy","demo":null,"hoi":null},{"id":"K7-11","mon":"TTNT","khoi":"K7","loai":"single","de":"Why does the course deploy the application to a cloud server instead of keeping it on the developer's laptop?","code":null,"lang":null,"dap_an":["A cloud server runs continuously, has a public IP and can be reached by other people over the Internet.","The laptop cannot run Docker.","Cloud servers do not need a firewall.","It avoids writing a Dockerfile."],"dung":[0],"giai_thich":"Laptop chỉ chạy khi bật, chỉ truy cập trong máy, không có địa chỉ công khai ổn định.","nguon":"cloudcomputing.pdf tr.3, 8","muc":"k7-y","demo":null,"hoi":null},{"id":"K8-D06","mon":"TTNT","khoi":"K8","loai":"single","de":"Which sequence matches the registry-based continuous deployment architecture?","code":null,"lang":null,"dap_an":["Push code → SSH to EC2 → build locally → run tests on GitHub.","Push code → pull an image → build on EC2 → upload test results.","Push code → restart EC2 → publish source files → create an image.","Push code → test/build → publish image → EC2 pulls and runs it."],"dung":[3],"giai_thich":"Kiến trúc CD: developer push → GitHub Actions test & build → push image lên registry → SSH trigger → EC2 pull image mới → restart container. Không build trên EC2.","nguon":"CD.pdf tr.6, 12; đề mẫu Q6","muc":"k8-trap-arch","demo":6,"hoi":null},{"id":"K8-D08","mon":"TTNT","khoi":"K8","loai":"single","de":"For SSH public-key authentication from the runner to EC2, which pairing is appropriate?","code":null,"lang":null,"dap_an":["Docker token in EC2_SSH_KEY; public key in the image registry.","Private key in the Docker image; matching password in the workflow name.","Public key in EC2_SSH_KEY; private key in EC2's application logs.","Private key supplied to the runner; matching public key authorized on EC2."],"dung":[3],"giai_thich":"Runner giữ “chìa” (private key từ secret EC2_SSH_KEY), EC2 giữ “ổ khoá” (public key trong ~/.ssh/authorized_keys).","nguon":"CD.pdf tr.17; đề mẫu Q8","muc":"k8-trap-key","demo":8,"hoi":null},{"id":"K8-D09","mon":"TTNT","khoi":"K8","loai":"single","de":"Consider:","code":"- uses: appleboy/ssh-action@v1.0.3\n  with:\n    host: ${{ secrets.EC2_HOST }}\n    username: ${{ secrets.EC2_USERNAME }}\n    key: ${{ secrets.EC2_SSH_KEY }}\n    script: |\n      cd /home/ubuntu/app\n      docker compose pull\n      docker compose up -d","lang":"yaml","dap_an":["Inside Docker Hub's image-storage environment.","In the developer's currently open local terminal.","Inside the GitHub Actions' runner.","On the EC2 host reached through the SSH connection"],"dung":[3],"giai_thich":"appleboy/ssh-action mở kết nối SSH từ runner tới EC2; <code>script<\/code> là chuỗi lệnh shell sẽ chạy <b>trên server<\/b>.","nguon":"CD.pdf tr.19–20; đề mẫu Q9","muc":"k8-trap-script","demo":9,"hoi":"Where do the commands under <code>script<\/code> execute?"},{"id":"K8-D10","mon":"TTNT","khoi":"K8","loai":"single","de":"A GitHub Actions step runs the command below. The server returns HTTP 503.","code":"- name: Healthcheck\n  run: curl -f http://${{ secrets.EC2_HOST }}:8080/health || exit 1","lang":"yaml","dap_an":["Curl reports failure, and the shell command exits unsuccessfully.","GitHub automatically restores the previously deployed image.","The step passes because an HTTP response was received.","The step retries until the application becomes healthy."],"dung":[0],"giai_thich":"<code>curl -f<\/code> thất bại với mã HTTP lỗi (503) → vế <code>|| exit 1<\/code> chạy → step fail, workflow đỏ ngay (Fail Fast). Không có rollback/retry tự động.","nguon":"CD.pdf tr.23; đề mẫu Q10","muc":"k8-trap-health","demo":10,"hoi":"What happens?"},{"id":"K8-D11","mon":"TTNT","khoi":"K8","loai":"single","de":"SSH reports: <code>Permission denied (publickey)<\/code>\nThe error is an authentication rejection from the intended server. Which check is most directly relevant?","code":null,"lang":null,"dap_an":["Whether the application exposes container port 8000.","Whether the SSH username and key match the server's authorized account.","Whether the Docker image has a latest tag.","Whether the HTTP health endpoint returns JSON."],"dung":[1],"giai_thich":"Lỗi xác thực SSH → kiểm tra cặp username + private key có khớp tài khoản đã authorize public key trên server (copy thiếu dòng BEGIN, sai user…). Các phương án khác không liên quan tới SSH.","nguon":"CD.pdf tr.25; đề mẫu Q11","muc":"k8-trap-perm","demo":11,"hoi":null},{"id":"K8-06","mon":"TTNT","khoi":"K8","loai":"single","de":"A team's pipeline builds, tests and packages automatically, but a person must press an approval button before the release reaches production. Which practice is this?","code":null,"lang":null,"dap_an":["Continuous Integration only","Continuous Delivery","Continuous Deployment","Infrastructure as a Service"],"dung":[1],"giai_thich":"Continuous Delivery: bước đẩy lên Production cần một nút bấm duyệt thủ công. Continuous Deployment: tự động hoàn toàn.","nguon":"CD.pdf tr.5","muc":"k8-y","demo":null,"hoi":null},{"id":"K8-07","mon":"TTNT","khoi":"K8","loai":"single","de":"Which statements about GitHub Secrets are correct?","code":null,"lang":null,"dap_an":["Secret values are encrypted after being entered in Settings.","They are decrypted only when a workflow runs and loaded as environment variables in the runner's memory.","If a secret is accidentally printed to the log, GitHub replaces it with <code>***<\/code>.","All the statements are correct."],"dung":[3],"giai_thich":"Ba cơ chế trong slide: nhập &amp; mã hoá · nạp vào RAM runner khi chạy (không lưu đĩa) · tự che (masking) thành ***. Cả ba đều đúng → chọn “All the statements are correct”.","nguon":"CD.pdf tr.8, 24","muc":"k8-secrets","demo":null,"hoi":null},{"id":"K8-08","mon":"TTNT","khoi":"K8","loai":"single","de":"Why does the lecture build the image on the runner and push it through a registry instead of copying the source to EC2 and building there?","code":null,"lang":null,"dap_an":["Building on EC2 overloads its CPU/RAM and gives inconsistent build environments; EC2 should only pull and run.","EC2 cannot run Docker.","Registries run the containers for EC2.","SSH cannot copy files."],"dung":[0],"giai_thich":"Cách đúng: build ở runner → Docker Hub/ECR → EC2 chỉ pull về chạy: EC2 nhẹ, image đồng nhất ở mọi môi trường.","nguon":"CD.pdf tr.12","muc":"k8-trap-arch","demo":null,"hoi":null},{"id":"K8-09","mon":"TTNT","khoi":"K8","loai":"multi","de":"Which statements about tagging images in this pipeline are correct?","code":null,"lang":null,"dap_an":["Pushing <code>:latest<\/code> on every build is convenient but makes it hard to know which version is running.","A tag based on the commit SHA (<code>github.sha<\/code>) lets you trace and roll back exactly.","Best practice is to push both the latest tag and the commit-SHA tag.","A SHA tag forces EC2 to rebuild the image from source."],"dung":[0,1,2],"giai_thich":"Slide: latest tiện nhưng khó rollback; sha duy nhất cho mỗi build; best practice gán cả hai. Tag không liên quan tới việc build lại.","nguon":"CD.pdf tr.15","muc":"k8-push","demo":null,"hoi":null},{"id":"K8-10","mon":"TTNT","khoi":"K8","loai":"single","de":"Why does the deploy script end with <code>docker image prune -f<\/code>?","code":"script: |\n  cd /home/ubuntu/app\n  docker compose pull\n  docker compose up -d\n  docker image prune -f","lang":"yaml","dap_an":["To delete dangling old images so the EC2 disk does not fill up after many deployments.","To stop all running containers.","To push the new image to Docker Hub.","To remove the .env file."],"dung":[0],"giai_thich":"Mỗi lần deploy tải image mới, image cũ tích tụ → đầy ổ đĩa; prune xoá các dangling image không còn dùng.","nguon":"CD.pdf tr.21","muc":"k8-ssh","demo":null,"hoi":null},{"id":"K8-11","mon":"TTNT","khoi":"K8","loai":"multi","de":"Consider the login step. Which statements are correct?","code":"- name: Log in to Docker Hub\n  uses: docker/login-action@v3\n  with:\n    username: ${{ secrets.DOCKERHUB_USERNAME }}\n    password: ${{ secrets.DOCKERHUB_TOKEN }}","lang":"yaml","dap_an":["It logs in using a Docker access token instead of the real password, which can be revoked if leaked.","Secret values are referenced with the <code>${{ secrets.NAME }}<\/code> syntax.","The token will appear in plain text in the job log.","This step also builds and pushes the image."],"dung":[0,1],"giai_thich":"login-action chỉ đăng nhập; build &amp; push là việc của <code>docker/build-push-action<\/code>. Secret in ra log bị che thành ***.","nguon":"CD.pdf tr.13–14, 24","muc":"k8-push","demo":null,"hoi":null},{"id":"K8-12","mon":"TTNT","khoi":"K8","loai":"single","de":"After a deploy, the container on EC2 keeps crashing with exit code 1. Following the lecture, what should you run on EC2 first?","code":null,"lang":null,"dap_an":["<code>docker logs &lt;container_id&gt;<\/code>","<code>git push --force<\/code>","<code>docker image prune -f<\/code>","<code>ssh-keygen<\/code>"],"dung":[0],"giai_thich":"Container crash (Exit 1/137) thường do thiếu biến môi trường trong .env hoặc xung đột port; <code>docker logs<\/code> hiển thị nguyên nhân lỗi của ứng dụng.","nguon":"CD.pdf tr.26","muc":"k8-debug","demo":null,"hoi":null},{"id":"K8-13","mon":"TTNT","khoi":"K8","loai":"multi","de":"How can the production <code>.env<\/code> be provided on EC2 according to the lecture?","code":null,"lang":null,"dap_an":["Create it manually once on EC2 in the project directory.","Write it from GitHub Secrets inside the SSH script right before <code>docker compose up<\/code>.","Commit it to the repository so the runner can copy it.","Bake it into the Docker image so EC2 does not need it."],"dung":[0,1],"giai_thich":"Hai cách hợp lệ: tạo sẵn thủ công, hoặc ghi động từ Secrets. Không push .env lên Git; image cũng không được chứa .env.","nguon":"CD.pdf tr.22; week5.pdf tr.15","muc":"k8-env","demo":null,"hoi":null},{"id":"K9-01","mon":"TTNT","khoi":"K9","loai":"single","de":"What is a reverse proxy in the lecture's architecture?","code":null,"lang":null,"dap_an":["A layer in front of the application that receives requests from the Internet and forwards them to the application inside.","A DNS record that maps a domain to an IP.","A GitHub Action that deploys to EC2.","A firewall rule for port 22."],"dung":[0],"giai_thich":"Reverse proxy là lớp đứng trước ứng dụng, nhận request từ Internet rồi chuyển vào ứng dụng bên trong.","nguon":"reverse_proxy_https.pdf tr.5","muc":"k9-y","demo":null,"hoi":null},{"id":"K9-02","mon":"TTNT","khoi":"K9","loai":"multi","de":"Why does the system use a reverse proxy?","code":null,"lang":null,"dap_an":["It routes each request to the right application.","It handles HTTPS encryption so the application inside only needs plain HTTP (TLS termination).","It lets the application port (8000) stay closed in the Security Group.","It replaces the need for a domain name."],"dung":[0,1,2],"giai_thich":"Lợi ích: định tuyến, TLS termination; nhờ đó chỉ mở 80/443, không mở port app. Vẫn cần tên miền để có chứng chỉ.","nguon":"reverse_proxy_https.pdf tr.6, 15, 20","muc":"k9-trap-8000","demo":null,"hoi":null},{"id":"K9-03","mon":"TTNT","khoi":"K9","loai":"single","de":"Consider this Caddyfile on the instance. Which statements are correct?","code":"myapp.example.com {\n    reverse_proxy localhost:8000\n}","lang":"caddy","dap_an":["The first line is the domain name.","<code>localhost:8000<\/code> is the internal application address that Caddy forwards requests to.","Caddy automatically obtains and renews a Let's Encrypt certificate for that domain.","All the statements are correct."],"dung":[3],"giai_thich":"Caddyfile tối giản: dòng đầu là tên miền, dòng trong là địa chỉ app; khi khởi động Caddy tự xin chứng chỉ Let's Encrypt cho tên miền đó và tự gia hạn.","nguon":"reverse_proxy_https.pdf tr.11–14","muc":"k9-caddy","demo":null,"hoi":null},{"id":"K9-04","mon":"TTNT","khoi":"K9","loai":"single","de":"You edited <code>/etc/caddy/Caddyfile<\/code> on the instance. Which command applies the new configuration?","code":null,"lang":null,"dap_an":["<code>sudo systemctl reload caddy<\/code>","<code>docker compose pull<\/code>","<code>git push origin main<\/code>","<code>sudo journalctl -u caddy -f<\/code>"],"dung":[0],"giai_thich":"systemctl reload caddy nạp lại cấu hình; journalctl dùng để đọc log.","nguon":"reverse_proxy_https.pdf tr.13","muc":"k9-caddy","demo":null,"hoi":null},{"id":"K9-05","mon":"TTNT","khoi":"K9","loai":"single","de":"Why does the HTTPS setup require a domain name pointing to the instance?","code":null,"lang":null,"dap_an":["Let's Encrypt issues certificates for domain names, not for bare IP addresses.","Caddy cannot listen on an IP address.","Browsers block every IP address.","Docker requires a domain name."],"dung":[0],"giai_thich":"Vì Let's Encrypt chỉ cấp cho tên miền nên cần tên miền (nip.io hoặc tên riêng) trỏ về IP của instance.","nguon":"reverse_proxy_https.pdf tr.15","muc":"k9-trap-ip","demo":null,"hoi":null},{"id":"K9-06","mon":"TTNT","khoi":"K9","loai":"single","de":"The instance's public IP is <code>203.0.113.25<\/code> and you have no domain of your own. Which address can you put in the Caddyfile without any DNS configuration?","code":null,"lang":null,"dap_an":["<code>203.0.113.25.nip.io<\/code>","<code>203.0.113.25<\/code>","<code>localhost:8000<\/code>","<code>nip.io/203.0.113.25<\/code>"],"dung":[0],"giai_thich":"nip.io: ghép IP của instance vào tên miền, đã trỏ sẵn về IP đó.","nguon":"reverse_proxy_https.pdf tr.17–18","muc":"k9-domain","demo":null,"hoi":null},{"id":"K9-07","mon":"TTNT","khoi":"K9","loai":"multi","de":"Which Security Group rules match the lecture for serving the app over HTTPS with Caddy?","code":null,"lang":null,"dap_an":["Port 80/TCP from 0.0.0.0/0, so Let's Encrypt can verify the domain.","Port 443/TCP from 0.0.0.0/0, so users can access HTTPS.","Port 8000 from 0.0.0.0/0, so Caddy can reach the application.","Close port 80 once HTTPS works."],"dung":[0,1],"giai_thich":"Chỉ mở 80 và 443 ra Internet; không thêm rule cho 8000 (Caddy gọi app qua localhost). Port 80 vẫn cần cho việc xác minh/gia hạn.","nguon":"reverse_proxy_https.pdf tr.19–21","muc":"k9-sg","demo":null,"hoi":null},{"id":"K9-08","mon":"TTNT","khoi":"K9","loai":"single","de":"The certificate is not issued and the Caddy log shows a certificate error. The domain's A record is correct. Which cause from the lecture fits, and what is the fix?","code":null,"lang":null,"dap_an":["Port 80 is closed, so Let's Encrypt cannot verify the domain → open port 80.","Port 22 is closed → open port 22.","The app uses FastAPI → switch to Flask.","The image has no latest tag → retag it."],"dung":[0],"giai_thich":"Ba lỗi: port 80 đóng (mở port 80) · tên miền trỏ sai (sửa bản ghi A/chuỗi nip.io) · rate limit (tên miền con mới hoặc chờ). Log chung: <code>sudo journalctl -u caddy -f<\/code>.","nguon":"reverse_proxy_https.pdf tr.23","muc":"k9-debug","demo":null,"hoi":null},{"id":"K9-09","mon":"TTNT","khoi":"K9","loai":"multi","de":"According to the lecture, which items does a certificate contain?","code":null,"lang":null,"dap_an":["The domain name","The issuer","The validity period","The server's private key"],"dung":[0,1,2],"giai_thich":"Chứng chỉ gồm tên miền, bên cấp, hạn dùng và khóa công khai — không bao giờ chứa khóa riêng.","nguon":"reverse_proxy_https.pdf tr.9","muc":"k9-tls","demo":null,"hoi":null},{"id":"K9-10","mon":"TTNT","khoi":"K9","loai":"single","de":"Which order matches the TLS handshake shown in the lecture?","code":null,"lang":null,"dap_an":["Server sends its certificate and the browser checks it → both agree on a shared key → data is encrypted.","Browser sends its private key → server stores it → data is sent in plain text.","Data is encrypted → certificate is sent → key is agreed.","DNS sends the certificate → Caddy decrypts → browser restarts."],"dung":[0],"giai_thich":"Sơ đồ slide: ① máy chủ gửi chứng chỉ, trình duyệt kiểm tra ② thống nhất khóa chung ③ dữ liệu sau đó được mã hoá.","nguon":"reverse_proxy_https.pdf tr.9","muc":"k9-tls","demo":null,"hoi":null},{"id":"K9-11","mon":"TTNT","khoi":"K9","loai":"single","de":"After many failed attempts while fixing the configuration, Let's Encrypt temporarily refuses to issue more certificates for your domain. What does the lecture suggest?","code":null,"lang":null,"dap_an":["Use a new subdomain or wait until the limit expires.","Open port 8000.","Restart the browser.","Delete the Security Group."],"dung":[0],"giai_thich":"Đó là rate limit; cách sửa: dùng tên miền con mới hoặc chờ hết giới hạn.","nguon":"reverse_proxy_https.pdf tr.23","muc":"k9-trap-rate","demo":null,"hoi":null},{"id":"K9-12","mon":"TTNT","khoi":"K9","loai":"single","de":"Which check confirms the HTTPS deployment from the command line by showing the certificate and the HTTPS connection?","code":null,"lang":null,"dap_an":["<code>curl -v https://tên-miền<\/code>","<code>ping tên-miền<\/code>","<code>docker ps<\/code>","<code>git log --oneline<\/code>"],"dung":[0],"giai_thich":"Tiêu chí đạt: ổ khóa xanh trên trình duyệt, curl -v thấy chứng chỉ và kết nối HTTPS, chứng chỉ còn hạn.","nguon":"reverse_proxy_https.pdf tr.24","muc":"k9-debug","demo":null,"hoi":null}],"schedule":[{"date":"3/11","label":"T3 3/11 (tối)","mon":"TTNT","nd":"Ôn K4 (FastAPI, Pydantic) + chạy thử 422 và response_model; ôn K1, K2 Git"},{"date":"4/11","label":"T4 4/11","mon":"TTNT","nd":"Sáng: K3 Linux, K5 Docker. Chiều: K6 CI. Tối: quiz K1–K6"},{"date":"5/11","label":"T5 5/11","mon":"TTNT","nd":"Sáng: K7 EC2, K8 CD, K9 HTTPS. Chiều: quiz K7–K9, làm lại đề Demo_MidTerm. Tối: thi thử và sổ lỗi"},{"date":"6/11","label":"T6 6/11","mon":"TTNT","nd":"Trước giờ thi:
