"lang":null},{"de":"<code>APIRouter(prefix=\"/users\", tags=[\"account\"])<\/code> và <code>@router.get(\"/me\")<\/code>. URL nào khớp?","dap_an":["<code>GET /account/me<\/code>","<code>GET /users/me<\/code>","<code>GET /me/users<\/code>","<code>GET /users/account/me<\/code>"],"dung":[1],"giai_thich":"URL = prefix + path. tags chỉ dùng cho /docs.","code":null,"lang":null},{"de":"Endpoint có <code>response_model=Out(id: int)<\/code> nhưng hàm trả <code>{\"id\": 1, \"pw\": \"x\"}<\/code>. Client nhận gì?","dap_an":["<code>{\"id\": 1, \"pw\": \"x\"}<\/code>","<code>{\"id\": 1, \"pw\": null}<\/code>","<code>{\"id\": 1}<\/code>","Lỗi 422"],"dung":[2],"giai_thich":"response_model lọc bỏ field không khai báo.","code":null,"lang":null}],"docthem":"<p>Sách tham khảo của môn (Pro Git, Linux, Docker Deep Dive) không có chương về FastAPI/PostgreSQL. Nguồn chuẩn cho khối này là slide week4, fastapi_llm và code <code>materials/llm_app/<\/code> (bản <code>single_file/app.py<\/code> và <code>completed/<\/code>).<\/p>"}},{"id":"K5","mon":"TTNT","title":"Docker cơ bản","src":"week5.pdf · Docker Deep Dive · llm_app/Dockerfile","page":{"y":"<p><b>Docker<\/b> đóng gói ứng dụng + mọi thứ nó cần (thư viện, runtime, cấu hình) thành một <b>image<\/b> di động, rồi chạy image đó thành <b>container<\/b> cô lập. Giải bài toán “máy em chạy được, server thì không” (thiếu thư viện, khác phiên bản, khác cấu hình).<\/p>\n<p>Ba động từ: <b>Build<\/b> (Dockerfile → image) · <b>Share<\/b> (registry như Docker Hub) · <b>Run<\/b> (image → một hoặc nhiều container).<\/p><p class=\"src\">Nguồn: week5.pdf tr.2–4<\/p>","mohinh":"<div class=\"diagram\"><svg viewBox=\"0 0 700 270\" width=\"700\" role=\"img\" aria-label=\"Dockerfile tạo image, image tạo nhiều container; client, daemon, registry\">\n<g font-size=\"13\">\n<rect x=\"8\" y=\"30\" width=\"120\" height=\"60\" rx=\"8\" class=\"box\"/><text x=\"22\" y=\"56\" font-weight=\"700\">Dockerfile<\/text><text x=\"22\" y=\"76\" class=\"muted\">công thức<\/text>\n<path d=\"M128 60 h40\" class=\"ln\"/><path d=\"M162 55 l7 5 l-7 5\" class=\"ln\"/><text x=\"132\" y=\"50\" class=\"mono\" font-size=\"11\">build<\/text>\n<rect x=\"172\" y=\"12\" width=\"170\" height=\"104\" rx=\"8\" class=\"boxa\"/><text x=\"184\" y=\"32\" font-weight=\"700\">Image (chỉ đọc)<\/text>\n<rect x=\"186\" y=\"42\" width=\"142\" height=\"18\" class=\"box\"/><text x=\"192\" y=\"56\" font-size=\"11.5\">layer: COPY . .<\/text>\n<rect x=\"186\" y=\"62\" width=\"142\" height=\"18\" class=\"box\"/><text x=\"192\" y=\"76\" font-size=\"11.5\">layer: RUN pip install<\/text>\n<rect x=\"186\" y=\"82\" width=\"142\" height=\"18\" class=\"box\"/><text x=\"192\" y=\"96\" font-size=\"11.5\">base: python:3.12-slim<\/text>\n<path d=\"M342 50 C380 30 390 30 410 30\" class=\"ln\"/><path d=\"M342 64 h68\" class=\"ln\"/><path d=\"M342 78 C380 98 390 98 410 98\" class=\"ln\"/>\n<text x=\"350\" y=\"122\" class=\"mono\" font-size=\"11\">run (1 image → nhiều container)<\/text>\n<rect x=\"412\" y=\"12\" width=\"140\" height=\"34\" rx=\"6\" class=\"box\"/><text x=\"420\" y=\"34\" font-size=\"12\">container A + lớp ghi<\/text>\n<rect x=\"412\" y=\"50\" width=\"140\" height=\"30\" rx=\"6\" class=\"box\"/><text x=\"420\" y=\"70\" font-size=\"12\">container B + lớp ghi<\/text>\n<rect x=\"412\" y=\"84\" width=\"140\" height=\"30\" rx=\"6\" class=\"box\"/><text x=\"420\" y=\"104\" font-size=\"12\">container C + lớp ghi<\/text>\n<text x=\"566\" y=\"40\" font-size=\"12\" class=\"muted\">mỗi container có<\/text><text x=\"566\" y=\"56\" font-size=\"12\" class=\"muted\">danh tính &amp; trạng thái<\/text><text x=\"566\" y=\"72\" font-size=\"12\" class=\"muted\">riêng, dùng chung<\/text><text x=\"566\" y=\"88\" font-size=\"12\" class=\"muted\">kernel của host<\/text>\n<rect x=\"8\" y=\"170\" width=\"150\" height=\"56\" rx=\"8\" class=\"box\"/><text x=\"20\" y=\"192\" font-weight=\"700\">Client<\/text><text x=\"20\" y=\"212\" class=\"mono\" font-size=\"12\">docker run/build…<\/text>\n<path d=\"M158 198 h56\" class=\"ln\"/><path d=\"M208 193 l7 5 l-7 5\" class=\"ln\"/><text x=\"160\" y=\"190\" font-size=\"11\" class=\"muted\">gửi lệnh<\/text>\n<rect x=\"218\" y=\"160\" width=\"230\" height=\"76\" rx=\"8\" class=\"boxa\"/><text x=\"230\" y=\"182\" font-weight=\"700\">Docker daemon (host)<\/text><text x=\"230\" y=\"202\" font-size=\"12\">tạo &amp; quản lý image, container,<\/text><text x=\"230\" y=\"220\" font-size=\"12\">network, volume<\/text>\n<path d=\"M448 198 h56\" class=\"ln\"/><path d=\"M498 193 l7 5 l-7 5\" class=\"ln\"/><path d=\"M506 210 h-56\" class=\"ln dash\"/><text x=\"452\" y=\"190\" font-size=\"11\" class=\"muted\">pull / push<\/text>\n<rect x=\"508\" y=\"170\" width=\"180\" height=\"56\" rx=\"8\" class=\"box\"/><text x=\"520\" y=\"192\" font-weight=\"700\">Registry<\/text><text x=\"520\" y=\"212\" font-size=\"12\">Docker Hub: phân phối image<\/text>\n<text x=\"8\" y=\"258\" font-size=\"12.5\">Registry chỉ lưu/phân phối image — <tspan font-weight=\"700\">không chạy<\/tspan> container. Daemon mới chạy container trên host.<\/text>\n<\/g><\/svg><div class=\"cap\">Dockerfile → Image → Container; Client → Daemon → Registry (week5.pdf tr.4, 6, 8–12)<\/div><\/div>\n<h3 id=\"k5-run-steps\">Điều gì xảy ra khi chạy <code>docker run --rm hello-world<\/code><\/h3>\n<ol><li>Kiểm tra image hello-world có sẵn ở local chưa.<\/li><li>Chưa có → <b>pull<\/b> từ registry.<\/li><li>Tạo <b>container mới<\/b> từ image.<\/li><li>Chạy process mặc định của container.<\/li><li>In kết quả ra terminal.<\/li><li>Container thoát → <b>bị xoá<\/b> nhờ <code>--rm<\/code> (image vẫn còn).<\/li><\/ol><p class=\"src\">Nguồn: week5.pdf tr.7<\/p>","bang":"<h3 id=\"k5-cmd\">Lệnh hay dùng<\/h3><div class=\"tw\"><table><tr><th>Lệnh<\/th><th>Tác dụng<\/th><\/tr><tr><td><code>docker run --rm IMAGE<\/code><\/td><td>chạy container ngắn hạn, tự xoá khi dừng<\/td><\/tr><tr><td><code>docker run -it --name ubuntu-lab ubuntu:24.04 bash<\/code><\/td><td>chạy tương tác (gắn terminal), đặt tên container<\/td><\/tr><tr><td><code>docker run -d --name web -p 8080:80 nginx:alpine<\/code><\/td><td>chạy nền (<code>-d<\/code>); map <b>host 8080 → container 80<\/b><\/td><\/tr><tr><td><code>docker run ... --env-file .env chatbot-api:1.0<\/code><\/td><td>nạp biến môi trường từ file .env lúc chạy<\/td><\/tr><tr><td><code>docker ps<\/code> / <code>docker ps -a<\/code><\/td><td>container đang chạy / tất cả, kể cả đã dừng<\/td><\/tr><tr><td><code>docker start -ai ubuntu-lab<\/code><\/td><td>khởi động lại container đã dừng và gắn vào<\/td><\/tr><tr><td><code>docker stop web<\/code> · <code>docker rm web<\/code><\/td><td>dừng · xoá container (image vẫn còn)<\/td><\/tr><tr><td><code>docker logs web<\/code><\/td><td>xem log của container<\/td><\/tr><tr><td><code>docker exec -it web bash<\/code><\/td><td>chạy thêm một process trong container đang chạy<\/td><\/tr><tr><td><code>docker pull nginx:alpine<\/code> · <code>docker images<\/code><\/td><td>tải image · liệt kê image local<\/td><\/tr><tr><td><code>docker image inspect nginx:alpine<\/code><\/td><td>xem chi tiết/metadata, danh sách layer<\/td><\/tr><tr><td><code>docker image history nginx:alpine<\/code><\/td><td>xem lịch sử build (các layer)<\/td><\/tr><tr><td><code>docker build -t chatbot-api:1.0 .<\/code><\/td><td>build image từ Dockerfile, <code>.<\/code> = build context<\/td><\/tr><tr><td><code>docker tag chatbot-api:1.0 yourusername/chatbot-api:1.0<\/code><\/td><td>gắn tên kèm namespace Docker Hub<\/td><\/tr><tr><td><code>docker login --username yourusername<\/code> → <code>docker push yourusername/chatbot-api:1.0<\/code><\/td><td>đăng nhập rồi đẩy image lên Docker Hub<\/td><\/tr><tr><td><code>docker pull yourusername/chatbot-api:1.0<\/code><\/td><td>kéo về máy khác (repo private → login trước)<\/td><\/tr><\/table><\/div><div class=\"note warn\">Image <b>không được<\/b> chứa <code>.env<\/code>: phải tạo .env trên máy chạy container.<\/div><p class=\"src\">Nguồn: week5.pdf tr.7–15; Docker Deep Dive tr.96 (exec)<\/p>\n<h3 id=\"k5-naming\">Tên image<\/h3><p><code>nginx:alpine<\/code> → <b>nginx<\/b> là repository, <b>alpine<\/b> là tag (biến thể/phiên bản). Repository gom các image liên quan; registry chứa nhiều repository. Không ghi tag → mặc định <code>latest<\/code>.<\/p><p class=\"src\">Nguồn: week5.pdf tr.8; Docker Deep Dive tr.69–71<\/p>\n<h3 id=\"k5-dockerfile\">Dockerfile của app chatbot (llm_app)<\/h3><pre data-lang=\"dockerfile\">FROM python:3.12-slim\nENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PIP_NO_CACHE_DIR=1\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --upgrade pip &amp;&amp; pip install -r requirements.txt\nCOPY . .\nRUN useradd --create-home --uid 10001 appuser &amp;&amp; chown -R appuser:appuser /app\nUSER appuser\nEXPOSE 8000\nCMD [&quot;uvicorn&quot;, &quot;main:app&quot;, &quot;--host&quot;, &quot;0.0.0.0&quot;, &quot;--port&quot;, &quot;8000&quot;]<\/pre><div class=\"tw\"><table><tr><th>Lệnh<\/th><th>Vai trò<\/th><\/tr><tr><td><code>FROM<\/code><\/td><td>image nền (lớp đầu tiên)<\/td><\/tr><tr><td><code>WORKDIR<\/code><\/td><td>thư mục làm việc trong image<\/td><\/tr><tr><td><code>COPY<\/code><\/td><td>chép file từ build context vào image (tạo layer)<\/td><\/tr><tr><td><code>RUN<\/code><\/td><td>chạy lệnh lúc build (tạo layer)<\/td><\/tr><tr><td><code>EXPOSE<\/code><\/td><td><b>ghi chú<\/b> cổng app dùng (metadata) — không tự mở cổng ra host, vẫn cần <code>-p<\/code><\/td><\/tr><tr><td><code>CMD<\/code><\/td><td>lệnh mặc định khi container khởi động (ghi đè được khi <code>docker run<\/code>)<\/td><\/tr><\/table><\/div>\n<p id=\"k5-cache\"><b>Layer cache &amp; .dockerignore<\/b> (từ code mẫu, slide không nói): <code>COPY requirements.txt .<\/code> + <code>RUN pip install<\/code> đặt <b>trước<\/b> <code>COPY . .<\/code> để khi chỉ sửa code, Docker dùng lại layer cài thư viện thay vì cài lại. <code>.dockerignore<\/code> của llm_app loại <code>.env<\/code>, <code>.git<\/code>, <code>__pycache__/<\/code>, <code>.venv/<\/code>… khỏi build context → .env không lọt vào image.<\/p><p class=\"src\">Nguồn: materials/llm_app/completed/Dockerfile, .dockerignore; Docker Deep Dive tr.112–116 (layer vs metadata)<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Đặc điểm<\/th><th>Image<\/th><th>Container<\/th><\/tr><tr><td>Mục đích<\/td><td>khuôn mẫu (template) để tạo container<\/td><td>instance chạy được của image<\/td><\/tr><tr><td>Trạng thái<\/td><td>bất biến, chỉ đọc (các layer read-only)<\/td><td>có <b>lớp ghi mỏng<\/b> (writable layer)<\/td><\/tr><tr><td>Thực thi<\/td><td>tự nó không chạy<\/td><td>chạy một hoặc nhiều process<\/td><\/tr><tr><td>Lưu ở<\/td><td>cache image local hoặc registry<\/td><td>trên Docker host<\/td><\/tr><tr><td>Số lượng<\/td><td>một image dùng lại nhiều lần<\/td><td>mỗi container có danh tính &amp; trạng thái riêng<\/td><\/tr><tr><td>Vòng đời<\/td><td>pull, build, tag, push, remove<\/td><td>create, start, stop, restart, remove<\/td><\/tr><tr><td>Ví von<\/td><td>class / gói cài đặt<\/td><td>object / ứng dụng đang chạy<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week5.pdf tr.12<\/p><div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>Container vs VM<\/td><td>Container dùng chung <b>kernel<\/b> của host OS → nhẹ, khởi động nhanh; VM mỗi máy một hệ điều hành riêng.<\/td><\/tr><tr><td>client vs daemon vs registry<\/td><td>client gửi lệnh; daemon tạo/quản lý image, container, network, volume; registry phân phối image cho host pull. Registry <b>không<\/b> chạy container.<\/td><\/tr><tr><td><code>-p 8080:80<\/code><\/td><td><b>host:container<\/b> — truy cập <code>localhost:8080<\/code> trên máy host để tới cổng 80 trong container.<\/td><\/tr><tr><td><code>-d<\/code> vs <code>-it<\/code><\/td><td>-d chạy nền; -it tương tác, gắn terminal.<\/td><\/tr><tr><td><code>stop<\/code> vs <code>rm<\/code> vs <code>--rm<\/code><\/td><td>stop: dừng, container còn (thấy ở ps -a). rm: xoá container. --rm: tự xoá container khi nó dừng. Không lệnh nào xoá image.<\/td><\/tr><tr><td><code>docker run<\/code> vs <code>docker start<\/code><\/td><td>run tạo container <b>mới<\/b> từ image; start khởi động lại container đã có.<\/td><\/tr><tr><td>repository vs tag<\/td><td>nginx (repo) : alpine (tag).<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week5.pdf tr.5–6, 10–14; Docker Deep Dive tr.87–91<\/p>","bay":"<div class=\"card\" id=\"k5-trap-q18\"><b>Bẫy 1 — “máy em chạy được” (Q18)<\/b><div>Thiếu thư viện trên server → giải pháp Docker trực tiếp: <b>đóng gói app + thư viện cần thiết vào image<\/b>. Không “thay kernel server”, không “dùng thư viện cài sẵn của server”, không “copy log vào registry”.<\/div><\/div><div class=\"card\" id=\"k5-trap-q19\"><b>Bẫy 2 — ai làm gì trong nền tảng Docker (Q19)<\/b><div>Client gửi request tới daemon ✓ · daemon quản lý container &amp; image local ✓ · registry phân phối image để host pull ✓ · registry <b>chạy<\/b> process của container ✗.<\/div><\/div><div class=\"card\" id=\"k5-trap-q20\"><b>Bẫy 3 — image vs container (Q20)<\/b><div>Container có lớp ghi cho thay đổi lúc chạy ✓ · image là template để tạo container ✓ · “mỗi image chỉ tạo được một container” ✗ (một image → nhiều container) · “dừng container biến lớp ghi thành image” ✗ (dừng thì container vẫn là container, dữ liệu còn đó).<\/div><\/div><div class=\"card\" id=\"k5-trap-rm\"><b>Bẫy 4 — <code>--rm<\/code> xoá gì?<\/b><div>Chỉ xoá <b>container<\/b> sau khi nó thoát. Image vẫn còn trong <code>docker images<\/code>.<br><b>Đổi một chỗ:<\/b> bỏ <code>--rm<\/code> → container đã thoát vẫn nằm trong <code>docker ps -a<\/code>.<\/div><\/div><div class=\"card\" id=\"k5-trap-port\"><b>Bẫy 5 — thứ tự cổng trong <code>-p<\/code><\/b><div><code>-p 8080:80<\/code>: host 8080 → container 80. <b>Đổi một chỗ:<\/b> <code>-p 80:8080<\/code> → phải gọi cổng 80 trên host, app trong container phải nghe 8080.<\/div><\/div><div class=\"card\" id=\"k5-trap-life\"><b>Bẫy 6 — container sống bao lâu<\/b><div>Container còn chạy khi <b>process chính<\/b> còn chạy. <code>docker run -it ubuntu bash<\/code> rồi gõ <code>exit<\/code> → bash kết thúc → container dừng (vẫn thấy bằng <code>docker ps -a<\/code>, khởi động lại bằng <code>docker start -ai<\/code>).<\/div><\/div>","checklist":["Bài toán “máy em chạy được” và cách Docker giải quyết; container và VM (container dùng chung kernel)","Kiến trúc: client → daemon → registry; repository và tag (nginx:alpine)","Image (các layer chỉ đọc, là template) và container (thêm một layer ghi được); một image tạo được nhiều container","docker run (--rm, -it, -d, -p host:container, --name, -e), ps -a, stop, rm, images, pull, inspect, history, logs, exec","Dockerfile cho app chatbot: FROM, WORKDIR, COPY, RUN, EXPOSE, CMD; thứ tự lệnh để tận dụng layer cache; .dockerignore; build -t, push","＋ 6 bước của docker run --rm hello-world; --env-file .env; image KHÔNG chứa .env","＋ docker tag + login + push lên Docker Hub; pull ở máy khác (repo private phải login)"],"quick":[{"de":"<code>docker run -d -p 5000:8000 api<\/code>. Gọi URL nào trên máy host để tới app nghe cổng 8000 trong container?","dap_an":["http://localhost:8000","http://localhost:5000","http://container:5000","http://localhost:80"],"dung":[1],"giai_thich":"-p host:container → host 5000.","code":null,"lang":null},{"de":"Sau <code>docker run --rm hello-world<\/code> kết thúc, điều gì còn lại?","dap_an":["Container và image","Chỉ container","Chỉ image hello-world","Không còn gì"],"dung":[2],"giai_thich":"--rm xoá container khi thoát; image vẫn ở local.","code":null,"lang":null},{"de":"Thành phần nào tạo và quản lý container trên host?","dap_an":["Registry","Docker client","Docker daemon","Docker Hub"],"dung":[2],"giai_thich":"Client gửi lệnh, daemon tạo/quản lý, registry phân phối image.","code":null,"lang":null}],"docthem":"<ul><li><b>Multi-stage build<\/b>: một Dockerfile nhiều <code>FROM<\/code>, <code>COPY --from=stage<\/code> chỉ chép thứ cần chạy → image production nhỏ hơn (Docker Deep Dive tr.118–123).<\/li><li><b>Lệnh nào tạo layer<\/b>: FROM, RUN, COPY tạo layer; EXPOSE, WORKDIR, ENV, ENTRYPOINT chỉ thêm metadata (tr.116).<\/li><li><b>CMD và ENTRYPOINT<\/b>: cả hai đặt chương trình mặc định khi container chạy; lệnh mặc định (Cmd) bị ghi đè nếu truyền lệnh khác vào <code>docker container run<\/code> (tr.103, 116).<\/li><li><b>Tag có thể đổi, digest thì không<\/b>: cùng tag có thể trỏ image khác; digest sha256 là hash nội dung, pull theo <code>alpine@sha256:...<\/code> (tr.78–80). <code>latest<\/code> không đảm bảo là mới nhất (tr.71–73).<\/li><li><b>stop và rm -f<\/b>: <code>docker container stop<\/code> gửi SIGTERM cho PID 1, chờ 10 giây rồi SIGKILL; <code>rm -f<\/code> SIGKILL ngay (tr.100–101).<\/li><li><b>Không xoá được image<\/b> khi còn container (kể cả đã dừng) dùng nó → lỗi conflict (tr.66, 84).<\/li><li><b>exec vs exit<\/b>: thoát shell mở bằng <code>docker exec<\/code> không làm dừng container vì process chính vẫn chạy; Ctrl-PQ tách terminal mà không dừng (tr.95–96).<\/li><\/ul>"}},{"id":"K6","mon":"TTNT","title":"CI với GitHub Actions","src":"CI.pdf","page":{"y":"<p><b>CI (Continuous Integration)<\/b>: mỗi khi mã nguồn thay đổi (push / pull request), GitHub Actions tự động <b>kiểm thử và build<\/b> trên một <b>runner<\/b> do GitHub cấp. Mục tiêu: không quên chạy test, ai push cũng chạy đúng các bước như nhau, phát hiện lỗi sớm. CD (tự triển khai sau khi test/build đạt) học ở khối K8.<\/p><p class=\"src\">Nguồn: CI.pdf tr.4–7<\/p>","mohinh":"<div class=\"diagram\"><svg viewBox=\"0 0 660 250\" width=\"660\" role=\"img\" aria-label=\"workflow chứa job, job chứa step, chạy trên runner\">\n<rect x=\"6\" y=\"8\" width=\"648\" height=\"234\" rx=\"10\" class=\"box\"/>\n<text x=\"20\" y=\"30\" font-weight=\"700\">workflow<\/text><text x=\"96\" y=\"30\" class=\"mono muted\" font-size=\"13\">.github/workflows/ci.yml · on: push, pull_request<\/text>\n<rect x=\"22\" y=\"44\" width=\"400\" height=\"186\" rx=\"8\" class=\"boxa\"/>\n<text x=\"36\" y=\"66\" font-weight=\"700\">job: test<\/text><text x=\"110\" y=\"66\" class=\"mono muted\" font-size=\"13\">runs-on: ubuntu-latest<\/text>\n<g font-size=\"13\" class=\"mono\">\n<rect x=\"40\" y=\"78\" width=\"364\" height=\"24\" rx=\"5\" class=\"box\"/><text x=\"50\" y=\"95\">1 uses: actions/checkout@v4<\/text>\n<rect x=\"40\" y=\"106\" width=\"364\" height=\"24\" rx=\"5\" class=\"box\"/><text x=\"50\" y=\"123\">2 uses: actions/setup-python@v5<\/text>\n<rect x=\"40\" y=\"134\" width=\"364\" height=\"24\" rx=\"5\" class=\"box\"/><text x=\"50\" y=\"151\">3 run: pip install -r requirements.txt<\/text>\n<rect x=\"40\" y=\"162\" width=\"364\" height=\"24\" rx=\"5\" class=\"box\"/><text x=\"50\" y=\"179\">4 run: pytest<\/text>\n<rect x=\"40\" y=\"190\" width=\"364\" height=\"24\" rx=\"5\" class=\"box\"/><text x=\"50\" y=\"207\">5 run: docker build -t chat-app .<\/text>\n<\/g>\n<path d=\"M412 90 v118\" class=\"lna\"/><path d=\"M406 200 l6 10 l6 -10\" class=\"lna\"/>\n<text x=\"424\" y=\"150\" font-size=\"12.5\" class=\"muted\">step chạy lần lượt<\/text>\n<rect x=\"450\" y=\"70\" width=\"190\" height=\"150\" rx=\"8\" class=\"box\"/>\n<text x=\"462\" y=\"92\" font-weight=\"700\">runner<\/text>\n<text x=\"462\" y=\"114\" font-size=\"13\">máy thực thi job<\/text>\n<text x=\"462\" y=\"134\" font-size=\"13\">GitHub tự cấp<\/text>\n<text x=\"462\" y=\"154\" font-size=\"13\">chạy xong thì bị xóa<\/text>\n<text x=\"462\" y=\"180\" font-size=\"13\">step fail → job fail<\/text>\n<text x=\"462\" y=\"200\" font-size=\"13\">→ lần chạy ĐỎ<\/text>\n<path d=\"M422 140 h28\" class=\"ln dash\"/>\n<\/svg><div class=\"cap\">workflow → job → step; tất cả chạy trên runner do GitHub cấp (CI.pdf tr.10, 15)<\/div><\/div>\n<h3 id=\"k6-pipeline\">Workflow chạy như thế nào<\/h3><div class=\"flow\"><span class=\"s\">push<\/span><span class=\"ar\">→<\/span><span class=\"s\">checkout<\/span><span class=\"ar\">→<\/span><span class=\"s\">setup python<\/span><span class=\"ar\">→<\/span><span class=\"s\">pip install<\/span><span class=\"ar\">→<\/span><span class=\"s a\">pytest<\/span><span class=\"ar\">→<\/span><span class=\"s\">docker build<\/span><span class=\"ar\">→<\/span><span class=\"s\">finish<\/span><\/div><p class=\"src\">Nguồn: CI.pdf tr.14<\/p>","bang":"<h3 id=\"k6-file\">File workflow<\/h3>\n<p>GitHub Actions chỉ đọc các file trong thư mục <code>.github/workflows/<\/code>. Một file = một quy trình tự động.<\/p><pre data-lang=\"yaml\">name: CI\n\non:\n  push:\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: &quot;3.12&quot;\n      - run: pip install -r requirements.txt\n      - run: pytest\n      - run: docker build -t chat-app .<\/pre><div class=\"tw\"><table><tr><th>Khóa<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>on:<\/code><\/td><td>trigger — sự kiện làm workflow chạy (<code>push<\/code>, <code>pull_request<\/code>)<\/td><\/tr><tr><td><code>branches: [main]<\/code><\/td><td>lọc: chỉ chạy khi sự kiện xảy ra trên nhánh main<\/td><\/tr><tr><td><code>jobs: → test:<\/code><\/td><td>workflow chứa job; <code>test<\/code> là tên job<\/td><\/tr><tr><td><code>runs-on:<\/code><\/td><td>loại runner chạy job (ubuntu-latest)<\/td><\/tr><tr><td><code>steps:<\/code><\/td><td>danh sách step, chạy <b>lần lượt<\/b> trong job<\/td><\/tr><tr><td><code>uses:<\/code><\/td><td>dùng một action có sẵn (checkout code, cài Python, login Docker…)<\/td><\/tr><tr><td><code>run:<\/code><\/td><td>chạy lệnh shell trên runner<\/td><\/tr><tr><td><code>with:<\/code><\/td><td>tham số truyền cho action (ví dụ <code>python-version<\/code>)<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: CI.pdf tr.10–15<\/p>\n<h3 id=\"k6-trigger\">Trigger<\/h3><div class=\"tw\"><table><tr><th>Khai báo<\/th><th>Chạy khi<\/th><th>Không chạy khi<\/th><\/tr><tr><td><code>on: push<\/code><\/td><td>đẩy commit lên GitHub (mọi nhánh)<\/td><td>commit/sửa file ở local mà chưa push<\/td><\/tr><tr><td><code>on: pull_request<\/code><\/td><td>mở pull request → kiểm thử trước khi gộp<\/td><td>chỉ push mà không có PR<\/td><\/tr><tr><td><code>on: push: branches: [main]<\/code><\/td><td>push lên nhánh main<\/td><td>push lên nhánh khác (experiment…), mở PR không kèm push lên main<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: CI.pdf tr.11; CD.pdf tr.13; đề mẫu Q7, Q15<\/p>\n<h3 id=\"k6-pytest\">pytest và cơ chế đỏ/xanh<\/h3><pre data-lang=\"python\">from fastapi.testclient import TestClient\nfrom main import app\n\nclient = TestClient(app)\n\ndef test_health():\n    response = client.get(&quot;/health&quot;)\n    assert response.status_code == 200<\/pre><ul><li>Một bài test không đạt → step <code>pytest<\/code> báo lỗi → job hỏng → lần chạy workflow <b>ĐỎ<\/b>; có thể đặt để <b>chặn gộp<\/b> pull request đang đỏ.<\/li><li>Tất cả test đạt → lần chạy <b>XANH<\/b>.<\/li><li>Nên bắt đầu bằng test đơn giản như <code>/health<\/code> (không gọi LLM) để workflow nhanh, ổn định.<\/li><li>Quy ước pytest: file <code>test_*.py<\/code>, hàm <code>test_...<\/code> (slide chỉ minh họa <code>test_health<\/code>).<\/li><li>Kiểm tra cả status code và <b>toàn bộ<\/b> body: <code>assert response.json() == {...}<\/code> — phải có <code>()<\/code>.<\/li><\/ul><p class=\"src\">Nguồn: CI.pdf tr.17–19; đề mẫu Q17<\/p>\n<h3 id=\"k6-log\">Đọc log khi workflow đỏ<\/h3><div class=\"flow\"><span class=\"s\">Tab Actions<\/span><span class=\"ar\">→<\/span><span class=\"s\">chọn lần chạy đỏ<\/span><span class=\"ar\">→<\/span><span class=\"s\">mở job hỏng<\/span><span class=\"ar\">→<\/span><span class=\"s\">mở step lỗi<\/span><span class=\"ar\">→<\/span><span class=\"s\">đọc thông báo<\/span><\/div><p class=\"src\">Nguồn: CI.pdf tr.23<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>CI vs CD<\/td><td>CI: tự động <b>kiểm thử và build<\/b> mỗi khi mã thay đổi. CD: tự động <b>triển khai<\/b> sau khi test/build đạt (K8).<\/td><\/tr><tr><td>workflow / job / step<\/td><td>workflow (file .yml) chứa job; job chứa step chạy lần lượt.<\/td><\/tr><tr><td>runner vs registry<\/td><td>Runner = máy/môi trường thực thi job. Registry (Docker Hub/ECR) = nơi lưu và phát hành image. Không lẫn.<\/td><\/tr><tr><td>workflow file vs runner<\/td><td>File YAML khai báo sự kiện và các bước; runner là máy chạy các bước đó.<\/td><\/tr><tr><td><code>uses<\/code> vs <code>run<\/code><\/td><td>uses: gọi action có sẵn; run: chạy lệnh shell.<\/td><\/tr><tr><td><code>push<\/code> vs <code>pull_request<\/code><\/td><td>push: mỗi lần đẩy mã lên. pull_request: khi mở PR, kiểm thử trước khi gộp.<\/td><\/tr><tr><td>Kiểm thử tay vs CI<\/td><td>Tay: dễ quên, mỗi người một kiểu, phát hiện muộn. CI: chuỗi kiểm tra nhất quán cho mọi sự kiện khớp, phản hồi sớm. CI <b>không<\/b> tự sửa lỗi.<\/td><\/tr><tr><td><code>response.json()<\/code> vs <code>response.json<\/code><\/td><td>Có ngoặc → dữ liệu body. Không ngoặc → method object (assert luôn đúng, không kiểm tra gì).<\/td><\/tr><tr><td><code>.github/workflows/<\/code> vs chỗ khác<\/td><td>Chỉ <code>.github/workflows/<\/code> được nhận. <code>.git/workflows<\/code>, <code>.github/steps<\/code>, <code>app/actions<\/code> đều sai.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: CI.pdf tr.4–15, 19<\/p>","bay":"<div class=\"card\" id=\"k6-trap-trigger\"><b>Bẫy 1 — trigger có lọc nhánh (Q7)<\/b><div><code>on: push: branches: [main]<\/code>: chỉ push lên <b>main<\/b> mới chạy. Push lên <code>experiment<\/code>, commit local chưa push, hay mở PR mà không push lên main đều <b>không<\/b> chạy.<br><b>Đổi một chỗ:<\/b> thêm <code>pull_request:<\/code> → mở PR cũng chạy; bỏ <code>branches<\/code> → push nhánh nào cũng chạy.<\/div><\/div><div class=\"card\" id=\"k6-trap-q15\"><b>Bẫy 2 — workflow có cả push và pull_request (Q15)<\/b><div>Trigger là <b>push lên repo<\/b> và <b>mở pull request<\/b>. Mọi việc chỉ xảy ra ở máy local (sửa file, commit chưa push) không bao giờ kích hoạt workflow vì GitHub không biết.<\/div><\/div><div class=\"card\" id=\"k6-trap-runner\"><b>Bẫy 3 — runner là gì (Q14)<\/b><div>Runner = <b>máy/môi trường thực thi job<\/b>, cung cấp môi trường cho các step. Không phải registry, không phải file YAML.<\/div><\/div><div class=\"card\" id=\"k6-trap-q12\"><b>Bẫy 4 — CI mang lại gì (Q12)<\/b><div>Phản hồi sớm khi thay đổi làm hỏng test; chuỗi kiểm tra nhất quán cho các sự kiện khớp. CI <b>không tự sửa<\/b> lỗi build.<br><i>Lưu ý:<\/i> đáp án tham khảo của đề mẫu Q12 là <b>c “All the statements are correct”<\/b> dù phương án a (“Automatic correction of every failed build instruction”) trái với slide. Web chấm theo đáp án tham khảo; nếu gặp lại câu này trong đề thật, cân nhắc hỏi lại giảng viên.<\/div><\/div><div class=\"card\" id=\"k6-trap-red\"><b>Bẫy 5 — đỏ ở step nào thì dừng ở đó<\/b><div>Step <code>pytest<\/code> fail → job fail, các step sau (docker build) <b>không chạy<\/b>, lần chạy chuyển đỏ.<br><b>Đổi một chỗ:<\/b> đưa <code>docker build<\/code> lên trước <code>pytest<\/code> → Dockerfile hỏng sẽ làm đỏ trước khi test kịp chạy.<\/div><\/div><div class=\"card\" id=\"k6-trap-json\"><b>Bẫy 6 — test kiểm tra “toàn bộ JSON” (Q17)<\/b><div>Chỉ <code>assert response.json() == {\"status\": \"ok\"}<\/code> kiểm tra cả body. <code>assert {\"status\": \"ok\"}<\/code> luôn đúng (dict khác rỗng); <code>assert response.json<\/code> chỉ kiểm tra method tồn tại; <code>is not None<\/code> không so nội dung.<\/div><\/div>","checklist":["Vì sao cần CI (kiểm thử thủ công dễ quên, không đồng nhất, phát hiện lỗi muộn); CI khác CD thế nào","Phân cấp: workflow → job → step; runner là máy chạy job (GitHub cấp, chạy xong thì xóa)","File đặt ở .github/workflows/*.yml; on: push / pull_request / branches: [main]; runs-on; uses và run; actions/checkout, actions/setup-python","Pipeline: cài đặt → pytest → docker build; một step fail thì job fail (dấu đỏ); đọc log để sửa","pytest: cách đặt tên file và hàm test_, assert, phân biệt json() và json","＋ Có thể chặn gộp PR đang đỏ; thứ tự đọc log: Actions → lần chạy → job → step"],"quick":[{"de":"Workflow khai báo <code>on: pull_request:<\/code> (không có push). Việc nào làm nó chạy?","dap_an":["Push commit lên main","Mở một pull request","Commit ở máy local","Sửa file trên laptop"],"dung":[1],"giai_thich":"Chỉ sự kiện pull_request kích hoạt workflow này.","code":null,"lang":null},{"de":"Trong job, step <code>run: pytest<\/code> có 1 test fail. Điều gì xảy ra?","dap_an":["Job vẫn xanh vì các test khác đạt","Step lỗi → job hỏng → lần chạy chuyển đỏ","GitHub tự sửa test","Runner giữ lại máy để debug mãi mãi"],"dung":[1],"giai_thich":"Một test fail → step pytest báo lỗi → job hỏng → workflow đỏ (CI.pdf tr.18).","code":null,"lang":null},{"de":"Runner là gì?","dap_an":["Nơi lưu image đã build","File YAML khai báo sự kiện","Máy thực thi job do GitHub cấp, chạy xong bị xóa","Một nhánh Git"],"dung":[2],"giai_thich":"Runner là máy thực thi workflow (CI.pdf tr.6).","code":null,"lang":null}]}},{"id":"K7","mon":"TTNT","title":"Cloud và EC2","src":"cloudcomputing_compressed.pdf","page":{"y":"<p>Laptop chỉ chạy khi máy bật, không có địa chỉ công khai ổn định. Để ứng dụng thành <b>dịch vụ thật<\/b>, ta <b>thuê máy chủ ảo<\/b> trên đám mây: <b>AWS EC2<\/b> (mô hình <b>IaaS<\/b>) — chạy liên tục, có <b>Public IP<\/b>, người khác truy cập qua Internet. Truy cập được kiểm soát bởi <b>Security Group<\/b> theo nguyên tắc <b>quyền tối thiểu<\/b>.<\/p><p class=\"src\">Nguồn: cloudcomputing.pdf tr.3, 6–9<\/p>","mohinh":"<div class=\"diagram\"><svg viewBox=\"0 0 680 230\" width=\"680\" role=\"img\" aria-label=\"Security Group bao quanh EC2 instance\">\n<g font-size=\"13\">\n<rect x=\"8\" y=\"20\" width=\"140\" height=\"44\" rx=\"8\" class=\"box\"/><text x=\"20\" y=\"40\" font-weight=\"700\">Sinh viên<\/text><text x=\"20\" y=\"56\" class=\"muted\" font-size=\"12\">My IP · private key .pem<\/text>\n<rect x=\"8\" y=\"150\" width=\"140\" height=\"44\" rx=\"8\" class=\"box\"/><text x=\"20\" y=\"170\" font-weight=\"700\">Người dùng<\/text><text x=\"20\" y=\"186\" class=\"muted\" font-size=\"12\">bất kỳ đâu (0.0.0.0/0)<\/text>\n<rect x=\"230\" y=\"10\" width=\"300\" height=\"200\" rx=\"12\" class=\"boxa\" stroke-dasharray=\"7 4\"/><text x=\"244\" y=\"32\" font-weight=\"700\" class=\"acc\">Security Group (tường lửa)<\/text>\n<text x=\"244\" y=\"52\" font-size=\"12\" class=\"mono\">inbound 22  ← My IP<\/text><text x=\"244\" y=\"68\" font-size=\"12\" class=\"mono\">inbound 80, 443 ← 0.0.0.0/0<\/text><text x=\"244\" y=\"84\" font-size=\"12\" class=\"mono muted\">mặc định: chặn phần lớn lưu lượng vào<\/text>\n<rect x=\"270\" y=\"100\" width=\"220\" height=\"96\" rx=\"8\" class=\"box\"/><text x=\"284\" y=\"122\" font-weight=\"700\">EC2 instance (IaaS)<\/text><text x=\"284\" y=\"142\" font-size=\"12\">AMI: Ubuntu · Public IP<\/text><text x=\"284\" y=\"160\" font-size=\"12\">public key do AWS đặt sẵn<\/text><text x=\"284\" y=\"178\" font-size=\"12\" class=\"mono\">docker compose up -d<\/text>\n<path d=\"M148 42 h118\" class=\"ln\"/><path d=\"M260 37 l7 5 l-7 5\" class=\"ln\"/><text x=\"160\" y=\"36\" font-size=\"11\" class=\"mono\">ssh :22<\/text>\n<path d=\"M148 172 h118\" class=\"ln\"/><path d=\"M260 167 l7 5 l-7 5\" class=\"ln\"/><text x=\"156\" y=\"166\" font-size=\"11\" class=\"mono\">http :80 / https :443<\/text>\n<text x=\"548\" y=\"60\" font-size=\"12\" class=\"muted\">Không mở rule<\/text><text x=\"548\" y=\"76\" font-size=\"12\" class=\"muted\">→ timeout<\/text><text x=\"548\" y=\"110\" font-size=\"12\" class=\"muted\">Không dùng nữa<\/text><text x=\"548\" y=\"126\" font-size=\"12\" class=\"muted\">→ stop/terminate<\/text><text x=\"548\" y=\"142\" font-size=\"12\" class=\"muted\">tránh mất tiền<\/text>\n<\/g><\/svg><div class=\"cap\">EC2 nằm sau Security Group (cloudcomputing.pdf tr.12–16, 18–19)<\/div><\/div>\n<h3 id=\"k7-steps\">Các bước tạo instance<\/h3><div class=\"flow\"><span class=\"s\">Chọn AMI (ảnh HĐH, vd Ubuntu)<\/span><span class=\"ar\">→<\/span><span class=\"s\">Chọn instance type (ưu tiên Free Tier)<\/span><span class=\"ar\">→<\/span><span class=\"s\">Tạo key pair (.pem)<\/span><span class=\"ar\">→<\/span><span class=\"s\">Launch, chờ sẵn sàng<\/span><span class=\"ar\">→<\/span><span class=\"s\">ssh -i my-key.pem ubuntu@&lt;Public IP&gt;<\/span><\/div><p class=\"src\">Nguồn: cloudcomputing.pdf tr.10–13<\/p>","bang":"<h3 id=\"k7-terms\">Thuật ngữ<\/h3><div class=\"tw\"><table><tr><th>Thuật ngữ<\/th><th>Ý nghĩa<\/th><\/tr><tr><td>Điện toán đám mây<\/td><td>thuê tài nguyên máy tính qua Internet thay vì tự mua/vận hành máy chủ vật lý: tạo máy trong vài phút, tăng/giảm khi cần, trả theo mức dùng, xoá khi không cần<\/td><\/tr><tr><td>IaaS<\/td><td>thuê <b>hạ tầng<\/b> (vd máy chủ ảo); người dùng <b>tự cài và quản lý<\/b> phần mềm trên đó. EC2 thuộc IaaS<\/td><\/tr><tr><td>EC2 / instance<\/td><td>dịch vụ tạo máy chủ ảo của AWS / mỗi máy chủ ảo tạo ra<\/td><\/tr><tr><td>AMI<\/td><td>ảnh hệ điều hành dùng để tạo instance — chọn AMI nào, instance chạy HĐH đó<\/td><\/tr><tr><td>Instance type<\/td><td>loại máy (CPU/RAM); chọn loại nằm trong Free Tier<\/td><\/tr><tr><td>Key pair<\/td><td>khóa công khai + khóa riêng để SSH; AWS giữ public key trên instance, bạn giữ private key (.pem) và phải bảo quản an toàn<\/td><\/tr><tr><td>Public IP<\/td><td>địa chỉ công khai để SSH và để người dùng truy cập. Restart instance có thể đổi IP nếu không dùng Elastic IP (CD.pdf tr.25)<\/td><\/tr><tr><td>Security Group<\/td><td>bộ quy tắc tường lửa kiểm soát lưu lượng <b>vào (inbound)<\/b> và <b>ra (outbound)<\/b>; mặc định phần lớn lưu lượng vào bị chặn<\/td><\/tr><tr><td>Free Tier<\/td><td>gói miễn phí giới hạn loại máy và thời lượng — tắt/xóa instance khi không dùng<\/td><\/tr><\/table><\/div>\n<h3 id=\"k7-ports\">Port cần mở cho dự án<\/h3><div class=\"tw\"><table><tr><th>Port<\/th><th>Dùng cho<\/th><th>Nguồn<\/th><\/tr><tr><td>22<\/td><td>SSH<\/td><td><b>chỉ My IP<\/b> (vì là cửa quản trị)<\/td><\/tr><tr><td>80<\/td><td>HTTP (và để Let's Encrypt xác minh — K9)<\/td><td>0.0.0.0/0<\/td><\/tr><tr><td>443<\/td><td>HTTPS (buổi 10)<\/td><td>0.0.0.0/0<\/td><\/tr><tr><td>8000<\/td><td>port app trong stack<\/td><td>không mở khi đã có reverse proxy (K9)<\/td><\/tr><\/table><\/div>\n<h3 id=\"k7-deploy\">Đưa stack Docker lên EC2<\/h3><pre data-lang=\"bash\">ssh -i my-key.pem ubuntu@&lt;dia-chi-cong-khai&gt;\n# trên instance: cài Docker và Docker Compose\n# đưa mã nguồn + docker-compose.yml lên, tạo .env cho thông tin nhạy cảm\ndocker compose up -d\n# mở đúng port trong Security Group rồi gọi http://&lt;dia-chi-cong-khai&gt;<\/pre><p class=\"src\">Nguồn: cloudcomputing.pdf tr.6–19<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>Laptop vs EC2<\/td><td>Laptop: chỉ chạy khi bật, chỉ truy cập trong máy, không có địa chỉ công khai ổn định. EC2: chạy liên tục, Public IP, truy cập qua Internet.<\/td><\/tr><tr><td>IaaS (EC2) vs phần mềm bạn cài<\/td><td>AWS cho thuê máy ảo; HĐH (từ AMI), Docker, app là phần bạn tự cài và quản lý.<\/td><\/tr><tr><td>Inbound vs outbound rule<\/td><td>Vào instance vs ra khỏi instance.<\/td><\/tr><tr><td>My IP vs 0.0.0.0/0<\/td><td>Chỉ địa chỉ của bạn vs mọi nơi trên Internet.<\/td><\/tr><tr><td>Nên vs không nên (quyền tối thiểu)<\/td><td>Nên: chỉ mở port cần dùng, SSH chỉ My IP, xoá rule không dùng. Không nên: mở tất cả port, SSH Anywhere, giữ rule cũ sau bài thực hành.<\/td><\/tr><tr><td>Stop/xoá vs để chạy<\/td><td>Không dùng thì tắt hoặc xoá instance để tránh phát sinh phí.<\/td><\/tr><tr><td>Public key vs private key (EC2)<\/td><td>AWS giữ public key trên instance; sinh viên giữ private key (.pem).<\/td><\/tr><tr><td>Lỗi timeout vs Permission denied<\/td><td>Timeout khi truy cập app/SSH thường do <b>Security Group chưa mở port<\/b>; Permission denied (publickey) là server từ chối xác thực (sai key/user).<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: cloudcomputing.pdf tr.3, 7, 12, 14–17; CD.pdf tr.25<\/p>","bay":"<div class=\"card\" id=\"k7-trap-timeout\"><b>Bẫy 1 — app chạy nhưng trình duyệt timeout<\/b><div>Container chạy, <code>curl localhost<\/code> trên instance OK, nhưng từ ngoài vào bị <b>timeout<\/b> → Security Group chưa có inbound rule cho port đó. Mặc định phần lớn lưu lượng vào bị chặn.<br><b>Đổi một chỗ:<\/b> thêm rule port 80 nguồn 0.0.0.0/0 → truy cập được.<\/div><\/div><div class=\"card\" id=\"k7-trap-ssh\"><b>Bẫy 2 — SSH Anywhere<\/b><div>Mở port 22 cho 0.0.0.0/0 vi phạm quyền tối thiểu. Port 22 chỉ cho My IP; 80/443 mở rộng vì người dùng cần truy cập. (Riêng CD: runner của GitHub cần vào được port 22 — slide CD tr.25 ghi “mở cho IP runner hoặc 0.0.0.0/0”.)<\/div><\/div><div class=\"card\" id=\"k7-trap-iaas\"><b>Bẫy 3 — EC2 thuộc mô hình nào<\/b><div>EC2 = <b>IaaS<\/b> (thuê máy chủ ảo, tự cài phần mềm). Không phải SaaS/PaaS.<\/div><\/div><div class=\"card\" id=\"k7-trap-key\"><b>Bẫy 4 — user và key khi SSH<\/b><div><code>ssh -i my-key.pem ubuntu@&lt;IP&gt;<\/code>: <code>my-key.pem<\/code> là <b>private key<\/b>, <code>ubuntu<\/code> là user của AMI Ubuntu. Đổi IP sau khi restart instance → cập nhật địa chỉ (và secret EC2_HOST).<\/div><\/div><div class=\"card\" id=\"k7-trap-cost\"><b>Bẫy 5 — quên tắt máy<\/b><div>Free Tier có giới hạn; instance chạy ngoài giới hạn vẫn tính tiền → tắt hoặc xoá khi không dùng, xoá rule cũ.<\/div><\/div>","checklist":["Điện toán đám mây, IaaS/PaaS/SaaS; EC2 thuộc IaaS","Tạo instance: AMI, instance type, key pair (.pem), Public IP; SSH với user ubuntu","Security Group: inbound/outbound, port 22/80/443/8000, nguồn 0.0.0.0/0 hay IP cụ thể, nguyên tắc quyền tối thiểu; chẩn đoán lỗi timeout do SG","Free Tier, dừng/xóa instance để tránh mất tiền; đưa Docker/Compose lên EC2","＋ Vì sao triển khai thật: chạy liên tục, Public IP, truy cập qua Internet","＋ Bảng Nên/Không nên của quyền tối thiểu (xoá rule cũ)"],"quick":[{"de":"EC2 thuộc mô hình dịch vụ nào?","dap_an":["SaaS","PaaS","IaaS","On-premise"],"dung":[2],"giai_thich":"EC2 cho thuê máy chủ ảo — IaaS.","code":null,"lang":null},{"de":"App chạy trên EC2 port 80 nhưng từ trình duyệt bị timeout. Nghi đầu tiên?","dap_an":["Thiếu tag latest","Security Group chưa mở inbound port 80","Sai Pydantic model","Thiếu .gitignore"],"dung":[1],"giai_thich":"SG mặc định chặn phần lớn lưu lượng vào.","code":null,"lang":null},{"de":"Cấu hình nào đúng nguyên tắc quyền tối thiểu?","dap_an":["Mở mọi port cho 0.0.0.0/0","22 cho My IP; 80, 443 cho 0.0.0.0/0","22 cho 0.0.0.0/0","Giữ mọi rule cũ"],"dung":[1],"giai_thich":"Chỉ mở cái cần, SSH giới hạn.","code":null,"lang":null}]}},{"id":"K8","mon":"TTNT","title":"CD và triển khai tự động","src":"CD.pdf","page":{"y":"<p><b>CD<\/b> tự động hoá bước đưa ứng dụng ra máy chủ: sau khi CI test/build đạt, workflow <b>push image lên registry<\/b>, rồi <b>SSH vào EC2<\/b> để EC2 <b>pull image mới và chạy<\/b>. Bí mật (token Docker Hub, IP, SSH key) nằm trong <b>GitHub Secrets<\/b>, không bao giờ ghi cứng trong YAML hay code.<\/p>\n<p>Câu hỏi cốt lõi của khối: <b>cái gì nằm ở đâu, lệnh nào chạy ở đâu<\/b> (laptop, runner, registry, EC2).<\/p><p class=\"src\">Nguồn: CD.pdf tr.2–6<\/p>","mohinh":"<div class=\"diagram\"><svg viewBox=\"0 0 700 300\" width=\"700\" role=\"img\" aria-label=\"Pipeline CD dùng registry\">\n<g font-size=\"13\">\n<rect x=\"8\" y=\"20\" width=\"120\" height=\"54\" rx=\"8\" class=\"box\"/><text x=\"20\" y=\"42\" font-weight=\"700\">1 Developer<\/text><text x=\"20\" y=\"62\">git push<\/text>\n<rect x=\"160\" y=\"20\" width=\"160\" height=\"54\" rx=\"8\" class=\"boxa\"/><text x=\"172\" y=\"42\" font-weight=\"700\">2 GitHub Actions<\/text><text x=\"172\" y=\"62\">runner: test &amp; build<\/text>\n<rect x=\"352\" y=\"20\" width=\"160\" height=\"54\" rx=\"8\" class=\"box\"/><text x=\"364\" y=\"42\" font-weight=\"700\">3 Registry<\/text><text x=\"364\" y=\"62\">Docker Hub / ECR<\/text>\n<rect x=\"160\" y=\"170\" width=\"160\" height=\"54\" rx=\"8\" class=\"boxa\"/><text x=\"172\" y=\"192\" font-weight=\"700\">4 SSH trigger<\/text><text x=\"172\" y=\"212\">appleboy/ssh-action<\/text>\n<rect x=\"352\" y=\"170\" width=\"160\" height=\"70\" rx=\"8\" class=\"box\"/><text x=\"364\" y=\"192\" font-weight=\"700\">5 EC2<\/text><text x=\"364\" y=\"210\" class=\"mono\" font-size=\"12\">docker compose pull<\/text><text x=\"364\" y=\"228\" class=\"mono\" font-size=\"12\">docker compose up -d<\/text>\n<rect x=\"548\" y=\"170\" width=\"140\" height=\"54\" rx=\"8\" class=\"box\"/><text x=\"560\" y=\"192\" font-weight=\"700\">6 Live<\/text><text x=\"560\" y=\"212\">restart container<\/text>\n<\/g>\n<path d=\"M128 47 h28\" class=\"ln\"/><path d=\"M150 42 l7 5 l-7 5\" class=\"ln\"/>\n<path d=\"M320 47 h28\" class=\"ln\"/><path d=\"M342 42 l7 5 l-7 5\" class=\"ln\"/>\n<text x=\"326\" y=\"38\" font-size=\"11\" class=\"muted\">push image<\/text>\n<path d=\"M240 74 v92\" class=\"ln\"/><path d=\"M235 160 l5 7 l5 -7\" class=\"ln\"/>\n<path d=\"M320 197 h28\" class=\"ln\"/><path d=\"M342 192 l7 5 l-7 5\" class=\"ln\"/>\n<text x=\"326\" y=\"186\" font-size=\"11\" class=\"muted\">SSH :22<\/text>\n<path d=\"M432 74 v92\" class=\"ln dash\"/><path d=\"M427 160 l5 7 l5 -7\" class=\"ln\"/>\n<text x=\"440\" y=\"122\" font-size=\"11.5\" class=\"muted\">EC2 pull image về<\/text>\n<path d=\"M512 197 h32\" class=\"ln\"/><path d=\"M538 192 l7 5 l-7 5\" class=\"ln\"/>\n<text x=\"8\" y=\"112\" font-size=\"12\" class=\"acc\">Bước 1–2 = CI (K6)<\/text><text x=\"8\" y=\"130\" font-size=\"12\" class=\"acc\">Bước 3–6 = CD (K8)<\/text>\n<text x=\"8\" y=\"270\" font-size=\"12.5\">🔑 Private key: secret EC2_SSH_KEY → nạp vào runner · 🔒 Public key: ~/.ssh/authorized_keys trên EC2<\/text>\n<text x=\"8\" y=\"290\" font-size=\"12.5\">Lệnh trong <tspan class=\"mono\">script:<\/tspan> chạy TRÊN EC2 · step <tspan class=\"mono\">run: curl ...<\/tspan> (healthcheck) chạy trên runner<\/text>\n<\/svg><div class=\"cap\">Kiến trúc CD dùng registry (CD.pdf tr.6, 12, 17, 20)<\/div><\/div><div class=\"tw\"><table><tr><th>Thứ<\/th><th>Nằm / chạy ở đâu<\/th><\/tr><tr><td>Build image<\/td><td>trên <b>runner<\/b> (không build trên EC2)<\/td><\/tr><tr><td>Image đã build<\/td><td><b>registry<\/b> (Docker Hub / AWS ECR)<\/td><\/tr><tr><td>Private key (.pem)<\/td><td>secret <code>EC2_SSH_KEY<\/code> → runner dùng để SSH<\/td><\/tr><tr><td>Public key<\/td><td><code>~/.ssh/authorized_keys<\/code> trên EC2 (tạo ở buổi 8)<\/td><\/tr><tr><td>Lệnh trong <code>script: |<\/code> của ssh-action<\/td><td>chạy <b>trên EC2<\/b> qua kết nối SSH<\/td><\/tr><tr><td>Step <code>run: curl -f ...<\/code><\/td><td>chạy trên <b>runner<\/b>, gọi vào EC2 qua HTTP<\/td><\/tr><tr><td>File <code>.env<\/code> production<\/td><td>trên EC2 (tạo tay hoặc ghi từ Secrets), không có trong Git, không có trong image<\/td><\/tr><tr><td><code>docker-compose.yml<\/code><\/td><td>trong thư mục dự án trên EC2 (vd <code>/home/ubuntu/app<\/code>)<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: CD.pdf tr.12, 17–20, 22–23; week5.pdf tr.15<\/p>","bang":"<h3 id=\"k8-secrets\">GitHub Secrets<\/h3><div class=\"tw\"><table><tr><th>Secret<\/th><th>Dùng cho<\/th><\/tr><tr><td><code>DOCKERHUB_USERNAME<\/code><\/td><td>đăng nhập Docker Hub<\/td><\/tr><tr><td><code>DOCKERHUB_TOKEN<\/code><\/td><td>Docker <b>Access Token<\/b> (thay mật khẩu thật, revoke được ngay khi lộ)<\/td><\/tr><tr><td><code>EC2_HOST<\/code><\/td><td>IP / domain của EC2<\/td><\/tr><tr><td><code>EC2_USERNAME<\/code><\/td><td>user đăng nhập (vd <code>ubuntu<\/code>)<\/td><\/tr><tr><td><code>EC2_SSH_KEY<\/code><\/td><td>toàn bộ nội dung file <b>.pem<\/b> (private key), kể cả dòng <code>-----BEGIN ... PRIVATE KEY-----<\/code><\/td><\/tr><\/table><\/div><ul><li>Tạo ở: <b>Settings › Secrets and variables › Actions › New repository secret<\/b>. Cú pháp dùng: <code>${{ secrets.TEN }}<\/code>.<\/li><li>Cơ chế: nhập → GitHub <b>mã hoá<\/b>; workflow chạy mới giải mã, nạp làm biến môi trường trong <b>RAM runner<\/b> (không lưu đĩa); lỡ in ra log → tự <b>che thành ***<\/b> (masking).<\/li><li>3 cấp: <b>Organization<\/b> (dùng chung công ty) · <b>Repository<\/b> (mọi branch/workflow trong repo — dùng trong bài) · <b>Environment<\/b> (riêng staging/production, có thể cần Reviewers duyệt).<\/li><li>Rủi ro: hardcode vào .yml/source (lịch sử commit giữ vĩnh viễn) hoặc <code>echo $DB_PASSWORD<\/code> ra log.<\/li><\/ul><p class=\"src\">Nguồn: CD.pdf tr.7–11, 24<\/p>\n<h3 id=\"k8-push\">Build &amp; push image (push-image.yml)<\/h3><pre data-lang=\"yaml\">name: Build and Push\non:\n  push:\n    branches: [main]\njobs:\n  build-push:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Log in to Docker Hub\n        uses: docker/login-action@v3\n        with:\n          username: ${{ secrets.DOCKERHUB_USERNAME }}\n          password: ${{ secrets.DOCKERHUB_TOKEN }}\n      - name: Build and push\n        uses: docker/build-push-action@v5<\/pre><div class=\"tw\"><table><tr><th>Tag<\/th><th>Đặc điểm<\/th><\/tr><tr><td><code>:latest<\/code><\/td><td>luôn trỏ bản build mới nhất trong pipeline → tiện nhưng khó rollback, không biết đang chạy bản nào<\/td><\/tr><tr><td><code>:&lt;git-commit-sha&gt;<\/code><\/td><td>mỗi build một tag duy nhất theo <code>github.sha<\/code> → truy vết, rollback chính xác<\/td><\/tr><tr><td>Best practice<\/td><td>gán <b>cả hai<\/b> tag latest + sha khi push<\/td><\/tr><\/table><\/div><p>Kiểm tra: log job Build and Push báo xanh → mở Docker Hub/ECR xem Image Digest và Tags vừa xuất hiện.<\/p><p class=\"src\">Nguồn: CD.pdf tr.13–16<\/p>\n<h3 id=\"k8-ssh\">Deploy qua SSH (deploy.yml)<\/h3><pre data-lang=\"yaml\">- name: Deploy to EC2 via SSH\n  uses: appleboy/ssh-action@v1.0.3\n  with:\n    host: ${{ secrets.EC2_HOST }}\n    username: ${{ secrets.EC2_USERNAME }}\n    key: ${{ secrets.EC2_SSH_KEY }}\n    script: |\n      cd /home/ubuntu/app\n      docker compose pull\n      docker compose up -d\n      docker image prune -f\n\n- name: Healthcheck\n  run: curl -f http://${{ secrets.EC2_HOST }}:8080/health || exit 1<\/pre><div class=\"tw\"><table><tr><th>Phần<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>host / username / key<\/code><\/td><td>thông tin kết nối, lấy từ Secrets (key = private key)<\/td><\/tr><tr><td><code>script: |<\/code><\/td><td>chuỗi lệnh shell chạy <b>trên server EC2<\/b><\/td><\/tr><tr><td><code>docker compose pull<\/code><\/td><td>kéo image mới từ registry<\/td><\/tr><tr><td><code>docker compose up -d<\/code><\/td><td>khởi động lại container ở nền<\/td><\/tr><tr><td><code>docker image prune -f<\/code><\/td><td>xoá dangling image cũ → tránh <b>đầy ổ đĩa<\/b> sau nhiều lần deploy<\/td><\/tr><tr><td><code>curl -f ... || exit 1<\/code><\/td><td><code>-f<\/code>: HTTP lỗi (4xx/5xx) → curl thất bại → <code>exit 1<\/code> → step đỏ ngay. 200 OK → xanh<\/td><\/tr><\/table><\/div><p>Chuẩn bị EC2 (buổi 8): Docker + Compose plugin; user chạy docker không cần sudo: <code>usermod -aG docker ubuntu<\/code>; <code>docker-compose.yml<\/code> nằm trong thư mục dự án.<\/p><p class=\"src\">Nguồn: CD.pdf tr.18–21, 23<\/p>\n<h3 id=\"k8-env\">.env trên server<\/h3><div class=\"tw\"><table><tr><th>Cách<\/th><th>Mô tả<\/th><\/tr><tr><td>1 · Tạo sẵn trên EC2<\/td><td>SSH vào, tạo .env thủ công một lần trong thư mục dự án — đơn giản, hợp cấu hình ít đổi<\/td><\/tr><tr><td>2 · Ghi động từ Secrets<\/td><td>trong script SSH, dùng Secrets ghi đè tạo .env ngay trước <code>docker compose up<\/code> — luôn đồng bộ<\/td><\/tr><\/table><\/div><p>Tuyệt đối không push .env lên Git; image cũng <b>không chứa<\/b> .env.<\/p><p class=\"src\">Nguồn: CD.pdf tr.22; week5.pdf tr.15<\/p>\n<h3 id=\"k8-debug\">Xử lý sự cố<\/h3><div class=\"tw\"><table><tr><th>Triệu chứng<\/th><th>Nguyên nhân thường gặp<\/th><th>Cách xử lý<\/th><\/tr><tr><td><code>Permission denied (publickey)<\/code><\/td><td>private key sai/thiếu (copy thiếu dòng BEGIN…); user không khớp tài khoản trên server; IP EC2 đổi sau restart (không có Elastic IP); SG chặn port 22<\/td><td>kiểm tra username + key khớp tài khoản được authorize; cập nhật EC2_HOST; mở port 22 cho runner<\/td><\/tr><tr><td>Docker login failed<\/td><td>sai username, hoặc dùng mật khẩu thật thay vì Access Token<\/td><td>dùng DOCKERHUB_TOKEN<\/td><\/tr><tr><td>Container crash (Exit Code 1 / 137)<\/td><td>thiếu biến môi trường trong .env, xung đột port trên EC2<\/td><td>trên EC2: <code>docker logs &lt;container_id&gt;<\/code><\/td><\/tr><tr><td>Healthcheck đỏ<\/td><td>app chưa lên / trả 5xx<\/td><td>đọc log từng step, tìm dòng lỗi đầu tiên<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: CD.pdf tr.24–26<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>Continuous <b>Delivery<\/b> vs Continuous <b>Deployment<\/b><\/td><td>Delivery: tự động build/test/đóng gói, bước lên Production cần <b>bấm duyệt tay<\/b>. Deployment: mọi commit qua test đều <b>tự động<\/b> lên Production, không cần người.<\/td><\/tr><tr><td>Build trên runner vs build trên EC2<\/td><td>Đúng: build ở runner → registry → EC2 chỉ pull về chạy (EC2 nhẹ, image đồng nhất). Sai: build trên EC2 (quá tải CPU/RAM, môi trường không đồng nhất).<\/td><\/tr><tr><td>Private key vs public key<\/td><td>Private: runner giữ (secret EC2_SSH_KEY) — “chìa”. Public: EC2 giữ trong authorized_keys — “ổ khoá”.<\/td><\/tr><tr><td><code>script:<\/code> vs <code>run:<\/code><\/td><td><code>script<\/code> của ssh-action chạy trên EC2; <code>run<\/code> của step thường chạy trên runner.<\/td><\/tr><tr><td><code>docker/login-action<\/code> vs <code>docker/build-push-action<\/code><\/td><td>login: đăng nhập registry bằng Secrets. build-push: build và push image trong một bước.<\/td><\/tr><tr><td><code>:latest<\/code> vs <code>:sha<\/code><\/td><td>latest tiện nhưng khó rollback; sha duy nhất, rollback chính xác. Gán cả hai.<\/td><\/tr><tr><td>Access Token vs mật khẩu<\/td><td>Token an toàn hơn, revoke được ngay khi lộ; dùng mật khẩu thật dễ gây login failed.<\/td><\/tr><tr><td>Thao tác tay vs CD<\/td><td>Tay: SSH gõ lệnh, 30–40 phút, dễ sai, phụ thuộc cá nhân. CD: push là chạy, &lt;3 phút, chuẩn hoá, rollback dễ.<\/td><\/tr><tr><td><code>Permission denied (publickey)<\/code> vs timeout<\/td><td>publickey: server đã trả lời nhưng <b>từ chối xác thực<\/b> → kiểm tra user/key. Timeout: không tới được (SG/IP/mạng).<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: CD.pdf tr.4–5, 12, 14–15, 17, 25–26; cloudcomputing.pdf tr.15<\/p>","bay":"<div class=\"card\" id=\"k8-trap-arch\"><b>Bẫy 1 — trình tự kiến trúc (Q6)<\/b><div>Đúng: <b>Push code → test/build → publish image → EC2 pulls and runs it<\/b>. Các phương án “build on EC2”, “SSH to EC2 then build locally”, “publish source files” đều sai mô hình registry.<\/div><\/div><div class=\"card\" id=\"k8-trap-key\"><b>Bẫy 2 — ai giữ khoá nào (Q8)<\/b><div><b>Private key cấp cho runner<\/b> (qua secret), <b>public key được authorize trên EC2<\/b>. Đảo lại (public key trong EC2_SSH_KEY, private key nằm trên EC2/ trong image/ trong log) đều sai.<\/div><\/div><div class=\"card\" id=\"k8-trap-script\"><b>Bẫy 3 — <code>script<\/code> chạy ở đâu (Q9)<\/b><div>Lệnh dưới <code>script:<\/code> chạy <b>trên EC2<\/b> (host đã SSH tới) — không phải trong runner, không phải terminal local, không phải Docker Hub.<br><b>Đổi một chỗ:<\/b> viết cùng các lệnh đó trong một step <code>run:<\/code> → chúng chạy trên runner (sai chỗ).<\/div><\/div><div class=\"card\" id=\"k8-trap-health\"><b>Bẫy 4 — healthcheck gặp 503 (Q10)<\/b><div><code>curl -f<\/code> coi HTTP ≥ 400 là thất bại → <code>|| exit 1<\/code> → step đỏ ngay. Không tự rollback, không tự retry, nhận được response không có nghĩa là pass.<br><b>Đổi một chỗ:<\/b> bỏ <code>-f<\/code> → curl coi 503 là thành công (vẫn nhận được trang lỗi) → step xanh dù app lỗi.<\/div><\/div><div class=\"card\" id=\"k8-trap-perm\"><b>Bẫy 5 — <code>Permission denied (publickey)<\/code> (Q11)<\/b><div>Server đã phản hồi và <b>từ chối xác thực<\/b> → kiểm tra <b>username và key có khớp tài khoản được authorize<\/b>. Port container, tag latest, endpoint JSON không liên quan.<\/div><\/div><div class=\"card\"><b>Bẫy 6 — lộ secret<\/b><div>In <code>echo ${{ secrets.X }}<\/code> ra log: GitHub che thành <code>***<\/code>, nhưng hardcode trong YAML thì lộ vĩnh viễn trong lịch sử commit.<\/div><\/div>","checklist":["Continuous Delivery (cần duyệt tay trước khi deploy) và Continuous Deployment (deploy tự động)","Kiến trúc dùng registry: push → test/build → push image → EC2 pull về và chạy; vì sao không build trên EC2","GitHub Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, EC2_HOST, EC2_USERNAME, EC2_SSH_KEY; cú pháp ${{ secrets.X }}; rủi ro lộ key","docker/login-action, build-push-action, tag image (latest, SHA); appleboy/ssh-action: phần script chạy trên EC2","Healthcheck bằng curl -f ... || exit 1; debug các lỗi Permission denied (publickey), timeout, pull thất bại","＋ Secret masking ***, 3 cấp Secrets (Organization / Repository / Environment)","＋ docker image prune -f sau deploy; usermod -aG docker ubuntu; 2 cách tạo .env trên EC2","＋ Container crash Exit 1/137 → docker logs; Docker login failed → dùng Access Token"],"quick":[{"de":"Trong <code>appleboy/ssh-action<\/code>, các lệnh dưới <code>script: |<\/code> chạy ở đâu?","dap_an":["Trên runner","Trên EC2","Trên Docker Hub","Trên laptop"],"dung":[1],"giai_thich":"Script chạy trên host đã SSH tới (EC2).","code":null,"lang":null},{"de":"Healthcheck <code>curl -f http://host:8080/health || exit 1<\/code>, server trả 500. Kết quả?","dap_an":["Step xanh vì có response","Step đỏ (exit 1)","GitHub tự rollback","Tự retry đến khi khỏe"],"dung":[1],"giai_thich":"-f làm curl thất bại với HTTP lỗi → exit 1.","code":null,"lang":null},{"de":"Mọi commit qua test đều tự lên Production, không cần người duyệt. Đó là:","dap_an":["Continuous Integration","Continuous Delivery","Continuous Deployment","Manual deploy"],"dung":[2],"giai_thich":"Delivery cần một nút duyệt tay; Deployment thì không.","code":null,"lang":null}]}},{"id":"K9","mon":"TTNT","title":"Reverse proxy và HTTPS","src":"reverse_proxy_https.pdf","page":{"y":"<p>Đưa hệ thống ra Internet qua <b>một địa chỉ HTTPS công khai<\/b>: đặt <b>reverse proxy Caddy<\/b> đứng trước ứng dụng. Caddy nhận request từ Internet (HTTPS), lo phần mã hoá (<b>TLS termination<\/b>) và chuyển vào app chạy HTTP thường ở <code>localhost:8000<\/code>. Caddy <b>tự xin và tự gia hạn<\/b> chứng chỉ từ <b>Let's Encrypt<\/b> cho <b>tên miền<\/b> trỏ về IP của instance.<\/p><p class=\"src\">Nguồn: reverse_proxy_https.pdf tr.2–6, 11<\/p>","mohinh":"<div class=\"diagram\"><svg viewBox=\"0 0 700 220\" width=\"700\" role=\"img\" aria-label=\"Caddy đứng trước app, nhận HTTPS và chuyển vào localhost:8000\">\n<g font-size=\"13\">\n<rect x=\"8\" y=\"70\" width=\"130\" height=\"56\" rx=\"8\" class=\"box\"/><text x=\"20\" y=\"92\" font-weight=\"700\">Trình duyệt<\/text><text x=\"20\" y=\"112\" class=\"mono\" font-size=\"12\">https://tên-miền<\/text>\n<rect x=\"8\" y=\"160\" width=\"130\" height=\"44\" rx=\"8\" class=\"box\"/><text x=\"20\" y=\"180\" font-weight=\"700\">Let's Encrypt<\/text><text x=\"20\" y=\"196\" font-size=\"11.5\" class=\"muted\">xác minh qua port 80<\/text>\n<rect x=\"200\" y=\"10\" width=\"480\" height=\"200\" rx=\"12\" class=\"box\" stroke-dasharray=\"7 4\"/><text x=\"214\" y=\"30\" font-weight=\"700\">EC2 · Security Group: chỉ mở 80, 443 (không mở 8000)<\/text>\n<rect x=\"230\" y=\"60\" width=\"200\" height=\"80\" rx=\"8\" class=\"boxa\"/><text x=\"244\" y=\"82\" font-weight=\"700\">Caddy (reverse proxy)<\/text><text x=\"244\" y=\"102\" font-size=\"12\">TLS termination, tự cấp &amp;<\/text><text x=\"244\" y=\"118\" font-size=\"12\">gia hạn chứng chỉ<\/text>\n<rect x=\"480\" y=\"60\" width=\"180\" height=\"80\" rx=\"8\" class=\"box\"/><text x=\"494\" y=\"82\" font-weight=\"700\">App (container)<\/text><text x=\"494\" y=\"102\" class=\"mono\" font-size=\"12\">localhost:8000<\/text><text x=\"494\" y=\"118\" font-size=\"12\">chỉ chạy HTTP thường<\/text>\n<path d=\"M138 98 h88\" class=\"lna\"/><path d=\"M220 93 l7 5 l-7 5\" class=\"lna\"/><text x=\"146\" y=\"90\" class=\"mono\" font-size=\"11\">HTTPS :443<\/text>\n<path d=\"M430 100 h46\" class=\"ln\"/><path d=\"M470 95 l7 5 l-7 5\" class=\"ln\"/><text x=\"434\" y=\"92\" class=\"mono\" font-size=\"11\">HTTP<\/text>\n<path d=\"M138 182 C 190 182 200 150 240 140\" class=\"ln dash\"/><text x=\"150\" y=\"160\" class=\"mono\" font-size=\"11\">:80<\/text>\n<text x=\"230\" y=\"170\" font-size=\"12\" class=\"muted\">Caddyfile: tên-miền { reverse_proxy localhost:8000 }<\/text>\n<text x=\"230\" y=\"190\" font-size=\"12\" class=\"muted\">DNS: bản ghi A tên-miền → Public IP (hoặc IP.nip.io)<\/text>\n<\/g><\/svg><div class=\"cap\">Toàn hệ thống qua địa chỉ HTTPS công khai (reverse_proxy_https.pdf tr.5–6, 12, 16, 19–22)<\/div><\/div>\n<h3 id=\"k9-tls\">Chứng chỉ và bắt tay TLS<\/h3><div class=\"diagram\"><svg viewBox=\"0 0 560 200\" width=\"560\" role=\"img\" aria-label=\"Bắt tay TLS 3 bước\">\n<g font-size=\"13\">\n<text x=\"60\" y=\"20\" font-weight=\"700\">trình duyệt<\/text><text x=\"420\" y=\"20\" font-weight=\"700\">máy chủ<\/text>\n<line x1=\"100\" y1=\"28\" x2=\"100\" y2=\"190\" class=\"ln dash\"/><line x1=\"460\" y1=\"28\" x2=\"460\" y2=\"190\" class=\"ln dash\"/>\n<path d=\"M460 60 H104\" class=\"lna\"/><path d=\"M110 55 l-7 5 l7 5\" class=\"lna\"/><text x=\"200\" y=\"52\">① gửi chứng chỉ → trình duyệt kiểm tra<\/text>\n<path d=\"M104 110 H456\" class=\"lna\"/><path d=\"M110 105 l-7 5 l7 5\" class=\"lna\"/><path d=\"M450 105 l7 5 l-7 5\" class=\"lna\"/><text x=\"210\" y=\"102\">② thống nhất một khóa chung<\/text>\n<rect x=\"104\" y=\"140\" width=\"352\" height=\"30\" rx=\"15\" class=\"nodea\"/><text x=\"170\" y=\"160\" fill=\"#fff\" style=\"fill:#fff\">③ dữ liệu sau đó được mã hóa 🔒<\/text>\n<\/g><\/svg><div class=\"cap\">reverse_proxy_https.pdf tr.9<\/div><\/div>\n<p><b>Chứng chỉ gồm:<\/b> tên miền · bên cấp · hạn dùng · khóa công khai. Chứng chỉ chứng minh danh tính trang và cho phép mã hoá HTTPS. <b>Ổ khóa xanh<\/b> = chứng chỉ hợp lệ và dữ liệu đang được mã hoá.<\/p><p class=\"src\">Nguồn: reverse_proxy_https.pdf tr.8–10<\/p>","bang":"<h3 id=\"k9-caddy\">Caddyfile và lệnh<\/h3><pre data-lang=\"caddy\">myapp.example.com {\n    reverse_proxy localhost:8000\n}<\/pre><div class=\"tw\"><table><tr><th>Dòng / lệnh<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>myapp.example.com {<\/code><\/td><td>dòng đầu: <b>tên miền<\/b> (Caddy xin chứng chỉ cho tên này)<\/td><\/tr><tr><td><code>reverse_proxy localhost:8000<\/code><\/td><td>dòng trong: địa chỉ app bên trong mà Caddy chuyển request tới<\/td><\/tr><tr><td><code>sudo nano /etc/caddy/Caddyfile<\/code><\/td><td>sửa cấu hình trên instance<\/td><\/tr><tr><td><code>sudo systemctl reload caddy<\/code><\/td><td>nạp lại cấu hình<\/td><\/tr><tr><td><code>sudo journalctl -u caddy -f<\/code><\/td><td>đọc log chung khi chứng chỉ không cấp được<\/td><\/tr><tr><td><code>curl -v https://tên-miền<\/code><\/td><td>xem chứng chỉ và kết nối HTTPS<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: reverse_proxy_https.pdf tr.12–13, 23–24<\/p>\n<h3 id=\"k9-domain\">Tên miền<\/h3><div class=\"tw\"><table><tr><th>Cách<\/th><th>Mô tả<\/th><\/tr><tr><td>Vì sao cần<\/td><td>Let's Encrypt cấp chứng chỉ cho <b>tên miền<\/b>, không cấp cho địa chỉ IP thuần<\/td><\/tr><tr><td>Bản ghi A<\/td><td>tên miền có bản ghi A trỏ tới một IP; gõ tên miền → DNS trả IP để trình duyệt biết đi đâu<\/td><\/tr><tr><td>nip.io<\/td><td>dịch vụ tên miền miễn phí trỏ sẵn về IP: ghép IP vào tên, vd <code>203.0.113.25.nip.io<\/code> — không cấu hình thêm<\/td><\/tr><tr><td>Tên miền riêng<\/td><td>vào trang quản lý tên miền, thêm bản ghi A trỏ về Public IP của instance<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: reverse_proxy_https.pdf tr.15–18<\/p>\n<h3 id=\"k9-sg\">Security Group cho HTTPS<\/h3><div class=\"tw\"><table><tr><th>Port<\/th><th>Giao thức<\/th><th>Nguồn<\/th><th>Mục đích<\/th><\/tr><tr><td>80<\/td><td>TCP<\/td><td>0.0.0.0/0<\/td><td>cho Let's Encrypt gửi request xác minh quyền sở hữu tên miền<\/td><\/tr><tr><td>443<\/td><td>TCP<\/td><td>0.0.0.0/0<\/td><td>người dùng truy cập HTTPS<\/td><\/tr><tr><td>8000<\/td><td>—<\/td><td>—<\/td><td><b>không thêm rule<\/b> (app chỉ nhận qua Caddy)<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: reverse_proxy_https.pdf tr.19–21<\/p>\n<h3 id=\"k9-debug\">Ba lỗi khi chứng chỉ không cấp được<\/h3><div class=\"tw\"><table><tr><th>Lỗi<\/th><th>Hiện tượng<\/th><th>Cách sửa<\/th><\/tr><tr><td>Port 80 đóng<\/td><td>Let's Encrypt không xác minh được; log Caddy báo lỗi cấp chứng chỉ<\/td><td>mở port 80<\/td><\/tr><tr><td>Tên miền chưa trỏ đúng<\/td><td>thử thách của Let's Encrypt gửi sai chỗ<\/td><td>kiểm tra bản ghi A hoặc chuỗi nip.io đúng IP<\/td><\/tr><tr><td>Chạm rate limit<\/td><td>xin chứng chỉ quá nhiều lần → tạm thời không cấp thêm<\/td><td>dùng tên miền con mới hoặc chờ hết giới hạn<\/td><\/tr><\/table><\/div><p>Kiểm tra đạt: mở địa chỉ HTTPS thấy ổ khóa xanh · <code>curl -v<\/code> thấy chứng chỉ · xem hạn chứng chỉ còn hiệu lực.<\/p><p class=\"src\">Nguồn: reverse_proxy_https.pdf tr.23–24<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>HTTP vs HTTPS<\/td><td>HTTPS = HTTP + mã hoá; dữ liệu giữa trình duyệt và máy chủ được bảo vệ.<\/td><\/tr><tr><td>Reverse proxy vs app<\/td><td>Proxy đứng trước, nhận request Internet, định tuyến, lo HTTPS; app bên trong chỉ cần HTTP.<\/td><\/tr><tr><td>Chứng chỉ vs Let's Encrypt<\/td><td>Chứng chỉ chứng minh danh tính + cho phép mã hoá; Let's Encrypt là tổ chức cấp chứng chỉ miễn phí.<\/td><\/tr><tr><td>Caddy vs cài chứng chỉ tay<\/td><td>Caddy tự xin và tự gia hạn qua Let's Encrypt khi khởi động; không phải tự xin/cài.<\/td><\/tr><tr><td>Port 80 vs 443<\/td><td>80: Let's Encrypt xác minh (và HTTP); 443: người dùng truy cập HTTPS.<\/td><\/tr><tr><td>nip.io vs tên miền riêng<\/td><td>nip.io: ghép IP vào tên, không cấu hình. Tên miền riêng: tự thêm bản ghi A.<\/td><\/tr><tr><td>Tên miền vs IP thuần<\/td><td>Let's Encrypt chỉ cấp cho tên miền.<\/td><\/tr><tr><td><code>reload caddy<\/code> vs sửa file<\/td><td>Sửa Caddyfile chưa có tác dụng cho tới khi <code>systemctl reload caddy<\/code>.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: reverse_proxy_https.pdf tr.5–21<\/p>","bay":"<div class=\"card\" id=\"k9-trap-8000\"><b>Bẫy 1 — mở port 8000 cho “chắc”<\/b><div>Đã có Caddy thì <b>không<\/b> mở port app (8000) ra Internet; chỉ 80 và 443. Caddy gọi app qua <code>localhost:8000<\/code> ngay trên instance.<\/div><\/div><div class=\"card\" id=\"k9-trap-80\"><b>Bẫy 2 — đóng port 80 vì “đã có HTTPS”<\/b><div>Let's Encrypt xác minh tên miền bằng request tới <b>port 80<\/b>. Đóng 80 → không cấp được chứng chỉ (log Caddy báo lỗi).<\/div><\/div><div class=\"card\" id=\"k9-trap-ip\"><b>Bẫy 3 — dùng IP thuần trong Caddyfile<\/b><div><code>203.0.113.25 { reverse_proxy localhost:8000 }<\/code> → không xin được chứng chỉ Let's Encrypt cho IP thuần. <b>Đổi một chỗ:<\/b> dùng <code>203.0.113.25.nip.io<\/code> → được.<\/div><\/div><div class=\"card\" id=\"k9-trap-file\"><b>Bẫy 4 — đọc Caddyfile<\/b><div>Dòng ngoài ngoặc là <b>tên miền<\/b>; <code>reverse_proxy<\/code> là <b>đích bên trong<\/b>. Đổi app sang port 9000 → sửa thành <code>reverse_proxy localhost:9000<\/code> rồi <code>systemctl reload caddy<\/code>.<\/div><\/div><div class=\"card\" id=\"k9-trap-rate\"><b>Bẫy 5 — xin chứng chỉ liên tục<\/b><div>Thử đi thử lại khi cấu hình sai → chạm <b>rate limit<\/b>, Let's Encrypt tạm ngừng cấp. Sửa: tên miền con mới hoặc chờ; đọc <code>journalctl -u caddy -f<\/code> trước khi thử lại.<\/div><\/div>","checklist":["Reverse proxy là gì, vì sao cần (một cổng vào duy nhất, ẩn port app, TLS termination)","HTTP và HTTPS, chứng chỉ chứa gì, bắt tay TLS, CA, Let's Encrypt, ý nghĩa ổ khóa","Caddy: Caddyfile domain { reverse_proxy localhost:8000 }, systemctl reload caddy, tự cấp và gia hạn chứng chỉ","Tên miền, bản ghi A trỏ về IP, nip.io; cần mở port 80/443 trong SG; chẩn đoán lỗi chứng chỉ và DNS","＋ Let's Encrypt chỉ cấp cho tên miền, xác minh qua port 80","＋ 3 lỗi: port 80 đóng · tên miền trỏ sai · rate limit; journalctl -u caddy -f; curl -v https://..."],"quick":[{"de":"Trong Caddyfile <code>api.10.0.0.5.nip.io { reverse_proxy localhost:8000 }<\/code>, <code>localhost:8000<\/code> là gì?","dap_an":["Tên miền công khai","Địa chỉ app bên trong mà Caddy chuyển request tới","Port của Let's Encrypt","Địa chỉ DNS"],"dung":[1],"giai_thich":"Dòng trong là đích bên trong.","code":null,"lang":null},{"de":"Vì sao phải mở port 80 dù người dùng vào bằng HTTPS?","dap_an":["Để SSH","Để Let's Encrypt xác minh tên miền","Để app nhận request trực tiếp","Không cần mở"],"dung":[1],"giai_thich":"Let's Encrypt gửi request xác minh qua port 80.","code":null,"lang":null},{"de":"Ổ khóa xanh trên trình duyệt nghĩa là gì?","dap_an":["Server không có lỗi","Chứng chỉ hợp lệ và dữ liệu đang được mã hoá","Trang không có quảng cáo","Port 8000 đang mở"],"dung":[1],"giai_thich":"reverse_proxy_https.pdf tr.9–10.","code":null,"lang":null}]}},{"id":"C1","mon":"MMT","title":"Tổng quan về mạng máy tính","src":"chuong 1 v2.pdf","soon":true,"page":{}},{"id":"C2","mon":"MMT","title":"Tầng ứng dụng","src":"chuong 2 v1.pdf","soon":true,"page":{}},{"id":"C3","mon":"MMT","title":"Tầng giao vận","src":"chuong 3 Tang giao van.pdf","soon":true,"page":{}},{"id":"C4","mon":"MMT","title":"Tầng mạng","src":"chuong 4 v1.pdf","soon":true,"page":{}}],"questions":[{"id":"K1-01","mon":"TTNT","khoi":"K1","loai":"single","de":"In a clean repository on <code>master<\/code>, you run the commands below. How does <code>git status<\/code> report README?","code":"echo 'My Project' > README\ngit status","lang":"bash","dap_an":["Under \"Changes to be committed: new file\"","Under \"Untracked files\"","Under \"Changes not staged for commit: modified\"","It does not appear because it is ignored by default"],"dung":[1],"giai_thich":"File mới chưa từng <code>git add<\/code> là untracked. Sau <code>git add README<\/code> nó mới vào “Changes to be committed”.","nguon":"week01.pdf tr.47–49","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-02","mon":"TTNT","khoi":"K1","loai":"multi","de":"Which statements about <code>git commit -a -m \"Update notes.txt\"<\/code> are correct?","code":null,"lang":null,"dap_an":["It automatically stages every tracked file that has been modified.","A brand-new untracked file is not included in the commit.","It also adds every new file in the working directory.","It uploads the commit to origin."],"dung":[0,1],"giai_thich":"commit -a bỏ qua bước git add <b>chỉ cho file đã track<\/b>. Commit luôn là thao tác local; push mới đưa lên remote.","nguon":"week01.pdf tr.56; ex1.docx Part B.6","muc":"k1-trap-a","demo":null,"hoi":null},{"id":"K1-03","mon":"TTNT","khoi":"K1","loai":"multi","de":"Given this short status output, which statements are correct?","code":" M README\nMM Rakefile\nA  lib/git.rb\nM  lib/simplegit.rb\n?? LICENSE.txt","lang":"text","dap_an":["README is modified in the working tree but not staged.","Rakefile has both staged and unstaged changes.","LICENSE.txt is untracked.","lib/simplegit.rb is modified but not yet staged."],"dung":[0,1,2],"giai_thich":"Cột trái = staging, cột phải = working tree. <code>M␣<\/code> ở lib/simplegit.rb nghĩa là đã sửa <b>và đã stage<\/b>.","nguon":"week01.pdf tr.51; Pro Git tr.37–38","muc":"k1-short","demo":null,"hoi":null},{"id":"K1-04","mon":"TTNT","khoi":"K1","loai":"single","de":"You edit <code>notes.txt<\/code> (already tracked) and then run the commands below. What does the last command print?","code":"git add notes.txt\ngit diff","lang":"bash","dap_an":["The changes to notes.txt","Nothing, because all changes are staged; use <code>git diff --staged<\/code> to see them","The full history of notes.txt","An error, because notes.txt is staged"],"dung":[1],"giai_thich":"<code>git diff<\/code> so working tree với staging area → không còn gì khác biệt. <code>git diff --staged<\/code> mới so staging với commit cuối.","nguon":"week01.pdf tr.53; Pro Git tr.40","muc":"k1-trap-diff","demo":null,"hoi":null},{"id":"K1-05","mon":"TTNT","khoi":"K1","loai":"multi","de":"With this <code>.gitignore<\/code> at the repository root, which files are ignored?","code":"*.a\n!lib.a\n/TODO\nbuild/\ndoc/*.txt","lang":"bash","dap_an":["<code>src/foo.a<\/code>","<code>lib.a<\/code>","<code>subdir/TODO<\/code>","<code>doc/notes.txt<\/code>"],"dung":[0,3],"giai_thich":"<code>*.a<\/code> áp dụng đệ quy nên src/foo.a bị bỏ qua; <code>!lib.a<\/code> phủ định nên lib.a vẫn track; <code>/TODO<\/code> chỉ áp dụng ở gốc; <code>doc/*.txt<\/code> khớp doc/notes.txt.","nguon":"week01.pdf tr.52; Pro Git tr.38–39","muc":"k1-trap-glob","demo":null,"hoi":null},{"id":"K1-06","mon":"TTNT","khoi":"K1","loai":"single","de":"You accidentally committed <code>config.env<\/code>. You run the command below and commit. What happens to the file?","code":"git rm --cached config.env","lang":"bash","dap_an":["Git stops tracking it, but the file stays on your disk.","It is deleted from the disk and from Git.","It is moved into .gitignore automatically.","Nothing; --cached only affects the remote."],"dung":[0],"giai_thich":"<code>git rm --cached<\/code> chỉ gỡ khỏi staging/tracking, giữ file local. Nên thêm nó vào .gitignore để không bị add lại.","nguon":"week01.pdf tr.57; Pro Git tr.44–45","muc":"k1-trap-ignore","demo":null,"hoi":null},{"id":"K1-07","mon":"TTNT","khoi":"K1","loai":"single","de":"<code>git mv draft.md README2.md<\/code> is a shortcut for which sequence?","code":null,"lang":null,"dap_an":["<code>mv draft.md README2.md; git rm draft.md; git add README2.md<\/code>","<code>cp draft.md README2.md; git add draft.md<\/code>","<code>git rm --cached draft.md<\/code>","<code>git commit -a<\/code>"],"dung":[0],"giai_thich":"Slide: git mv = đổi tên + git rm tên cũ + git add tên mới; Git nhận diện rename bằng độ tương đồng.","nguon":"week01.pdf tr.58","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-08","mon":"TTNT","khoi":"K1","loai":"multi","de":"A teammate edited README.md directly on GitHub. Which statements are correct?","code":null,"lang":null,"dap_an":["<code>git fetch origin<\/code> downloads the new commit and moves origin/main, without merging it.","<code>git pull<\/code> fetches and then merges it into your current branch.","<code>git fetch<\/code> immediately changes README.md in your working directory.","<code>git push<\/code> succeeds even though the remote has a commit you don't have."],"dung":[0,1],"giai_thich":"fetch chỉ tải và cập nhật remote-tracking branch; pull = fetch + merge. Push thất bại nếu remote có commit bạn chưa có.","nguon":"week01.pdf tr.69–70; week02.pdf tr.42–44; ex1.docx Part C","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-09","mon":"TTNT","khoi":"K1","loai":"single","de":"Which email will commits made inside <code>project<\/code> use?","code":"git config --global user.email \"a@x.com\"\ncd project\ngit config user.email \"b@y.com\"","lang":"bash","dap_an":["<code>a@x.com<\/code>, because --global always wins","<code>b@y.com<\/code>, because the repository (local) level overrides global","Both emails","The system-level email"],"dung":[1],"giai_thich":"Thứ tự ưu tiên: Local &gt; Global &gt; System.","nguon":"week01.pdf tr.38–39","muc":"k1-config","demo":null,"hoi":null},{"id":"K1-10","mon":"TTNT","khoi":"K1","loai":"single","de":"After these commands, what does the history contain?","code":"git commit -m 'Initial commit'\ngit add forgotten_file\ngit commit --amend","lang":"bash","dap_an":["Two commits: 'Initial commit' and a second one with forgotten_file","One commit, which now also includes forgotten_file","One commit without forgotten_file; it stays staged","An error: you cannot amend after adding files"],"dung":[1],"giai_thich":"<code>--amend<\/code> thay thế commit trước bằng commit mới chứa nội dung staging hiện tại → chỉ còn 1 commit.","nguon":"week01.pdf tr.63; Pro Git tr.53","muc":"k1-trap-amend","demo":null,"hoi":null},{"id":"K1-11","mon":"TTNT","khoi":"K1","loai":"multi","de":"Which statements about these commands are correct?","code":"git tag -a v1.4 -m \"my version 1.4\"\ngit push origin main","lang":"bash","dap_an":["The annotated tag stores the tagger name, email, date and message.","<code>git push origin main<\/code> also uploads the tag v1.4.","<code>git push origin v1.4<\/code> shares the tag with the remote.","The tag moves forward automatically with new commits, like a branch."],"dung":[0,2],"giai_thich":"Tag không được push mặc định, phải push tên tag. Tag đánh dấu một điểm cố định, không di chuyển như branch.","nguon":"week01.pdf tr.73–76","muc":"k1-trap-push","demo":null,"hoi":null},{"id":"K1-12","mon":"TTNT","khoi":"K1","loai":"multi","de":"Which statements about <code>git clone &lt;url&gt;<\/code> are correct?","code":null,"lang":null,"dap_an":["It copies the entire project history, not just the latest snapshot.","It adds a remote named origin by default.","It downloads only the latest snapshot to save space.","Every clone is effectively a full backup of the project."],"dung":[0,1,3],"giai_thich":"clone: tạo thư mục, git init, thêm remote origin, git fetch, checkout commit mới nhất. Vì chép toàn bộ lịch sử nên mỗi clone là một bản backup.","nguon":"week01.pdf tr.12, 45–46","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-13","mon":"TTNT","khoi":"K1","loai":"single","de":"In a new repository you run the commands below. Which objects does Git store for this commit?","code":"git add README test.rb LICENSE\ngit commit -m 'Initial commit'","lang":"bash","dap_an":["3 blobs + 1 tree + 1 commit","3 diffs + 1 commit","1 blob + 3 trees + 1 commit","3 commits, one per file"],"dung":[0],"giai_thich":"Mỗi nội dung file là một blob, cấu trúc thư mục là một tree, cộng một commit object trỏ tới tree.","nguon":"week01.pdf tr.81–83","muc":"k1-objects","demo":null,"hoi":null},{"id":"K2-01","mon":"TTNT","khoi":"K2","loai":"single","de":"You are on <code>master<\/code> and run the commands below. Which branch pointer moves to the new commit?","code":"git branch testing\nvim test.rb\ngit commit -a -m 'Make a change'","lang":"bash","dap_an":["testing","master","Both master and testing","Neither; the commit is detached"],"dung":[1],"giai_thich":"<code>git branch<\/code> chỉ tạo con trỏ, không chuyển HEAD. HEAD vẫn trỏ master nên master tiến lên.","nguon":"week02.pdf tr.4–7","muc":"k2-trap-branch","demo":null,"hoi":null},{"id":"K2-02","mon":"TTNT","khoi":"K2","loai":"multi","de":"Which commands create a branch named <code>iss53<\/code> and switch to it?","code":null,"lang":null,"dap_an":["<code>git branch iss53<\/code> followed by <code>git checkout iss53<\/code>","<code>git switch -c iss53<\/code>","<code>git switch iss53<\/code> (when iss53 does not exist yet)","<code>git branch -d iss53<\/code>"],"dung":[0,1],"giai_thich":"<code>checkout -b<\/code> / <code>switch -c<\/code> tạo và chuyển trong một lệnh. <code>switch<\/code> không có -c chỉ chuyển sang nhánh đã tồn tại.","nguon":"week02.pdf tr.10–11","muc":"k2-cmd","demo":null,"hoi":null},{"id":"K2-03","mon":"TTNT","khoi":"K2","loai":"single","de":"<code>master<\/code> points to C2 and <code>hotfix<\/code> points to C4, a direct descendant of C2. What does Git do?","code":"git checkout master\ngit merge hotfix","lang":"bash","dap_an":["Moves master forward to C4 without creating a new commit (fast-forward).","Creates a merge commit with two parents.","Reports a conflict because history diverged.","Rewrites C4 on top of master."],"dung":[0],"giai_thich":"Commit được merge có thể đi tới bằng cách theo lịch sử của commit hiện tại → không có công việc rẽ nhánh → fast-forward.","nguon":"week02.pdf tr.12–13; Pro Git tr.79","muc":"k2-ff","demo":null,"hoi":null},{"id":"K2-04","mon":"TTNT","khoi":"K2","loai":"multi","de":"<code>master<\/code> and <code>iss53<\/code> have diverged. You run <code>git checkout master; git merge iss53<\/code> with no conflicts. Which statements are correct?","code":null,"lang":null,"dap_an":["Git uses the two branch tips and their common ancestor.","The result is a new merge commit with two parents.","It is a fast-forward.","Git rewrites the commits of iss53."],"dung":[0,1],"giai_thich":"Three-way merge khi hai nhánh đã rẽ: hai đầu nhánh + tổ tiên chung → merge commit có 2 cha. Merge không viết lại commit (rebase mới làm vậy).","nguon":"week02.pdf tr.14; week01.pdf tr.82","muc":"k2-mohinh","demo":null,"hoi":null},{"id":"K2-05","mon":"TTNT","khoi":"K2","loai":"multi","de":"You ran <code>git merge iss53<\/code> while on <code>master<\/code> and index.html now contains the block below. Which statements are correct?","code":"<<<<<<< HEAD:index.html\n<div id=\"footer\">contact : email.support@github.com<\/div>\n=======\n<div id=\"footer\">please contact us at support@github.com<\/div>\n>>>>>>> iss53:index.html","lang":"text","dap_an":["The part above <code>=======<\/code> is the version from master (HEAD).","After editing the file and removing all markers, run <code>git add index.html<\/code> and then <code>git commit<\/code>.","Git has already created the merge commit automatically.","The part above <code>=======<\/code> comes from iss53."],"dung":[0,1],"giai_thich":"HEAD = nhánh đang đứng (master) ở phía trên. Khi conflict, Git dừng lại, chưa tạo merge commit; sửa xong add để đánh dấu đã giải quyết rồi commit.","nguon":"Pro Git tr.83–84","muc":"k2-conflict","demo":null,"hoi":null},{"id":"K2-06","mon":"TTNT","khoi":"K2","loai":"single","de":"What happens, and how can you delete the branch anyway?","code":"$ git branch --no-merged\n  testing\n$ git branch -d testing","lang":"bash","dap_an":["It fails with 'not fully merged'; <code>git branch -D testing<\/code> forces the deletion and discards the unmerged work.","It succeeds silently.","It fails; <code>git push origin --delete testing<\/code> is required first.","It merges testing into the current branch, then deletes it."],"dung":[0],"giai_thich":"<code>-d<\/code> chặn xoá nhánh còn công việc chưa merge; <code>-D<\/code> bỏ qua kiểm tra và mất công việc đó vĩnh viễn.","nguon":"week02.pdf tr.25–27","muc":"k2-cmd","demo":null,"hoi":null},{"id":"K2-07","mon":"TTNT","khoi":"K2","loai":"single","de":"Which command lists the branches whose work is <b>not yet<\/b> merged into the branch you currently have checked out?","code":null,"lang":null,"dap_an":["<code>git branch --no-merged<\/code>","<code>git branch --merged<\/code>","<code>git branch -v<\/code>","<code>git log --graph<\/code>"],"dung":[0],"giai_thich":"--merged / --no-merged lọc theo trạng thái merge so với nhánh hiện tại.","nguon":"week02.pdf tr.22–25; ex2.docx Part B.2","muc":"k2-cmd","demo":null,"hoi":null},{"id":"K2-08","mon":"TTNT","khoi":"K2","loai":"single","de":"You want to rename the shared branch <code>wip<\/code> to <code>work-in-progress<\/code> so collaborators see the new name. Which sequence is correct?","code":null,"lang":null,"dap_an":["<code>git branch --move wip work-in-progress<\/code> → <code>git push --set-upstream origin work-in-progress<\/code> → <code>git push origin --delete wip<\/code>","<code>git push origin --delete wip<\/code> only","<code>git checkout -b work-in-progress<\/code> → <code>git branch -D wip<\/code>","<code>git remote rename wip work-in-progress<\/code>"],"dung":[0],"giai_thich":"Đổi tên local, đẩy tên mới lên và đặt upstream, rồi xoá tên cũ trên remote (tên cũ vẫn còn cho tới khi xoá).","nguon":"week02.pdf tr.29–31; ex2.docx Part B.4","muc":"k2-trap-rename","demo":null,"hoi":null},{"id":"K2-09","mon":"TTNT","khoi":"K2","loai":"multi","de":"Consider this output. Which statements are correct?","code":"$ git branch -vv\n  iss53     7e424c3 [origin/iss53: ahead 2] Add forgotten brackets\n  master    1ae2a45 [origin/master] Deploy index fix\n* serverfix f8674d9 [teamone/server-fix-good: ahead 3, behind 1] This should do it\n  testing   5ea463a Try something new","lang":"text","dap_an":["serverfix has 3 local commits not pushed and 1 commit on the server not yet merged locally.","testing has no upstream branch.","The ahead/behind numbers are always live, even without fetching.","master tracks origin/master and was up to date at
