<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi giữa kỳ TTNT + MMT</title>
<style>
:root{
  --bg:#FAFAF7; --fg:#1F2328; --muted:#5b636e; --line:#dcdcd5; --card:#ffffff; --soft:#f1f1ec;
  --ttnt:#1F6FEB; --mmt:#B35900; --ok:#1A7F37; --bad:#CF222E; --warn:#9a6700;
  --acc:var(--ttnt);
  --code-bg:#f4f4ef; --code-fg:#1F2328;
  --font:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"]{
  --bg:#16181c; --fg:#e6e6e1; --muted:#9aa1ab; --line:#30343b; --card:#1d2025; --soft:#23272d;
  --code-bg:#22262c; --code-fg:#e6e6e1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55}
a{color:var(--acc)}
button{font:inherit;cursor:pointer}
code,pre,kbd{font-family:var(--mono);font-size:.88em}
:not(pre)>code{background:var(--code-bg);padding:1px 5px;border-radius:4px;white-space:normal;overflow-wrap:anywhere}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}
.layout{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:268px;flex:0 0 268px;border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg)}
.side .brand{font-weight:700;font-size:15px;padding:4px 8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side .brand a{color:var(--fg);text-decoration:none}
.grp{margin:10px 0 4px;padding:4px 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.grp.ttnt{color:var(--ttnt)} .grp.mmt{color:var(--mmt)} .grp.tool{color:var(--muted)}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--soft)}
.nav a.cur{background:var(--soft);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.nav a .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .sub{padding-left:22px;font-size:13px;color:var(--muted)}
.badge{flex:0 0 auto;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.done{border-color:var(--ok);color:var(--ok)}
.badge.good{background:var(--ok);border-color:var(--ok);color:#fff}
.badge.low{background:var(--bad);border-color:var(--bad);color:#fff}
.badge.lock{border-style:dashed}
.badge.soon{border-style:dotted}
/* ---------- top bar (mobile) ---------- */
.topbar{display:none}
@media (max-width:900px){
  .layout{display:block}
  .side{display:none;position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px 12px}
  .side.open{display:block}
  .topbar{display:flex;position:sticky;top:0;z-index:10;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar .t{font-weight:700;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .side .brand{display:none}
}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 14px;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 10px;font-size:13px}
/* ---------- main ---------- */
main{flex:1;min-width:0}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:26px;line-height:1.25;margin:4px 0 6px}
h2{font-size:19px;margin:30px 0 10px;padding-top:6px;scroll-margin-top:70px}
h3{font-size:16px;margin:18px 0 6px;scroll-margin-top:70px}
[id]{scroll-margin-top:70px}
.kicker{font-size:13px;color:var(--muted)}
.kicker b{color:var(--acc)}
.secnum{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;margin-right:8px;vertical-align:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.note{border-left:3px solid var(--acc);background:var(--card);padding:8px 12px;margin:10px 0;border-radius:0 8px 8px 0;font-size:15px}
.note.warn{border-color:var(--warn)} .note.bad{border-color:var(--bad)} .note.ok{border-color:var(--ok)}
.src{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{white-space:normal;word-break:break-word}
ul,ol{padding-left:22px} li{margin:3px 0}
pre{background:var(--code-bg);color:var(--code-fg);padding:10px 12px;border-radius:8px;overflow-x:auto;line-height:1.45;margin:10px 0;border:1px solid var(--line)}
pre code{font-size:13.5px}
.tk-c{color:#6e7781;font-style:italic} .tk-s{color:#0a3069} .tk-k{color:#cf222e;font-weight:600} .tk-n{color:#0550ae} .tk-f{color:#8250df} .tk-v{color:#953800}
:root[data-theme="dark"] .tk-s{color:#a5d6ff} :root[data-theme="dark"] .tk-k{color:#ff7b72} :root[data-theme="dark"] .tk-n{color:#79c0ff} :root[data-theme="dark"] .tk-f{color:#d2a8ff} :root[data-theme="dark"] .tk-v{color:#ffa657}
.diagram{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;overflow-x:auto}
.diagram svg{display:block;max-width:100%;height:auto;margin:0 auto}
.diagram .cap{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
svg text{font-family:var(--font);fill:var(--fg)}
svg .mono{font-family:var(--mono)}
svg .box{fill:var(--card);stroke:var(--fg);stroke-width:1.2}
svg .boxa{fill:var(--soft);stroke:var(--acc);stroke-width:1.6}
svg .ln{stroke:var(--fg);stroke-width:1.4;fill:none}
svg .lna{stroke:var(--acc);stroke-width:1.8;fill:none}
svg .dash{stroke-dasharray:5 4}
svg .muted{fill:var(--muted)}
svg .acc{fill:var(--acc)}
svg .okf{fill:var(--ok)} svg .badf{fill:var(--bad)}
svg .node{fill:var(--card);stroke:var(--fg);stroke-width:1.5}
svg .nodea{fill:var(--acc);stroke:var(--acc)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span.s{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 9px;font-size:14px}
.flow span.s.a{border-color:var(--acc);background:var(--soft);font-weight:600}
.flow span.ar{color:var(--muted)}
/* checklist */
.chk label{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:15px}
.chk label:last-child{border-bottom:0}
.chk input{margin-top:5px;flex:0 0 auto;width:16px;height:16px;accent-color:var(--ok)}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.q .qh{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.q .de{font-size:16px;font-weight:500;white-space:pre-line}
.opts{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--bg);text-align:left;color:var(--fg);width:100%}
.opt:hover{border-color:var(--acc)}
.opt .k{flex:0 0 auto;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--mono);margin-top:1px}
.opt.multi .k{border-radius:5px}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.opt .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.opt .tx pre{margin:4px 0}
.opt.right{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 9%, var(--bg))}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 9%, var(--bg))}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt[disabled]{cursor:default}
.verdict{margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.verdict .vt{font-weight:700}
.verdict.ok .vt{color:var(--ok)} .verdict.bad .vt{color:var(--bad)}
.verdict .gt{margin-top:4px;white-space:pre-line}
.qbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0 2px}
.prog>i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.tag.multi{border-color:var(--warn);color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--fg);display:block}
.tile:hover{border-color:var(--acc)}
.tile .tt{font-weight:600}
.tile .ds{font-size:13px;color:var(--muted)}
.big{font-size:30px;font-weight:700}
.muted{color:var(--muted)}
.right{color:var(--ok)} .wrongc{color:var(--bad)}
.hide{display:none!important}
.donebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.lockbox{text-align:center;padding:30px 16px}
.lockbox .ic{font-size:34px}
details{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--card);margin:8px 0}
details summary{cursor:pointer;font-weight:600}
.small{font-size:13px}
.kbdhint{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0;background:var(--card)}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
@media (max-width:480px){ h1{font-size:22px} .wrap{padding:16px 16px 70px} table{font-size:13.5px} th,td{padding:6px 7px} }
</style>
</head>
<body>
<div class="topbar"><button class="btn sm" id="menuBtn" aria-label="Mở menu">☰ Menu</button><span class="t" id="topTitle">Ôn thi</span><button class="btn sm ghost" id="themeBtn2" title="Đổi nền sáng/tối">☾</button></div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main><div class="wrap" id="app"></div></main>
</div>
<script type="application/json" id="D">{"blocks":[{"id":"K1","mon":"TTNT","title":"Git cơ bản","src":"week01.pdf · Pro Git ch.1–2","page":{"y":"<p><b>Git<\/b> là hệ quản lý phiên bản <b>phân tán<\/b> (DVCS): mỗi bản clone chứa toàn bộ lịch sử. Git lưu <b>snapshot<\/b> (ảnh chụp toàn bộ file được track) chứ không lưu diff; hầu hết thao tác chạy <b>local<\/b>; mọi thứ được checksum bằng <b>SHA-1<\/b> nên không thể sửa nội dung mà Git không biết.<\/p>\n<p>Mô hình cần thuộc: <b>3 trạng thái<\/b> (modified, staged, committed) ↔ <b>3 vùng<\/b> (working tree, staging area, .git).<\/p><p class=\"src\">Nguồn: week01.pdf tr.12, 18–33<\/p>","mohinh":"<div class=\"diagram\"><svg viewBox=\"0 0 700 250\" width=\"700\" role=\"img\" aria-label=\"Ba vùng của Git và các lệnh di chuyển giữa chúng\">\n<g font-size=\"13\">\n<rect x=\"10\" y=\"20\" width=\"190\" height=\"96\" rx=\"10\" class=\"box\"/><text x=\"24\" y=\"44\" font-weight=\"700\">Working tree<\/text><text x=\"24\" y=\"66\" class=\"muted\">bản checkout trên đĩa<\/text><text x=\"24\" y=\"88\" class=\"muted\">trạng thái: modified<\/text>\n<rect x=\"255\" y=\"20\" width=\"190\" height=\"96\" rx=\"10\" class=\"boxa\"/><text x=\"269\" y=\"44\" font-weight=\"700\">Staging area<\/text><text x=\"269\" y=\"66\" class=\"muted\">“the index”, file trong .git<\/text><text x=\"269\" y=\"88\" class=\"muted\">trạng thái: staged<\/text>\n<rect x=\"500\" y=\"20\" width=\"190\" height=\"96\" rx=\"10\" class=\"box\"/><text x=\"514\" y=\"44\" font-weight=\"700\">Git directory (.git)<\/text><text x=\"514\" y=\"66\" class=\"muted\">metadata + object DB<\/text><text x=\"514\" y=\"88\" class=\"muted\">trạng thái: committed<\/text>\n<path d=\"M200 50 h50\" class=\"lna\"/><path d=\"M244 45 l7 5 l-7 5\" class=\"lna\"/><text x=\"203\" y=\"42\" class=\"mono\" font-size=\"12\">git add<\/text>\n<path d=\"M445 50 h50\" class=\"lna\"/><path d=\"M489 45 l7 5 l-7 5\" class=\"lna\"/><text x=\"446\" y=\"42\" class=\"mono\" font-size=\"12\">git commit<\/text>\n<path d=\"M500 140 C 420 200 280 200 200 140\" class=\"ln dash\"/><path d=\"M206 146 l-6 -7 l9 0\" class=\"ln\"/>\n<text x=\"250\" y=\"190\" class=\"mono\" font-size=\"12\">git restore &lt;file&gt; (bỏ thay đổi — mất luôn!)<\/text>\n<path d=\"M255 104 C 235 130 220 130 200 104\" class=\"ln dash\"/>\n<text x=\"150\" y=\"150\" class=\"mono\" font-size=\"12\">git restore --staged / git reset HEAD &lt;file&gt;<\/text>\n<path d=\"M200 30 C 300 -10 420 -10 500 30\" class=\"ln dash\"/><text x=\"285\" y=\"12\" class=\"mono\" font-size=\"12\">git commit -a (file đã track)<\/text>\n<text x=\"10\" y=\"232\" font-size=\"12.5\">git diff = working tree ↔ staging · git diff --staged = staging ↔ commit cuối<\/text>\n<\/g><\/svg><div class=\"cap\">3 vùng của Git (week01.pdf tr.28–33, 53, 56, 64–65)<\/div><\/div>\n<h3 id=\"k1-vcs\">Ba kiểu hệ quản lý phiên bản<\/h3><div class=\"tw\"><table><tr><th>Kiểu<\/th><th>Ví dụ<\/th><th>Đặc điểm<\/th><\/tr><tr><td>Local VCS<\/td><td>chép thư mục, RCS<\/td><td>RCS lưu patch set (khác biệt giữa các phiên bản); đơn giản nhưng dễ ghi đè nhầm<\/td><\/tr><tr><td>Tập trung (CVCS)<\/td><td>CVS, Subversion, Perforce<\/td><td>một server trung tâm; dễ quản trị, phân quyền chi tiết; <b>điểm lỗi duy nhất<\/b>: server sập là không ai cộng tác được, hỏng đĩa không backup là mất hết lịch sử<\/td><\/tr><tr><td>Phân tán (DVCS)<\/td><td><b>Git<\/b>, Mercurial, Darcs<\/td><td>mỗi client mirror toàn bộ repo + lịch sử, <b>mỗi clone là một bản backup<\/b>; làm việc với nhiều remote<\/td><\/tr><\/table><\/div>\n<h3 id=\"k1-objects\">Commit lưu gì<\/h3><p><code>git add README test.rb LICENSE<\/code> + <code>git commit<\/code> → <b>3 blob<\/b> (nội dung file) + <b>1 tree<\/b> (cấu trúc thư mục) + <b>1 commit<\/b> (con trỏ tới tree, tác giả, email, message, con trỏ tới commit cha). Số cha: 0 = commit đầu tiên · 1 = commit thường · nhiều = merge commit. File không đổi không được lưu lại mà chỉ link tới bản trước.<\/p><p class=\"src\">Nguồn: week01.pdf tr.7–14, 20, 81–84<\/p>","bang":"<h3 id=\"k1-config\">Cấu hình<\/h3><div class=\"tw\"><table><tr><th>Cấp<\/th><th>Phạm vi<\/th><th>File<\/th><\/tr><tr><td>System<\/td><td>mọi user<\/td><td>[path]/etc/gitconfig<\/td><\/tr><tr><td>Global (<code>--global<\/code>)<\/td><td>user hiện tại, mọi project<\/td><td>~/.gitconfig hoặc ~/.config/git/config<\/td><\/tr><tr><td>Local (không có --global)<\/td><td>một repo<\/td><td>.git/config<\/td><\/tr><\/table><\/div><div class=\"note \">Ưu tiên: <b>Local &gt; Global &gt; System<\/b>. Muốn dùng tên/email khác cho một project: chạy lệnh <b>không<\/b> có <code>--global<\/code> trong repo đó.<\/div><pre data-lang=\"bash\">git config --global user.name &quot;Name&quot;\ngit config --global user.email &quot;email@example.com&quot;<\/pre><p class=\"src\">Nguồn: week01.pdf tr.38–39<\/p>\n<h3 id=\"k1-cmd\">Lệnh cơ bản<\/h3><div class=\"tw\"><table><tr><th>Lệnh<\/th><th>Tác dụng<\/th><\/tr><tr><td><code>git init<\/code><\/td><td>tạo thư mục con <code>.git<\/code> (khung repo); chưa track file nào<\/td><\/tr><tr><td><code>git clone &lt;url&gt;<\/code><\/td><td>tạo thư mục → <code>git init<\/code> → thêm remote <b>origin<\/b> → <code>git fetch<\/code> → checkout commit mới nhất. Chép <b>toàn bộ lịch sử<\/b><\/td><\/tr><tr><td><code>git status<\/code> / <code>git status -s<\/code><\/td><td>trạng thái đầy đủ / rút gọn hai cột<\/td><\/tr><tr><td><code>git add &lt;file&gt;<\/code><\/td><td>bắt đầu track file mới, hoặc stage file đã sửa<\/td><\/tr><tr><td><code>git diff<\/code><\/td><td>thay đổi <b>chưa stage<\/b> (working tree so với staging)<\/td><\/tr><tr><td><code>git diff --staged<\/code><\/td><td>thay đổi <b>đã stage<\/b> (staging so với commit cuối)<\/td><\/tr><tr><td><code>git commit -m &quot;msg&quot;<\/code><\/td><td>commit snapshot đã stage, không mở editor<\/td><\/tr><tr><td><code>git commit -a -m &quot;msg&quot;<\/code><\/td><td>tự stage mọi file <b>đã track<\/b> và đã sửa rồi commit (file untracked không được thêm)<\/td><\/tr><tr><td><code>git commit --amend<\/code><\/td><td><b>thay thế<\/b> commit trước bằng commit mới (sửa message, thêm file quên)<\/td><\/tr><tr><td><code>git rm &lt;file&gt;<\/code><\/td><td>xoá khỏi working dir <b>và<\/b> stage việc xoá<\/td><\/tr><tr><td><code>git rm --cached &lt;file&gt;<\/code><\/td><td>ngừng track nhưng <b>giữ file<\/b> trên đĩa<\/td><\/tr><tr><td><code>git mv old new<\/code><\/td><td>= đổi tên + <code>git rm old<\/code> + <code>git add new<\/code><\/td><\/tr><tr><td><code>git log --oneline / --graph / -p / --stat<\/code><\/td><td>lịch sử mới nhất trước; một dòng / đồ thị nhánh / kèm diff / thống kê<\/td><\/tr><tr><td><code>git reset HEAD &lt;file&gt;<\/code> · <code>git restore --staged &lt;file&gt;<\/code><\/td><td>bỏ stage, giữ thay đổi trong working dir<\/td><\/tr><tr><td><code>git restore &lt;file&gt;<\/code><\/td><td>đưa file về bản commit cuối — <b>mất<\/b> thay đổi chưa commit<\/td><\/tr><tr><td><code>git remote -v<\/code><\/td><td>liệt kê remote kèm URL fetch/push<\/td><\/tr><tr><td><code>git remote add &lt;name&gt; &lt;url&gt;<\/code><\/td><td>thêm remote<\/td><\/tr><tr><td><code>git remote show &lt;name&gt;<\/code> · <code>rename<\/code> · <code>remove<\/code><\/td><td>xem chi tiết · đổi tên · xoá remote<\/td><\/tr><tr><td><code>git fetch &lt;remote&gt;<\/code><\/td><td>tải dữ liệu mới, cập nhật remote-tracking branch, <b>không merge<\/b><\/td><\/tr><tr><td><code>git pull<\/code><\/td><td>= fetch + merge<\/td><\/tr><tr><td><code>git push &lt;remote&gt; &lt;branch&gt;<\/code><\/td><td>đẩy commit; <b>bị từ chối<\/b> nếu remote có commit bạn chưa có<\/td><\/tr><tr><td><code>git tag v1.0<\/code> · <code>git tag -a v1.0 -m &quot;msg&quot;<\/code><\/td><td>tag lightweight (chỉ con trỏ) · tag annotated (lưu người tag, email, ngày, message)<\/td><\/tr><tr><td><code>git push &lt;remote&gt; &lt;tag&gt;<\/code><\/td><td>tag <b>không<\/b> được push mặc định, phải push riêng<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week01.pdf tr.43–76; Pro Git tr.53–56, 59<\/p>\n<h3 id=\"k1-short\">Đọc <code>git status -s<\/code><\/h3><pre data-lang=\"text\"> M README\nMM Rakefile\nA  lib/git.rb\nM  lib/simplegit.rb\n?? LICENSE.txt<\/pre><p>Cột <b>trái<\/b> = staging area, cột <b>phải<\/b> = working tree. <code>??<\/code> untracked · <code>A<\/code> mới được stage · <code>␣M<\/code> sửa chưa stage · <code>M␣<\/code> sửa đã stage · <code>MM<\/code> đã stage rồi lại sửa tiếp.<\/p><p class=\"src\">Nguồn: week01.pdf tr.51; Pro Git tr.37–38<\/p>\n<h3 id=\"k1-ignore\">.gitignore<\/h3><pre data-lang=\"bash\"># ignore all .a files\n*.a\n# but do track lib.a, even though you&#x27;re ignoring .a files above\n!lib.a\n# only ignore the TODO file in the current directory, not subdir/TODO\n/TODO\n# ignore all files in any directory named build\nbuild/\n# ignore doc/notes.txt, but not doc/server/arch.txt\ndoc/*.txt\n# ignore all .pdf files in the doc/ directory and any of its subdirectories\ndoc/**/*.pdf<\/pre><ul><li>Dòng trống hoặc bắt đầu bằng <code>#<\/code> bị bỏ qua.<\/li><li>Glob áp dụng <b>đệ quy<\/b> toàn cây; <code>/<\/code> ở đầu = chỉ thư mục hiện tại; <code>/<\/code> ở cuối = thư mục; <code>!<\/code> = phủ định; <code>**<\/code> = thư mục lồng nhau.<\/li><li>File <b>đã track<\/b> rồi thì thêm vào .gitignore không làm Git bỏ track → dùng <code>git rm --cached<\/code>.<\/li><\/ul><p class=\"src\">Nguồn: week01.pdf tr.52; Pro Git tr.38–39, 44–45<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>CVCS vs DVCS<\/td><td>CVCS: một server giữ mọi phiên bản, điểm lỗi duy nhất, SVN/CVS sửa offline được nhưng <b>không commit offline<\/b>. DVCS: clone = backup đầy đủ, commit offline rồi push sau.<\/td><\/tr><tr><td>Snapshot vs diff<\/td><td>Đa số VCS lưu thay đổi theo file (diff); Git lưu chuỗi snapshot, file không đổi chỉ link tới bản cũ.<\/td><\/tr><tr><td><code>git diff<\/code> vs <code>git diff --staged<\/code><\/td><td>chưa stage vs đã stage. Stage hết rồi thì <code>git diff<\/code> trống.<\/td><\/tr><tr><td><code>git rm<\/code> vs <code>git rm --cached<\/code><\/td><td>xoá cả file trên đĩa vs chỉ ngừng track, giữ file.<\/td><\/tr><tr><td><code>git fetch<\/code> vs <code>git pull<\/code><\/td><td>fetch chỉ tải về, an toàn, không đụng working dir; pull = fetch + merge.<\/td><\/tr><tr><td><code>git commit -a<\/code> vs <code>git add<\/code> + commit<\/td><td>-a chỉ tự stage file <b>đã track<\/b>; file mới vẫn phải <code>git add<\/code>.<\/td><\/tr><tr><td><code>git restore &lt;f&gt;<\/code> vs <code>git restore --staged &lt;f&gt;<\/code><\/td><td>bỏ thay đổi trong working dir (mất) vs bỏ stage (thay đổi còn).<\/td><\/tr><tr><td>Tracked vs untracked<\/td><td>Tracked: có trong snapshot cuối hoặc mới stage (unmodified/modified/staged). Untracked: mọi file còn lại.<\/td><\/tr><tr><td>Tag lightweight vs annotated<\/td><td>lightweight: chỉ con trỏ; annotated: thêm người tag, email, ngày, message — khuyên dùng cho release. Tag không di chuyển như branch.<\/td><\/tr><tr><td>--global vs local config<\/td><td>global: mọi project của user; không có --global: chỉ repo hiện tại và ghi đè global.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week01.pdf tr.9–12, 24, 38–39, 47, 53–76<\/p>","bay":"<div class=\"card\" id=\"k1-trap-a\"><b>Bẫy 1 — <code>commit -a<\/code> với file mới<\/b><div>Tạo <code>new.py<\/code> rồi <code>git commit -a -m \"x\"<\/code> → <code>new.py<\/code> <b>không<\/b> được commit (untracked).<br><b>Đổi một chỗ:<\/b> chạy <code>git add new.py<\/code> trước → được commit.<\/div><\/div><div class=\"card\" id=\"k1-trap-diff\"><b>Bẫy 2 — <code>git diff<\/code> trống<\/b><div>Sửa file rồi <code>git add<\/code> hết → <code>git diff<\/code> không in gì; thay đổi chỉ hiện ở <code>git diff --staged<\/code>.<br><b>Đổi một chỗ:<\/b> sửa tiếp sau khi add → file thành <code>MM<\/code>, <code>git diff<\/code> hiện phần sửa sau.<\/div><\/div><div class=\"card\" id=\"k1-trap-ignore\"><b>Bẫy 3 — .gitignore không “untrack”<\/b><div>File đã commit rồi mới thêm vào .gitignore → Git vẫn theo dõi. Phải <code>git rm --cached file<\/code> rồi commit.<\/div><\/div><div class=\"card\" id=\"k1-trap-glob\"><b>Bẫy 4 — <code>/TODO<\/code> vs <code>TODO<\/code><\/b><div><code>/TODO<\/code> chỉ bỏ qua TODO ở thư mục gốc, <code>subdir/TODO<\/code> vẫn track. <code>doc/*.txt<\/code> bỏ <code>doc/notes.txt<\/code> nhưng không bỏ <code>doc/server/arch.txt<\/code> (muốn đệ quy: <code>doc/**/*.txt<\/code>).<\/div><\/div><div class=\"card\" id=\"k1-trap-amend\"><b>Bẫy 5 — amend thay chứ không thêm<\/b><div><code>git commit -m 'Initial'<\/code> → <code>git add forgotten<\/code> → <code>git commit --amend<\/code> → lịch sử chỉ có <b>1 commit<\/b> chứa cả file quên. Chỉ amend commit chưa push.<\/div><\/div><div class=\"card\" id=\"k1-trap-push\"><b>Bẫy 6 — push không kèm tag, push bị từ chối<\/b><div><code>git push origin main<\/code> không đẩy tag; cần <code>git push origin v1.0<\/code>. Người khác đã push trước → push của bạn bị từ chối → fetch/pull rồi push lại.<\/div><\/div><div class=\"card\"><b>Bẫy 7 — <code>git restore<\/code> nguy hiểm<\/b><div>Đưa file về bản commit cuối: thay đổi chưa commit <b>mất vĩnh viễn<\/b>. Muốn bỏ stage mà giữ thay đổi: <code>git restore --staged<\/code> / <code>git reset HEAD<\/code>.<\/div><\/div>","checklist":["VCS cục bộ, tập trung (CVCS) và phân tán (DVCS): ưu/nhược, điểm lỗi duy nhất; Git lưu snapshot chứ không lưu diff; toàn vẹn dữ liệu bằng SHA-1","3 trạng thái (modified, staged, committed) và 3 vùng (working dir, staging area, .git)","Tracked và untracked; git config --global user.name/email; init, clone, status, add, commit -m, commit -a (chỉ áp dụng cho file đã track)","git diff (working so với staging) và git diff --staged (staging so với commit cuối)","git mv, git rm, git rm --cached, .gitignore (glob, /, !)","git log (--oneline, --graph), hoàn tác: commit --amend, restore, restore --staged","Remote: remote add/-v, push, fetch và pull (pull = fetch + merge)","＋ 3 cấp git config (system/global/local, local ghi đè global)","＋ git clone làm 5 việc (thư mục, init, remote origin, fetch, checkout)","＋ git status -s: cột trái = staging, cột phải = working tree","＋ Tag lightweight vs annotated; tag không tự push","＋ Commit object: tree + blob; 0/1/nhiều cha"],"quick":[{"de":"Bạn sửa <code>a.py<\/code> (đã track) và tạo mới <code>b.py<\/code>, rồi chạy <code>git commit -a -m \"x\"<\/code>. Commit chứa gì?","dap_an":["Cả a.py và b.py","Chỉ thay đổi của a.py","Chỉ b.py","Không có gì"],"dung":[1],"giai_thich":"-a chỉ tự stage file đã track.","code":null,"lang":null},{"de":"Đã <code>git add<\/code> toàn bộ thay đổi. Lệnh nào còn hiện ra thay đổi đó?","dap_an":["git diff","git diff --staged","git log","git remote -v"],"dung":[1],"giai_thich":"git diff chỉ hiện phần chưa stage.","code":null,"lang":null},{"de":"<code>git fetch origin<\/code> làm gì?","dap_an":["Tải về và merge vào nhánh hiện tại","Tải dữ liệu mới, cập nhật origin/*, không merge","Đẩy commit lên origin","Xoá remote origin"],"dung":[1],"giai_thich":"fetch chỉ tải; pull = fetch + merge.","code":null,"lang":null}],"docthem":"<ul><li>Pro Git tr.53: <code>--amend<\/code> thực chất tạo commit mới thay thế commit cũ — chỉ dùng cho commit chưa push.<\/li><li>Pro Git tr.54, 56: <code>git checkout -- &lt;file&gt;<\/code> (cách cũ) và <code>git restore &lt;file&gt;<\/code> đều nguy hiểm vì ghi đè file bằng bản đã commit.<\/li><li>Pro Git tr.38: các ví dụ <code>*.[oa]<\/code>, <code>*~<\/code>; GitHub có sẵn kho mẫu .gitignore tại github.com/github/gitignore.<\/li><li>Pro Git tr.45: <code>git rm log/\\*.log<\/code> — dấu <code>\\<\/code> để Git (không phải shell) tự mở rộng glob.<\/li><\/ul>"}},{"id":"K2","mon":"TTNT","title":"Branch, merge, rebase","src":"week02.pdf · Pro Git ch.3","page":{"y":"<p><b>Branch<\/b> chỉ là một <b>con trỏ di động<\/b> tới một commit; <b>HEAD<\/b> trỏ tới branch đang đứng. Tạo nhánh rẻ và gần như tức thì, nên Git khuyến khích rẽ nhánh và gộp thường xuyên. Có hai cách gộp công việc: <b>merge<\/b> (giữ đúng dòng thời gian song song) và <b>rebase<\/b> (phát lại commit lên base mới cho lịch sử thẳng).<\/p><p class=\"src\">Nguồn: week01.pdf tr.78–85; week02.pdf tr.4–15, 58–62<\/p>","mohinh":"<div class=\"diagram\"><svg viewBox=\"0 0 720 260\" width=\"720\" role=\"img\" aria-label=\"So sánh merge và rebase\"><g transform=\"translate(0,20)\"><text x=\"10\" y=\"-2\" font-weight=\"700\" font-size=\"13\">① Hai nhánh đã rẽ (diverged)<\/text><line x1=\"55\" y1=\"60\" x2=\"85\" y2=\"60\" class=\"ln\"/><line x1=\"115\" y1=\"60\" x2=\"145\" y2=\"60\" class=\"ln\"/><line x1=\"175\" y1=\"60\" x2=\"205\" y2=\"60\" class=\"ln\"/><line x1=\"175\" y1=\"60\" x2=\"205\" y2=\"25\" class=\"ln\"/><line x1=\"235\" y1=\"25\" x2=\"265\" y2=\"25\" class=\"ln\"/><circle cx=\"40\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"40\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C0<\/text><circle cx=\"100\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"100\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C1<\/text><circle cx=\"160\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"160\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C2<\/text><circle cx=\"220\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C5<\/text><circle cx=\"220\" cy=\"25\" r=\"15\" class=\"node\"/><text x=\"220\" y=\"29\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C3<\/text><circle cx=\"280\" cy=\"25\" r=\"15\" class=\"node\"/><text x=\"280\" y=\"29\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C4<\/text><text x=\"200\" y=\"92\" font-size=\"12\" class=\"acc\" font-weight=\"700\">main<\/text><text x=\"268\" y=\"52\" font-size=\"12\" class=\"acc\" font-weight=\"700\">experiment<\/text><\/g><g transform=\"translate(360,20)\"><text x=\"10\" y=\"-2\" font-weight=\"700\" font-size=\"13\">② git checkout main; git merge experiment<\/text><line x1=\"55\" y1=\"60\" x2=\"85\" y2=\"60\" class=\"ln\"/><line x1=\"115\" y1=\"60\" x2=\"145\" y2=\"60\" class=\"ln\"/><line x1=\"175\" y1=\"60\" x2=\"205\" y2=\"60\" class=\"ln\"/><line x1=\"175\" y1=\"60\" x2=\"205\" y2=\"25\" class=\"ln\"/><line x1=\"235\" y1=\"25\" x2=\"265\" y2=\"25\" class=\"ln\"/><line x1=\"235\" y1=\"60\" x2=\"325\" y2=\"60\" class=\"ln\"/><line x1=\"295\" y1=\"25\" x2=\"328\" y2=\"50\" class=\"ln\"/><circle cx=\"40\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"40\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C0<\/text><circle cx=\"100\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"100\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C1<\/text><circle cx=\"160\" cy=\"60\" r=\"15\" class=\"nodea\"/><text x=\"160\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C2<\/text><circle cx=\"220\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C5<\/text><circle cx=\"220\" cy=\"25\" r=\"15\" class=\"node\"/><text x=\"220\" y=\"29\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C3<\/text><circle cx=\"280\" cy=\"25\" r=\"15\" class=\"node\"/><text x=\"280\" y=\"29\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C4<\/text><circle cx=\"340\" cy=\"60\" r=\"15\" class=\"nodea\"/><text x=\"340\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C6<\/text><text x=\"325\" y=\"92\" font-size=\"12\" class=\"acc\" font-weight=\"700\">main<\/text><text x=\"372\" y=\"56\" font-size=\"11.5\" class=\"muted\">merge commit, 2 cha (C5, C4)<\/text><text x=\"372\" y=\"72\" font-size=\"11.5\" class=\"muted\">C2 = tổ tiên chung<\/text><\/g><g transform=\"translate(0,150)\"><text x=\"10\" y=\"-2\" font-weight=\"700\" font-size=\"13\">③ git checkout experiment; git rebase main  (thay cho ②)<\/text><line x1=\"55\" y1=\"60\" x2=\"85\" y2=\"60\" class=\"ln\"/><line x1=\"115\" y1=\"60\" x2=\"145\" y2=\"60\" class=\"ln\"/><line x1=\"175\" y1=\"60\" x2=\"205\" y2=\"60\" class=\"ln\"/><line x1=\"235\" y1=\"60\" x2=\"265\" y2=\"60\" class=\"ln\"/><line x1=\"295\" y1=\"60\" x2=\"325\" y2=\"60\" class=\"ln\"/><circle cx=\"40\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"40\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C0<\/text><circle cx=\"100\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"100\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C1<\/text><circle cx=\"160\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"160\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C2<\/text><circle cx=\"220\" cy=\"60\" r=\"15\" class=\"node\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C5<\/text><circle cx=\"280\" cy=\"60\" r=\"15\" class=\"nodea\"/><text x=\"280\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C3'<\/text><circle cx=\"340\" cy=\"60\" r=\"15\" class=\"nodea\"/><text x=\"340\" y=\"64\" text-anchor=\"middle\" font-size=\"12\" class=\"mono\">C4'<\/text><text x=\"205\" y=\"92\" font-size=\"12\" class=\"acc\" font-weight=\"700\">main<\/text><text x=\"318\" y=\"92\" font-size=\"12\" class=\"acc\" font-weight=\"700\">experiment<\/text><text x=\"372\" y=\"56\" font-size=\"11.5\" class=\"muted\">commit được phát lại = commit MỚI<\/text><text x=\"372\" y=\"72\" font-size=\"11.5\" class=\"muted\">rồi: git checkout main; git merge experiment<\/text><text x=\"372\" y=\"88\" font-size=\"11.5\" class=\"muted\">→ fast-forward main tới C4'<\/text><\/g><\/svg><div class=\"cap\">Merge tạo merge commit; rebase phát lại commit rồi fast-forward (week02.pdf tr.14–15, 58–62)<\/div><\/div>\n<h3 id=\"k2-ff\">Fast-forward<\/h3><p>Nhánh được merge <b>đi thẳng trước<\/b> commit hiện tại (không có công việc rẽ nhánh) → Git chỉ <b>dời con trỏ lên<\/b>, không tạo commit mới; output in <code>Fast-forward<\/code>. Ví dụ hotfix: main ở C2, hotfix ở C4 (con của C2) → <code>git checkout main; git merge hotfix<\/code> → main nhảy tới C4, sau đó <code>git branch -d hotfix<\/code>.<\/p>\n<h3 id=\"k2-switch\">Đổi nhánh thì working dir đổi theo<\/h3><p><code>git checkout testing<\/code> dời HEAD sang testing <b>và<\/b> đưa file trong working dir về snapshot của testing. Commit tiếp theo làm nhánh HEAD đang trỏ tiến lên. Nếu không đổi nhánh sạch được (thay đổi chưa commit bị xung đột), Git không cho đổi.<\/p><p class=\"src\">Nguồn: week02.pdf tr.5–9; Pro Git tr.74, 78–80<\/p>","bang":"<h3 id=\"k2-cmd\">Tạo, đổi, quản lý nhánh<\/h3><div class=\"tw\"><table><tr><th>Lệnh<\/th><th>Tác dụng<\/th><\/tr><tr><td><code>git branch &lt;name&gt;<\/code><\/td><td>tạo con trỏ mới tại commit hiện tại — <b>không<\/b> tự chuyển sang<\/td><\/tr><tr><td><code>git checkout &lt;name&gt;<\/code> · <code>git switch &lt;name&gt;<\/code><\/td><td>chuyển nhánh (HEAD + working dir)<\/td><\/tr><tr><td><code>git checkout -b &lt;name&gt;<\/code> · <code>git switch -c &lt;name&gt;<\/code><\/td><td>tạo và chuyển trong một lệnh<\/td><\/tr><tr><td><code>git switch -<\/code><\/td><td>quay về nhánh trước đó<\/td><\/tr><tr><td><code>git branch<\/code><\/td><td>liệt kê nhánh local; <code>*<\/code> = nhánh đang checkout<\/td><\/tr><tr><td><code>git branch -v<\/code><\/td><td>commit mới nhất của mỗi nhánh<\/td><\/tr><tr><td><code>git branch --merged<\/code> / <code>--no-merged<\/code><\/td><td>nhánh đã / chưa được merge vào <b>nhánh hiện tại<\/b><\/td><\/tr><tr><td><code>git branch -d &lt;b&gt;<\/code><\/td><td>xoá nhánh đã merge (an toàn); chưa merge → lỗi “not fully merged”<\/td><\/tr><tr><td><code>git branch -D &lt;b&gt;<\/code><\/td><td>xoá cưỡng bức, mất công việc chưa merge<\/td><\/tr><tr><td><code>git branch --move old new<\/code><\/td><td>đổi tên local (lịch sử giữ nguyên)<\/td><\/tr><tr><td><code>git push --set-upstream origin new<\/code><\/td><td>đẩy tên mới lên remote<\/td><\/tr><tr><td><code>git push origin --delete old<\/code><\/td><td>xoá tên cũ trên remote<\/td><\/tr><tr><td><code>git log --oneline --decorate --graph --all<\/code><\/td><td>xem con trỏ nhánh, HEAD và đồ thị mọi nhánh<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week02.pdf tr.4–35<\/p>\n<h3 id=\"k2-conflict\">Merge conflict<\/h3><pre data-lang=\"text\">$ git merge iss53\nAuto-merging index.html\nCONFLICT (content): Merge conflict in index.html\nAutomatic merge failed; fix conflicts and then commit the result.<\/pre><pre data-lang=\"text\">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD:index.html\n&lt;div id=&quot;footer&quot;&gt;contact : email.support@github.com&lt;/div&gt;\n=======\n&lt;div id=&quot;footer&quot;&gt;\n please contact us at support@github.com\n&lt;/div&gt;\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; iss53:index.html<\/pre><ul><li>Phía trên <code>=======<\/code> = bản ở <b>HEAD<\/b> (nhánh đang đứng khi chạy merge); phía dưới = bản của nhánh được merge (iss53).<\/li><li>Git <b>chưa<\/b> tạo merge commit; <code>git status<\/code> báo <i>Unmerged paths … both modified<\/i>.<\/li><li>Sửa file, <b>xoá hết<\/b> các dòng <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;<\/code> <code>=======<\/code> <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;<\/code> → <code>git add index.html<\/code> (đánh dấu đã giải quyết) → <code>git commit<\/code>.<\/li><\/ul><p class=\"src\">Nguồn: Pro Git tr.83–84 (slide week02 tr.14 chỉ nêu 3-way merge)<\/p>\n<h3 id=\"k2-remote\">Remote branch &amp; tracking<\/h3><div class=\"tw\"><table><tr><th>Lệnh / khái niệm<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>origin/master<\/code><\/td><td>remote-tracking branch: bookmark “remote ở đâu lần sync trước”; không tự di chuyển, chỉ đổi khi fetch/push<\/td><\/tr><tr><td><code>git ls-remote &lt;remote&gt;<\/code> · <code>git remote show &lt;remote&gt;<\/code><\/td><td>liệt kê tham chiếu trên remote<\/td><\/tr><tr><td><code>git push origin serverfix<\/code><\/td><td>đẩy nhánh local serverfix lên serverfix của remote<\/td><\/tr><tr><td><code>git merge origin/serverfix<\/code><\/td><td>gộp nhánh vừa fetch vào nhánh hiện tại<\/td><\/tr><tr><td><code>git checkout -b serverfix origin/serverfix<\/code><\/td><td>tạo nhánh local để sửa, theo dõi origin/serverfix<\/td><\/tr><tr><td><code>git checkout --track origin/serverfix<\/code><\/td><td>dạng rút gọn; <code>git checkout serverfix<\/code> cũng được nếu tên không trùng<\/td><\/tr><tr><td><code>git checkout -b sf origin/serverfix<\/code><\/td><td>nhánh local tên khác (sf) vẫn track origin/serverfix<\/td><\/tr><tr><td><code>git branch -u origin/serverfix<\/code><\/td><td>đặt/đổi upstream (= <code>--set-upstream-to<\/code>)<\/td><\/tr><tr><td><code>git branch -vv<\/code><\/td><td>upstream của mỗi nhánh + ahead/behind (chỉ mới bằng lần fetch cuối; cần số mới: <code>git fetch --all; git branch -vv<\/code>)<\/td><\/tr><tr><td><code>git push origin --delete serverfix<\/code><\/td><td>xoá nhánh trên server<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week02.pdf tr.38–56; Pro Git tr.99–100<\/p>\n<h3 id=\"k2-rebase\">Rebase<\/h3><div class=\"tw\"><table><tr><th>Lệnh<\/th><th>Tác dụng<\/th><\/tr><tr><td><code>git checkout experiment; git rebase master<\/code><\/td><td>tìm tổ tiên chung → lấy diff từng commit của experiment → reset về master → áp lại từng patch<\/td><\/tr><tr><td><code>git checkout master; git merge experiment<\/code><\/td><td>sau rebase lịch sử thẳng nên đây là fast-forward<\/td><\/tr><tr><td><code>git rebase master server<\/code><\/td><td>rebase server lên master mà không cần checkout trước<\/td><\/tr><tr><td><code>git rebase --onto master server client<\/code><\/td><td>lấy các commit của client kể từ khi tách khỏi server, phát lại lên master (bỏ qua phần của server)<\/td><\/tr><\/table><\/div><div class=\"note warn\">Quy tắc vàng: rebase thoải mái commit <b>local chưa push<\/b> để dọn lịch sử; <b>không bao giờ rebase thứ đã push công khai<\/b>.<\/div><p class=\"src\">Nguồn: week02.pdf tr.58–67; Pro Git tr.104, 106<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>Merge vs rebase<\/td><td>Snapshot cuối <b>giống nhau<\/b>. Merge: 3-way merge (2 đầu nhánh + tổ tiên chung), tạo merge commit 2 cha, giữ timeline song song. Rebase: phát lại patch thành commit mới, lịch sử thẳng.<\/td><\/tr><tr><td>Fast-forward vs 3-way merge<\/td><td>FF: không rẽ nhánh → dời con trỏ, không có commit mới. 3-way: hai nhánh đã rẽ → tạo merge commit.<\/td><\/tr><tr><td><code>git branch x<\/code> vs <code>git checkout -b x<\/code><\/td><td>chỉ tạo vs tạo + chuyển.<\/td><\/tr><tr><td><code>-d<\/code> vs <code>-D<\/code><\/td><td>xoá an toàn (đã merge) vs xoá cưỡng bức.<\/td><\/tr><tr><td><code>--merged<\/code> vs <code>--no-merged<\/code><\/td><td>đã gộp (thường xoá được) vs còn công việc chưa gộp — so với nhánh <b>hiện tại<\/b>.<\/td><\/tr><tr><td>Nhánh local vs remote-tracking<\/td><td>local: bạn di chuyển bằng commit. origin/x: Git di chuyển khi fetch/push; không sửa tay được.<\/td><\/tr><tr><td><code>git fetch<\/code> vs <code>git pull<\/code><\/td><td>fetch không đụng working dir; pull = fetch + merge (hoặc rebase).<\/td><\/tr><tr><td>Đổi tên nhánh vs đổi tên nhánh mặc định<\/td><td>Nhánh thường: branch --move + push -u + push --delete. master/main: có thể làm hỏng CI/CD, script build, tích hợp — phải hỏi cả nhóm.<\/td><\/tr><tr><td>HEAD vs branch<\/td><td>branch trỏ tới commit; HEAD trỏ tới branch đang đứng (nhánh sẽ tiến lên khi commit).<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week02.pdf tr.14, 22–27, 39–44, 58–62<\/p>","bay":"<div class=\"card\" id=\"k2-trap-branch\"><b>Bẫy 1 — tạo nhánh không chuyển nhánh<\/b><div><code>git branch testing<\/code> rồi commit → <b>master<\/b> tiến lên (HEAD vẫn ở master), testing đứng yên.<br><b>Đổi một chỗ:<\/b> dùng <code>git checkout -b testing<\/code> → testing tiến lên.<\/div><\/div><div class=\"card\" id=\"k2-trap-switch\"><b>Bẫy 2 — đổi nhánh làm “mất” nội dung file<\/b><div>Ở week2 thêm dòng vào week2.md, commit, rồi <code>git switch master<\/code> → week2.md trở về nội dung trên master (dòng mới không thấy). Không mất: nó nằm ở commit của nhánh week2.<\/div><\/div><div class=\"card\" id=\"k2-trap-dir\"><b>Bẫy 3 — chiều của merge<\/b><div>Muốn đưa hotfix vào main: đứng ở <b>main<\/b> rồi <code>git merge hotfix<\/code>. Đứng ở hotfix mà merge main thì hotfix mới là nhánh thay đổi.<\/div><\/div><div class=\"card\" id=\"k2-trap-conflict\"><b>Bẫy 4 — conflict: HEAD ở trên<\/b><div>Khối giữa <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD<\/code> và <code>=======<\/code> là bản của nhánh <b>đang đứng<\/b>. Sau khi sửa phải <code>git add<\/code> rồi <code>git commit<\/code> — Git không tự tạo merge commit khi có conflict.<\/div><\/div><div class=\"card\" id=\"k2-trap-rebase\"><b>Bẫy 5 — rebase tạo commit mới<\/b><div>Sau <code>git rebase master<\/code>, C3, C4 trở thành C3', C4' (hash mới). Ai đã dựa trên C3, C4 cũ sẽ bị rối → không rebase commit đã public.<br><b>Đổi một chỗ:<\/b> sau rebase, merge từ master là <b>fast-forward<\/b>; nếu không rebase thì merge là 3-way.<\/div><\/div><div class=\"card\" id=\"k2-trap-vv\"><b>Bẫy 6 — ahead/behind không tự cập nhật<\/b><div><code>git branch -vv<\/code> chỉ đúng tới lần fetch cuối. <code>ahead 3, behind 1<\/code> = 3 commit local chưa push, 1 commit trên server chưa merge.<\/div><\/div><div class=\"card\" id=\"k2-trap-rename\"><b>Bẫy 7 — đổi tên xong nhánh cũ vẫn còn trên remote<\/b><div><code>git branch --move bad good<\/code> + <code>git push --set-upstream origin good<\/code> → remote có <b>cả hai<\/b> tên; phải <code>git push origin --delete bad<\/code>.<\/div><\/div>","checklist":["Branch là con trỏ tới commit; HEAD trỏ tới branch hiện tại; branch, checkout, switch, switch -c, checkout -b, switch -","Khi switch nhánh, working dir thay đổi theo snapshot của nhánh đó","Merge fast-forward và 3-way merge (tạo merge commit, dùng common ancestor); conflict: dấu <<<<<<< ======= >>>>>>>, sửa xong thì add rồi commit","Quản lý nhánh: branch -v, --merged, --no-merged, -d và -D, đổi tên branch -m + push -u origin mới + xóa nhánh cũ trên remote","Remote branch: origin/master, tracking branch, branch -vv (ahead/behind), push -u, push origin --delete","Rebase: phát lại commit lên base mới, lịch sử thẳng; rebase xong thì merge fast-forward; quy tắc không rebase commit đã public","Pull request, quy trình feature branch, hotfix","＋ rebase --onto master server client; git rebase <base> <topic>","＋ checkout --track, checkout -b sf origin/serverfix, branch -u (--set-upstream-to)","＋ Đổi tên nhánh mặc định (master→main) có thể làm hỏng CI/CD, script — phải bàn với nhóm"],"quick":[{"de":"Đang ở main, chạy <code>git branch feat<\/code> rồi <code>git commit -a -m x<\/code>. Nhánh nào tiến lên?","dap_an":["feat","main","cả hai","không nhánh nào"],"dung":[1],"giai_thich":"git branch không chuyển nhánh; HEAD vẫn trỏ main.","code":null,"lang":null},{"de":"main ở C2, hotfix ở C4 (C4 là hậu duệ trực tiếp của C2). <code>git checkout main; git merge hotfix<\/code> sẽ:","dap_an":["Tạo merge commit 2 cha","Fast-forward: dời main tới C4","Báo conflict","Rebase hotfix"],"dung":[1],"giai_thich":"Không có công việc rẽ nhánh → fast-forward.","code":null,"lang":null},{"de":"Quy tắc an toàn khi dùng rebase là gì?","dap_an":["Chỉ rebase nhánh main","Không rebase commit đã push công khai","Luôn rebase trước khi fetch","Rebase thay cho commit"],"dung":[1],"giai_thich":"Rebase local chưa push; không rebase thứ đã public.","code":null,"lang":null}],"docthem":"<ul><li>Pro Git tr.74: <code>git log<\/code> mặc định chỉ hiện lịch sử của nhánh đang checkout; thêm <code>--all<\/code> để xem mọi nhánh.<\/li><li>Pro Git tr.109: <code>git pull --rebase<\/code> thay cho pull thường (fetch + rebase).<\/li><li>Pro Git tr.106 (The Perils of Rebasing): rebase bỏ commit cũ và tạo commit mới giống nội dung nhưng khác hash; người khác đã dựa trên commit cũ sẽ phải merge lại và lịch sử bị lặp.<\/li><\/ul>"}},{"id":"K3","mon":"TTNT","title":"Linux shell, file, quyền, SSH","src":"week3.pdf · The Linux Command Line","page":{"y":"<p>Server (VPS/EC2) thường <b>không có giao diện đồ hoạ<\/b> — mọi thao tác qua <b>shell<\/b> (bash) và <b>SSH<\/b>. Khối này gồm: đi lại trong cây thư mục, thao tác file, ghép lệnh bằng pipeline, mô hình nhiều người dùng với quyền rwx, và kết nối/copy an toàn bằng cặp khoá SSH.<\/p><p class=\"src\">Nguồn: week3.pdf tr.3, 20, 29<\/p>","mohinh":"<h3 id=\"k3-perm-model\">Chuỗi quyền trong <code>ls -l<\/code><\/h3><div class=\"diagram\"><svg viewBox=\"0 0 640 150\" width=\"640\" role=\"img\" aria-label=\"Đọc chuỗi quyền\">\n<g font-size=\"15\" class=\"mono\">\n<rect x=\"10\" y=\"20\" width=\"40\" height=\"40\" class=\"box\"/><text x=\"23\" y=\"46\">-<\/text>\n<rect x=\"56\" y=\"20\" width=\"120\" height=\"40\" class=\"boxa\"/><text x=\"90\" y=\"46\">r w x<\/text>\n<rect x=\"182\" y=\"20\" width=\"120\" height=\"40\" class=\"box\"/><text x=\"216\" y=\"46\">r - x<\/text>\n<rect x=\"308\" y=\"20\" width=\"120\" height=\"40\" class=\"box\"/><text x=\"342\" y=\"46\">- - -<\/text>\n<\/g>\n<g font-size=\"12.5\">\n<text x=\"8\" y=\"80\">loại<\/text><text x=\"8\" y=\"96\" class=\"muted\">- file<\/text><text x=\"8\" y=\"112\" class=\"muted\">d thư mục<\/text><text x=\"8\" y=\"128\" class=\"muted\">l symlink<\/text>\n<text x=\"92\" y=\"80\">owner (u)<\/text><text x=\"88\" y=\"100\" class=\"mono\">4+2+1 = 7<\/text>\n<text x=\"218\" y=\"80\">group (g)<\/text><text x=\"214\" y=\"100\" class=\"mono\">4+0+1 = 5<\/text>\n<text x=\"340\" y=\"80\">others (o)<\/text><text x=\"344\" y=\"100\" class=\"mono\">0+0+0 = 0<\/text>\n<text x=\"450\" y=\"36\">→ chmod 750 file<\/text><text x=\"450\" y=\"58\" class=\"muted\">r = 4 · w = 2 · x = 1<\/text>\n<text x=\"450\" y=\"80\" class=\"muted\">umask = bit bị TẮT<\/text><text x=\"450\" y=\"100\" class=\"muted\">file gốc rw-rw-rw- (666)<\/text><text x=\"450\" y=\"120\" class=\"muted\">thư mục gốc rwxrwxrwx (777)<\/text>\n<\/g><\/svg><div class=\"cap\">week3.pdf tr.21–25<\/div><\/div>\n<h3 id=\"k3-link-model\">Hard link và symbolic link<\/h3><div class=\"diagram\"><svg viewBox=\"0 0 640 170\" width=\"640\" role=\"img\" aria-label=\"Hard link và symbolic link\">\n<g font-size=\"13\">\n<rect x=\"10\" y=\"20\" width=\"110\" height=\"32\" rx=\"6\" class=\"box\"/><text x=\"22\" y=\"41\" class=\"mono\">Hi.txt<\/text>\n<rect x=\"10\" y=\"66\" width=\"110\" height=\"32\" rx=\"6\" class=\"box\"/><text x=\"22\" y=\"87\" class=\"mono\">Hi-hard<\/text>\n<rect x=\"210\" y=\"40\" width=\"150\" height=\"40\" rx=\"6\" class=\"boxa\"/><text x=\"222\" y=\"58\">inode 1234<\/text><text x=\"222\" y=\"74\" class=\"muted\" font-size=\"11.5\">link count = 2<\/text>\n<rect x=\"440\" y=\"40\" width=\"150\" height=\"40\" rx=\"6\" class=\"box\"/><text x=\"452\" y=\"65\">dữ liệu trên đĩa<\/text>\n<path d=\"M120 36 L206 54\" class=\"ln\"/><path d=\"M120 82 L206 66\" class=\"ln\"/><path d=\"M360 60 h76\" class=\"ln\"/>\n<rect x=\"10\" y=\"120\" width=\"110\" height=\"32\" rx=\"6\" class=\"box\"/><text x=\"22\" y=\"141\" class=\"mono\">Hi-sym<\/text>\n<path d=\"M120 136 C 160 136 150 40 120 40\" class=\"ln dash\"/>\n<text x=\"150\" y=\"150\" font-size=\"12\" class=\"muted\">symlink chứa đường dẫn \"Hi.txt\" (inode riêng). Xoá Hi.txt → Hi-sym hỏng; Hi-hard vẫn đọc được.<\/text>\n<\/g><\/svg><div class=\"cap\">week3.pdf tr.17–18; TLCL tr.59, 63–65<\/div><\/div>\n<h3 id=\"k3-ssh-model\">Xác thực SSH bằng cặp khoá<\/h3><div class=\"flow\"><span class=\"s a\">Máy local: private key (giữ bí mật)<\/span><span class=\"ar\">→<\/span><span class=\"s\">tạo yêu cầu kết nối<\/span><span class=\"ar\">→<\/span><span class=\"s a\">Server: public key (~/.ssh/authorized_keys) kiểm tra<\/span><span class=\"ar\">→<\/span><span class=\"s\">hợp lệ → phiên mã hoá<\/span><\/div><p class=\"src\">Nguồn: week3.pdf tr.30; CD.pdf tr.17<\/p>","bang":"<h3 id=\"k3-nav\">Shell &amp; điều hướng<\/h3><div class=\"tw\"><table><tr><th>Lệnh / ký hiệu<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>me@linuxbox:~$<\/code><\/td><td>user@máy:thư-mục-hiện-tại, kết thúc bằng <code>$<\/code>; kết thúc bằng <code>#<\/code> = <b>superuser<\/b><\/td><\/tr><tr><td>↑ ↓ · Ctrl-r · ~/.bash_history<\/td><td>lịch sử lệnh (mặc định nhớ 1000 lệnh) · tìm lịch sử<\/td><\/tr><tr><td><code>exit<\/code> · Ctrl-d<\/td><td>kết thúc phiên<\/td><\/tr><tr><td><code>/<\/code><\/td><td>thư mục gốc; một cây duy nhất, thiết bị được mount vào cây (xem <code>df -h<\/code>)<\/td><\/tr><tr><td><code>pwd<\/code> · <code>cd<\/code> · <code>ls<\/code><\/td><td>thư mục hiện tại · đổi thư mục · liệt kê<\/td><\/tr><tr><td>Đường dẫn tuyệt đối / tương đối<\/td><td>bắt đầu bằng <code>/<\/code> / tính từ thư mục hiện tại<\/td><\/tr><tr><td><code>.<\/code> <code>..<\/code> <code>~<\/code> <code>cd -<\/code><\/td><td>hiện tại · cha · home · quay lại thư mục trước<\/td><\/tr><tr><td><code>ls -a<\/code> / <code>ls -l<\/code> / <code>ls -li<\/code><\/td><td>kể cả file ẩn (bắt đầu bằng .) / chi tiết / kèm số inode<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week3.pdf tr.4–12<\/p>\n<h3 id=\"k3-files\">Thao tác file<\/h3><div class=\"tw\"><table><tr><th>Lệnh<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>mkdir dir1 dir2<\/code> · <code>mkdir -p a/b/c<\/code><\/td><td>tạo thư mục · tạo kèm thư mục cha (TLCL tr.71)<\/td><\/tr><tr><td><code>cp a b<\/code> · <code>cp -r dir1 dir2<\/code> · <code>cp -i<\/code> · <code>-a -u -v<\/code><\/td><td>copy · copy thư mục (bắt buộc -r) · hỏi trước khi ghi đè · giữ thuộc tính / chỉ file mới hơn / in chi tiết<\/td><\/tr><tr><td><code>mv a b<\/code><\/td><td>đổi tên hoặc di chuyển; đích là thư mục có sẵn → chuyển vào trong; chưa có → đổi tên<\/td><\/tr><tr><td><code>rm file<\/code> · <code>rm -r dir<\/code> · <code>rm -rf dir<\/code><\/td><td>xoá; Linux <b>không có undelete<\/b>. Thử wildcard bằng <code>ls<\/code> trước (<code>rm * .html<\/code> có dấu cách là xoá sạch!)<\/td><\/tr><tr><td><code>ln file link<\/code><\/td><td>hard link: cùng inode, không vượt filesystem, không link thư mục<\/td><\/tr><tr><td><code>ln -s item link<\/code><\/td><td>symlink: file chứa đường dẫn tới đích; vượt filesystem, link được thư mục; <code>ls -l<\/code> hiện <code>l... link -&gt; target<\/code><\/td><\/tr><tr><td><code>touch f<\/code> · <code>&gt; f<\/code><\/td><td>tạo file rỗng<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Wildcard<\/th><th>Khớp<\/th><\/tr><tr><td><code>*<\/code><\/td><td>mọi ký tự, kể cả không ký tự nào<\/td><\/tr><tr><td><code>?<\/code><\/td><td>đúng một ký tự<\/td><\/tr><tr><td><code>[abc]<\/code> · <code>[!abc]<\/code><\/td><td>một ký tự trong / ngoài tập<\/td><\/tr><tr><td><code>[[:upper:]]*<\/code><\/td><td>bắt đầu bằng chữ hoa (lớp: alnum, alpha, digit, lower, upper)<\/td><\/tr><tr><td><code>BACKUP.[0-9][0-9][0-9]<\/code><\/td><td>BACKUP. + đúng 3 chữ số<\/td><\/tr><tr><td><code>.[!.]*<\/code><\/td><td>file ẩn nhưng loại <code>.<\/code> và <code>..<\/code><\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week3.pdf tr.10–18<\/p>\n<h3 id=\"k3-pipe\">Pipeline &amp; redirect<\/h3><pre data-lang=\"bash\">ls /bin | sort | uniq | wc -l      # đếm tên duy nhất (uniq cần dữ liệu đã sort)\nls /bin | grep zip                 # chỉ dòng chứa &quot;zip&quot;\ntail -f /var/log/messages          # theo dõi file log liên tục\nls /bin | tee list.txt             # ghi ra file VÀ vẫn in ra màn hình\nhead -n 5 f · tail -n 5 f · wc -l / -w / -c f   # 5 dòng đầu/cuối · đếm dòng/từ/byte<\/pre><div class=\"tw\"><table><tr><th>Toán tử (sách TLCL, không có trong slide)<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>cmd &gt; file<\/code><\/td><td>ghi stdout vào file, <b>ghi đè từ đầu<\/b>; lệnh lỗi → file bị cắt về 0 byte<\/td><\/tr><tr><td><code>cmd &gt;&gt; file<\/code><\/td><td>nối thêm vào cuối (chưa có thì tạo)<\/td><\/tr><tr><td><code>cmd 2&gt; err.txt<\/code><\/td><td>chuyển stderr<\/td><\/tr><tr><td><code>cmd &gt; out 2&gt;&amp;1<\/code> · <code>cmd &amp;&gt; out<\/code><\/td><td>gom cả stdout và stderr vào một file<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week3.pdf tr.19; ex3.docx Part C; TLCL tr.81–85, 89<\/p>\n<h3 id=\"k3-perm\">Quyền<\/h3><div class=\"tw\"><table><tr><th>Thuộc tính<\/th><th>Với file<\/th><th>Với thư mục<\/th><\/tr><tr><td>r<\/td><td>mở/đọc file<\/td><td>liệt kê nội dung<\/td><\/tr><tr><td>w<\/td><td>ghi/cắt file<\/td><td>tạo/xoá/đổi tên file bên trong (cần thêm x)<\/td><\/tr><tr><td>x<\/td><td>chạy như chương trình<\/td><td>vào thư mục (cd), truy cập metadata<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Lệnh<\/th><th>Kết quả<\/th><\/tr><tr><td><code>chmod 600 foo.txt<\/code><\/td><td>rw------- (chỉ owner đọc/ghi)<\/td><\/tr><tr><td><code>chmod 664 f<\/code><\/td><td>rw-rw-r--<\/td><\/tr><tr><td><code>chmod 755 script.sh<\/code><\/td><td>rwxr-xr-x<\/td><\/tr><tr><td><code>chmod 777 f<\/code><\/td><td>rwxrwxrwx (mọi người toàn quyền)<\/td><\/tr><tr><td><code>chmod u+x s.sh<\/code> · <code>u-x<\/code> · <code>o-rw<\/code><\/td><td>thêm/bớt quyền theo ký hiệu: u g o a, + - =<\/td><\/tr><tr><td><code>chmod go+rx,u+x file<\/code><\/td><td>nhiều chỉ định, cách nhau dấu phẩy<\/td><\/tr><tr><td><code>umask<\/code> · <code>umask 0022<\/code><\/td><td>xem / đặt mask. 0002 → file mới rw-rw-r-- (664); 0022 → rw-r--r-- (644); thư mục mới với 0002 → rwxrwxr-x<\/td><\/tr><tr><td><code>chown bob:users f<\/code> · <code>chown :admins f<\/code> · <code>chgrp admins f<\/code><\/td><td>đổi owner và group · chỉ group · lệnh cũ chỉ đổi group (cần quyền superuser)<\/td><\/tr><tr><td><code>id<\/code><\/td><td>uid, gid, các group của bạn<\/td><\/tr><tr><td><code>su -<\/code> · <code>su -c &quot;ls -l /root&quot;<\/code><\/td><td>mở login shell user khác (mặc định root), cần <b>mật khẩu user đó<\/b><\/td><\/tr><tr><td><code>sudo systemctl restart nginx<\/code> · <code>sudo -l<\/code><\/td><td>chạy <b>một lệnh<\/b> với quyền cao, cần <b>mật khẩu của bạn<\/b>, không mở shell mới · xem quyền sudo<\/td><\/tr><tr><td><code>sudo chmod g+s /usr/local/share/Music<\/code><\/td><td>file mới trong thư mục kế thừa group (thư mục chia sẻ)<\/td><\/tr><\/table><\/div><div class=\"note warn\">umask là <b>mask theo bit<\/b>: chỗ nào bit = 1 thì quyền đó bị tắt. Mẹo “666 − umask” chỉ đúng với các mask thường gặp (002, 022, 077); ví dụ umask 003 cho file 664, không phải 663.<\/div><p class=\"src\">Nguồn: week3.pdf tr.20–28; TLCL tr.60, 126–127<\/p>\n<h3 id=\"k3-ssh\">SSH, copy file, kiểm tra mạng<\/h3><pre data-lang=\"bash\">ssh-keygen                                   # tạo cặp khoá trên máy LOCAL\nssh user@&lt;vps-address&gt;                       # đăng nhập\nssh -i my-key.pem ubuntu@&lt;dia-chi-cong-khai&gt; # EC2: dùng private key .pem, user ubuntu\nscp file.txt user@&lt;vps-address&gt;:/path/       # copy một file qua kết nối mã hoá\nrsync -av folder/ user@&lt;vps-address&gt;:/path/  # đồng bộ cả thư mục, cập nhật nhiều lần\nping host · traceroute host                  # kiểm tra mạng trước khi nghi key/firewall<\/pre><p>SSH vừa <b>xác thực<\/b> server trước khi trao đổi dữ liệu, vừa <b>mã hoá<\/b> toàn bộ phiên. <code>sftp<\/code>: bản thay thế an toàn, tương tác cho ftp.<\/p><p class=\"src\">Nguồn: week3.pdf tr.29–33; cloudcomputing.pdf tr.13<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>Hard link vs symlink<\/td><td>Hard: cùng inode, link count tăng, xoá file gốc vẫn đọc được qua hard link; không vượt filesystem, không link thư mục. Sym: file riêng chứa đường dẫn; xoá đích → link hỏng; link được thư mục, vượt filesystem.<\/td><\/tr><tr><td>Tuyệt đối vs tương đối<\/td><td><code>/home/me/a<\/code> luôn từ gốc; <code>../a<\/code> tính từ thư mục hiện tại.<\/td><\/tr><tr><td><code>$<\/code> vs <code>#<\/code><\/td><td>user thường vs superuser.<\/td><\/tr><tr><td><code>su<\/code> vs <code>sudo<\/code><\/td><td>su: shell user khác, mật khẩu của user đó. sudo: một lệnh, mật khẩu của bạn, không mở shell mới; Ubuntu tắt đăng nhập root trực tiếp, dựa vào sudo.<\/td><\/tr><tr><td>Octal vs ký hiệu<\/td><td><code>chmod 640<\/code> đặt toàn bộ; <code>chmod g+w<\/code> chỉ thêm/bớt phần được nêu.<\/td><\/tr><tr><td><code>chmod<\/code> vs <code>chown<\/code><\/td><td>đổi quyền vs đổi chủ sở hữu/nhóm (chown cần superuser).<\/td><\/tr><tr><td><code>scp<\/code> vs <code>rsync<\/code><\/td><td>scp: một file, nhanh gọn. rsync: đồng bộ thư mục, nhiều file, cập nhật lặp lại.<\/td><\/tr><tr><td>Private key vs public key<\/td><td>Private: ở máy local, tuyệt đối bí mật. Public: đặt trên server để xác thực user.<\/td><\/tr><tr><td><code>cp -i<\/code> vs <code>cp<\/code><\/td><td>-i hỏi trước khi ghi đè (ex3 Part A.5).<\/td><\/tr><tr><td><code>|<\/code> vs <code>tee<\/code><\/td><td>pipe chuyển output sang lệnh khác; tee vừa ghi file vừa đưa tiếp ra màn hình.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week3.pdf tr.9, 14, 17–18, 22–32<\/p>","bay":"<div class=\"card\" id=\"k3-trap-link\"><b>Bẫy 1 — xoá file gốc<\/b><div>Thứ tự trong ex3: <code>ln Hi.txt Hi-hard<\/code>, <code>ln -s Hi.txt Hi-sym<\/code>, <code>rm Hi.txt<\/code> → <code>cat Hi-hard<\/code> vẫn ra nội dung (inode còn, link count giảm 1); <code>cat Hi-sym<\/code> báo không tìm thấy (link hỏng, ls tô đỏ).<\/div><\/div><div class=\"card\" id=\"k3-trap-uniq\"><b>Bẫy 2 — uniq không sort<\/b><div><code>ls /bin /usr/bin | uniq | wc -l<\/code> đếm sai vì uniq chỉ bỏ dòng trùng <b>liền kề<\/b>. Phải <code>sort<\/code> trước: <code>ls /bin /usr/bin | sort | uniq | wc -l<\/code>.<\/div><\/div><div class=\"card\" id=\"k3-trap-umask\"><b>Bẫy 3 — umask<\/b><div>umask 0002 → file mới <code>rw-rw-r--<\/code>. <b>Đổi một chỗ:<\/b> umask 0022 → <code>rw-r--r--<\/code>; umask 0000 → <code>rw-rw-rw-<\/code>. File mới không bao giờ có x mặc định (gốc là 666).<\/div><\/div><div class=\"card\" id=\"k3-trap-dir\"><b>Bẫy 4 — quyền thư mục<\/b><div>Có <code>w<\/code> mà thiếu <code>x<\/code> trên thư mục thì vẫn không tạo/xoá file được. Có <code>r<\/code> mà thiếu <code>x<\/code>: liệt kê tên nhưng không cd vào được.<\/div><\/div><div class=\"card\" id=\"k3-trap-octal\"><b>Bẫy 5 — octal hay nhầm<\/b><div>600 = rw------- · 640 = rw-r----- · 644 = rw-r--r-- · 664 = rw-rw-r-- · 700 = rwx------ · 755 = rwxr-xr-x · 777 = rwxrwxrwx.<\/div><\/div><div class=\"card\" id=\"k3-trap-key\"><b>Bẫy 6 — khoá nào ở đâu<\/b><div>Private key ở <b>máy mình<\/b> (hoặc trong secret của runner); public key ở <b>server<\/b>. Server dùng public key để kiểm tra, không bao giờ cần private key.<\/div><\/div><div class=\"card\"><b>Bẫy 7 — <code>&gt;<\/code> ghi đè cả khi lệnh lỗi<\/b><div><code>ls -l /khong-co &gt; out.txt<\/code>: lỗi vẫn in ra màn hình (stderr không bị chuyển) và out.txt bị cắt còn 0 byte (TLCL tr.81–82, ngoài slide).<\/div><\/div>","checklist":["Prompt $ và #, lịch sử lệnh, cây thư mục bắt đầu từ /, đường dẫn tuyệt đối và tương đối, . .. ~","pwd, cd, ls -l/-a/-li, mkdir -p, cp -i/-r, mv, rm -r, touch, wildcard","Hard link và symlink (ln, ln -s): inode, link count, xóa file gốc thì symlink bị hỏng còn hard link vẫn đọc được","Pipe và redirect: >, >>, 2>, |, sort, uniq (cần sort trước), wc -l/-w/-c, grep, head, tail, tee","Quyền rwx cho user/group/other, số bát phân (r=4, w=2, x=1), chmod 600/664/777, chmod u+x, chown, sudo; umask: file mặc định 666 − umask, thư mục 777 − umask","SSH: cặp khóa (private giữ ở máy mình, public đặt trong ~/.ssh/authorized_keys trên server), ssh-keygen, ssh -i key.pem user@host, chmod 400 key.pem, scp","＋ su vs sudo; chown/chgrp; chmod g+s cho thư mục chia sẻ; id","＋ scp vs rsync; ping/traceroute trước khi nghi key","＋ Ý nghĩa r/w/x trên thư mục khác trên file"],"quick":[{"de":"Prompt <code>root@server:/etc#<\/code> cho biết gì?","dap_an":["Đang ở home, user thường","Phiên có quyền superuser, đang ở /etc","Lệnh trước bị lỗi","Đang trong container Docker"],"dung":[1],"giai_thich":"Dấu # = superuser; phần trước là thư mục hiện tại.","code":null,"lang":null},{"de":"umask 0022, tạo file mới bằng <code>&gt; f<\/code>. <code>ls -l f<\/code> hiện quyền nào?","dap_an":["rw-rw-rw-","rw-r--r--","rwxr-xr-x","rw-rw-r--"],"dung":[1],"giai_thich":"666 bỏ bit w của group và others → 644.","code":null,"lang":null},{"de":"Xoá file gốc thì loại link nào vẫn đọc được nội dung?","dap_an":["Symbolic link","Hard link","Cả hai","Không loại nào"],"dung":[1],"giai_thich":"Hard link dùng chung inode.","code":null,"lang":null}],"docthem":"<ul><li>TLCL tr.81–85: chuyển hướng I/O chi tiết (<code>&gt;<\/code>, <code>&gt;&gt;<\/code>, <code>2&gt;<\/code>, <code>2&gt;&amp;1<\/code>, <code>&amp;&gt;<\/code>, <code>/dev/null<\/code>).<\/li><li>TLCL tr.127: các quyền đặc biệt setuid (4000), setgid (2000), sticky bit (1000) — lý do umask viết 4 chữ số.<\/li><li>TLCL tr.251: cảnh báo host key đổi trong <code>~/.ssh/known_hosts<\/code>, xoá dòng cũ bằng <code>ssh-keygen -R<\/code>.<\/li><li>Chương Processes (TLCL tr.137+): <code>ps<\/code>, <code>top<\/code>, <code>kill<\/code>, job control — slide không dạy.<\/li><\/ul>"}},{"id":"K4","mon":"TTNT","title":"API app, .env, database","src":"week4.pdf · fastapi_llm.pdf · llm_app","page":{"y":"\n<p>Biến app chatbot từ một script thành <b>dịch vụ web bền<\/b>: <b>FastAPI<\/b> ánh xạ “path + method” sang hàm Python, <b>Uvicorn<\/b> (ASGI server) nghe cổng mạng và chuyển request vào app, <b>Pydantic<\/b> kiểm tra dữ liệu vào/ra, <b>.env<\/b> giữ bí mật ngoài mã nguồn, <b>PostgreSQL<\/b> lưu dữ liệu qua connection pool.<\/p>\n<p>Ba câu hỏi của buổi: app tổ chức thế nào (routers/schemas/db) · bí mật nằm đâu (.env) · dữ liệu lưu đâu (PostgreSQL).<\/p>\n<p class=\"src\">Nguồn: week4.pdf tr.4–6, 35; fastapi_llm.pdf tr.4–11<\/p>","mohinh":"\n<h3 id=\"k4-journey\">Hành trình một request <code>POST /chat<\/code><\/h3>\n<div class=\"flow\"><span class=\"s\">Client gửi JSON<\/span><span class=\"ar\">→<\/span><span class=\"s\">Uvicorn (ASGI) nhận<\/span><span class=\"ar\">→<\/span><span class=\"s\">Router khớp path + method<\/span><span class=\"ar\">→<\/span><span class=\"s a\">Pydantic kiểm tra ChatRequest<\/span><span class=\"ar\">→<\/span><span class=\"s\">Depends(get_conn) lấy kết nối từ pool<\/span><span class=\"ar\">→<\/span><span class=\"s\">INSERT vào PostgreSQL<\/span><span class=\"ar\">→<\/span><span class=\"s a\">Lọc qua response_model<\/span><span class=\"ar\">→<\/span><span class=\"s\">Trả JSON<\/span><\/div>\n<p class=\"small\">Sai dữ liệu → dừng ở bước kiểm tra, trả <b>422<\/b>, hàm endpoint <b>không chạy<\/b>, DB không bị chạm tới.<\/p>\n<h3 id=\"k4-structure\">Cấu trúc project<\/h3>\n<pre data-lang=\"text\">app/\n|-- main.py          # tạo FastAPI(), include_router(...)\n|-- routers/chat.py  # endpoint /chat\n|-- schemas/chat.py  # Pydantic request/response models\n|-- db/database.py   # connection pool, get_conn dependency\n+-- .env             # bí mật, KHÔNG commit<\/pre>\n<h3 id=\"k4-proxy\">FastAPI đóng hai vai khi gọi LLM<\/h3>\n<div class=\"flow\"><span class=\"s\">Client<\/span><span class=\"ar\">→<\/span><span class=\"s a\">FastAPI (server với client)<\/span><span class=\"ar\">→<\/span><span class=\"s a\">FastAPI (client với Gemini)<\/span><span class=\"ar\">→<\/span><span class=\"s\">Gemini API<\/span><\/div>\n<p class=\"small\">FastAPI vừa là Server (đối với Client) vừa là Client (đối với Gemini), giống một proxy.<\/p>\n<p class=\"src\">Nguồn: week4.pdf tr.6, 10, 35; fastapi_llm.pdf tr.15<\/p>","bang":"\n<h3 id=\"k4-uvicorn\">Chạy app bằng Uvicorn<\/h3>\n<pre data-lang=\"bash\">uvicorn app.main:app --reload --port 8000<\/pre><div class=\"tw\"><table><tr><th>Phần<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>app.main<\/code><\/td><td>đường dẫn module Python = file <code>app/main.py<\/code> (dấu chấm thay dấu /, bỏ .py)<\/td><\/tr><tr><td><code>:app<\/code><\/td><td>tên <b>biến<\/b> giữ đối tượng <code>FastAPI()<\/code> trong file đó<\/td><\/tr><tr><td><code>--reload<\/code><\/td><td>tự khởi động lại khi sửa code — <b>chỉ dùng khi dev<\/b><\/td><\/tr><tr><td><code>--port 8000<\/code><\/td><td>cổng mạng để nghe<\/td><\/tr><\/table><\/div><div class=\"note \">Quy tắc: <code>uvicorn &lt;thư_mục&gt;.&lt;file&gt;:&lt;biến&gt;<\/code>. File <code>app/main.py<\/code> có <code>api = FastAPI()<\/code> → <code>uvicorn app.main:api<\/code>.<\/div><p class=\"src\">Nguồn: week4.pdf tr.9<\/p>\n<h3 id=\"k4-router\">APIRouter<\/h3>\n<pre data-lang=\"python\"># app/routers/chat.py\nrouter = APIRouter(prefix=&quot;/chat&quot;, tags=[&quot;chat&quot;])\n\n@router.post(&quot;/&quot;)          # -&gt; POST /chat/\nasync def send_message(...): ...\n\n@router.get(&quot;/history&quot;)    # -&gt; GET /chat/history\nasync def get_history(...): ...\n\n# app/main.py\napp.include_router(chat.router)<\/pre><p>URL = <code>prefix<\/code> + path của decorator. <code>tags<\/code> chỉ dùng để nhóm endpoint trên trang <code>/docs<\/code>, <b>không<\/b> nằm trong URL.<\/p><p class=\"src\">Nguồn: week4.pdf tr.11; materials/llm_app/completed/main.py, routers/chat.py<\/p>\n<h3 id=\"k4-pydantic\">Pydantic: model vào và model ra<\/h3>\n<pre data-lang=\"python\">class ChatRequest(BaseModel):      # dữ liệu VÀO\n    role: str\n    content: str\n\nclass ChatResponse(BaseModel):     # dữ liệu RA\n    id: int\n    role: str\n    content: str\n    created_at: datetime\n\n@router.post(&quot;/&quot;, response_model=ChatResponse)\nasync def send_message(msg: ChatRequest, conn=Depends(get_conn)): ...<\/pre><ul><li>Thiếu field bắt buộc (ví dụ thiếu <code>content<\/code>) → FastAPI tự trả <b>422 Unprocessable Entity<\/b>, hàm không chạy.<\/li><li><code>response_model<\/code> định hình dữ liệu ra và <b>ẩn field nội bộ<\/b> (password, token) — field thừa bị bỏ đi, không phải thành <code>null<\/code>.<\/li><li>Code mẫu llm_app dùng thêm <code>Field(..., min_length=1, max_length=20_000)<\/code> để chặn chuỗi rỗng; <code>title: str | None = None<\/code> là field tùy chọn có mặc định.<\/li><\/ul><p class=\"src\">Nguồn: week4.pdf tr.12–14; fastapi_llm.pdf tr.10–11; llm_app/completed/schemas/chat.py<\/p>\n<h3 id=\"k4-status\">HTTP status code<\/h3>\n<div class=\"tw\"><table><tr><th>Mã<\/th><th>Ý nghĩa<\/th><th>Gặp khi<\/th><\/tr><tr><td>2xx · <b>200<\/b> OK<\/td><td>thành công<\/td><td>request bình thường<\/td><\/tr><tr><td><b>401<\/b> Unauthorized<\/td><td>lỗi phía client<\/td><td>sai API key (Gemini)<\/td><\/tr><tr><td><b>404<\/b> Not Found<\/td><td>lỗi phía client<\/td><td>sai đường dẫn / không có tài nguyên (llm_app: conversation không tồn tại)<\/td><\/tr><tr><td><b>422<\/b> Unprocessable Entity<\/td><td>lỗi phía client<\/td><td>body không khớp model Pydantic<\/td><\/tr><tr><td><b>429<\/b> Rate Limit<\/td><td>quá số lượt cho phép<\/td><td>gọi LLM quá nhiều → chờ, giảm tần suất, đổi provider<\/td><\/tr><tr><td>5xx · <b>500<\/b> Internal Server Error<\/td><td>lỗi phía server<\/td><td>code crash (llm_app: lỗi PostgreSQL → 500)<\/td><\/tr><tr><td><b>502<\/b><\/td><td>lỗi phía server (upstream)<\/td><td>llm_app: Gemini không sinh được câu trả lời<\/td><\/tr><tr><td><b>503<\/b><\/td><td>lỗi phía server<\/td><td>dịch vụ chưa sẵn sàng (đề mẫu Q10: healthcheck gặp 503 → fail)<\/td><\/tr><\/table><\/div><p class='small muted'>Artifact còn liệt kê 201 (Created), 400 (Bad Request), 3xx (chuyển hướng): slide chỉ nêu theo nhóm 2xx/4xx/5xx nên chỉ cần nhớ nhóm. Timeout khi gọi LLM: đặt thời gian chờ hợp lý và retry; 5xx/429 kéo dài → dự phòng Groq.<\/p><p class=\"src\">Nguồn: fastapi_llm.pdf tr.6, 16–17; week4.pdf tr.13; llm_app/completed/routers/chat.py<\/p>\n<h3 id=\"k4-env\">.env và cấu hình<\/h3>\n<pre data-lang=\"bash\"># .env (KHÔNG commit, nằm trong .gitignore)\nDATABASE_URL=postgresql://user:secret@localhost:5432/chatdb<\/pre><pre data-lang=\"python\"># Cách 1: python-dotenv\nfrom dotenv import load_dotenv\nimport os\nload_dotenv()\nDATABASE_URL = os.getenv(&quot;DATABASE_URL&quot;)   # thiếu -&gt; None\nif DATABASE_URL is None:\n    raise RuntimeError(&quot;DATABASE_URL is not set&quot;)\n\n# Cách 2: pydantic-settings (gom và kiểm tra mọi biến ở một chỗ)\nclass Settings(BaseSettings):\n    database_url: str                 # bắt buộc: thiếu -&gt; lỗi rõ ràng khi khởi động\n    app_env: str = &quot;development&quot;      # có mặc định\n    class Config:\n        env_file = &quot;.env&quot;\nsettings = Settings()<\/pre><div class=\"tw\"><table><tr><th>Đoạn<\/th><th>Ý nghĩa<\/th><\/tr><tr><td><code>postgresql<\/code><\/td><td>driver/scheme<\/td><\/tr><tr><td><code>user:password<\/code><\/td><td>thông tin đăng nhập<\/td><\/tr><tr><td><code>localhost:5432<\/code><\/td><td>host + port (5432 = cổng mặc định của PostgreSQL)<\/td><\/tr><tr><td><code>chatdb<\/code><\/td><td>tên database<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week4.pdf tr.20–24; fastapi_llm.pdf tr.12–13<\/p>\n<h3 id=\"k4-sql\">PostgreSQL: bảng, CRUD, JOIN<\/h3>\n<pre data-lang=\"sql\">CREATE TABLE messages (\n  id SERIAL PRIMARY KEY,          -- số tự tăng, định danh duy nhất\n  role VARCHAR(20) NOT NULL,      -- &quot;user&quot; / &quot;assistant&quot;\n  content TEXT NOT NULL,          -- TEXT không giới hạn độ dài\n  created_at TIMESTAMP DEFAULT now()\n);\nINSERT INTO messages (role, content) VALUES (&#x27;user&#x27;, &#x27;Xin chao&#x27;);   -- Create\nSELECT * FROM messages ORDER BY created_at;                         -- Read\nUPDATE messages SET content = &#x27;Da sua&#x27; WHERE id = 1;                -- Update\nDELETE FROM messages WHERE id = 1;                                  -- Delete\n\nALTER TABLE messages ADD COLUMN conversation_id INTEGER\n  REFERENCES conversations(id);                                     -- khóa ngoại\nSELECT c.title, m.role, m.content\nFROM messages m JOIN conversations c ON m.conversation_id = c.id\nWHERE c.id = 5 ORDER BY m.created_at;<\/pre><div class=\"tw\"><table><tr><th>Log lỗi<\/th><th>Nguyên nhân / cách xử lý<\/th><\/tr><tr><td><code>connection refused<\/code><\/td><td>sai connection string (host/port) hoặc container DB chưa chạy → kiểm tra <code>docker ps<\/code><\/td><\/tr><tr><td><code>relation &quot;messages&quot; does not exist<\/code><\/td><td>chưa tạo bảng / chưa chạy migration trên DB này<\/td><\/tr><tr><td><code>invalid input syntax for type integer<\/code><\/td><td>sai kiểu dữ liệu, ví dụ chèn chuỗi \"abc\" vào cột INTEGER<\/td><\/tr><\/table><\/div>\n<p id=\"k4-pool\"><b>Connection pool:<\/b> mở sẵn vài kết nối (<code>min_size=2, max_size=10<\/code>), tạo <b>một lần khi server khởi động<\/b> và đóng một lần khi tắt (llm_app dùng <code>lifespan<\/code>), không tạo theo từng request. <b>Migration<\/b> (Alembic): script đổi schema có phiên bản, commit vào Git: <code>alembic revision --autogenerate -m \"...\"<\/code>, <code>alembic upgrade head<\/code>.<\/p>\n<p class=\"src\">Nguồn: week4.pdf tr.25–34; llm_app/completed/db/database.py, main.py<\/p>\n<h3 id=\"k4-test\">Kiểm thử endpoint<\/h3>\n<pre data-lang=\"bash\">curl -X POST http://localhost:8000/chat \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d &#x27;{&quot;message&quot;: &quot;Xin chào&quot;}&#x27;<\/pre><pre data-lang=\"python\">from fastapi.testclient import TestClient\nfrom main import app\nclient = TestClient(app)\n\ndef test_health():\n    response = client.get(&quot;/health&quot;)\n    assert response.status_code == 200\n    assert response.json() == {&quot;status&quot;: &quot;ok&quot;}   # so sánh TOÀN BỘ body<\/pre><p>Hoặc mở <code>localhost:8000/docs<\/code> (Swagger UI tự sinh) → chọn endpoint → <b>Try it out<\/b> → <b>Execute<\/b>.<\/p><p class=\"src\">Nguồn: fastapi_llm.pdf tr.18–19; CI.pdf tr.19; đề mẫu Q17<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>WSGI vs <b>ASGI<\/b><\/td><td>WSGI: chỉ đồng bộ, mỗi worker một request (Flask/Django cũ). ASGI: sync + async, nhiều request đồng thời — hợp chat/streaming/WebSocket, không bị chặn khi chờ LLM/DB.<\/td><\/tr><tr><td><code>app.main:api<\/code> vs <code>main.app:api<\/code><\/td><td>Trước dấu <code>:<\/code> là <b>module path<\/b> (thư mục.file), sau dấu <code>:<\/code> là <b>biến<\/b>. Đảo vị trí là sai.<\/td><\/tr><tr><td><code>prefix<\/code> vs <code>tags<\/code><\/td><td>prefix ghép vào URL; tags chỉ nhóm trên /docs.<\/td><\/tr><tr><td>Request model vs <code>response_model<\/code><\/td><td>Request model kiểm tra dữ liệu vào (sai → 422). response_model định hình/lọc dữ liệu ra (bỏ field thừa).<\/td><\/tr><tr><td>Thiếu field vs chuỗi rỗng<\/td><td><code>{\"role\":\"user\"}<\/code> thiếu content → 422. <code>\"content\": \"\"<\/code> vẫn là <code>str<\/code> hợp lệ (trừ khi có <code>min_length=1<\/code>).<\/td><\/tr><tr><td>Kiểu dữ liệu vs giá trị cho phép<\/td><td><code>role: str<\/code> chỉ kiểm tra kiểu: \"moderator\" vẫn hợp lệ.<\/td><\/tr><tr><td><code>os.getenv()<\/code> vs <code>BaseSettings<\/code><\/td><td>getenv trả None khi thiếu biến (phải tự kiểm tra). BaseSettings gom về một chỗ, kiểm tra kiểu, thiếu biến bắt buộc → lỗi rõ ràng.<\/td><\/tr><tr><td>401 vs 429 vs timeout (LLM)<\/td><td>401 sai key → kiểm tra .env/tạo key mới. 429 rate limit → chờ, giảm tần suất, đổi provider. Timeout → đặt thời gian chờ hợp lý và retry.<\/td><\/tr><tr><td><code>response.json()<\/code> vs <code>response.json<\/code><\/td><td>Có ngoặc → dict body. Không ngoặc → đối tượng method (luôn truthy, không kiểm tra gì).<\/td><\/tr><tr><td>PRIMARY KEY vs khóa ngoại (REFERENCES)<\/td><td>PK định danh từng dòng. Khóa ngoại liên kết dòng sang bảng khác; JOIN “đi theo” liên kết đó.<\/td><\/tr><tr><td>TEXT vs VARCHAR(n)<\/td><td>TEXT không giới hạn độ dài; VARCHAR(n) giới hạn n ký tự.<\/td><\/tr><tr><td>curl vs /docs<\/td><td>curl: gõ lệnh trong terminal. /docs: Swagger UI tự sinh, bấm Try it out → Execute.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: week4.pdf tr.8–9, 11, 13, 23–26; fastapi_llm.pdf tr.16, 18–19<\/p>","bay":"<div class=\"card\" id=\"k4-trap-uvicorn\"><b>Bẫy 1 — đường dẫn uvicorn (đề mẫu Q1)<\/b><div>File <code>app/main.py<\/code>, biến <code>api = FastAPI()<\/code>. Đúng: <code>uvicorn app.main:api<\/code>. Sai kiểu đảo: <code>main.app:api<\/code>, <code>app.api:main<\/code>, hoặc giữ <code>:app<\/code> theo thói quen.<br><b>Đổi một chỗ:<\/b> đổi tên biến thành <code>server<\/code> → lệnh thành <code>app.main:server<\/code>; chuyển file ra gốc <code>main.py<\/code> → <code>main:api<\/code>.<\/div><\/div><div class=\"card\" id=\"k4-trap-prefix\"><b>Bẫy 2 — prefix + path (đề mẫu Q2)<\/b><div><code>APIRouter(prefix=\"/chat\", tags=[\"messages\"])<\/code> + <code>@router.get(\"/history\")<\/code> → <code>GET /chat/history<\/code>. Không có <code>/messages/...<\/code> vì tags không vào URL.<br><b>Đổi một chỗ:<\/b> <code>@router.post(\"/history\")<\/code> → chỉ <code>POST /chat/history<\/code> khớp; gọi GET sẽ không khớp route này.<\/div><\/div><div class=\"card\" id=\"k4-trap-422\"><b>Bẫy 3 — thiếu field (Q3) và luật kiểm tra (Q4)<\/b><div><code>{\"role\": \"user\"}<\/code> thiếu <code>content<\/code> → <b>422<\/b> trước khi vào hàm (PostgreSQL không liên quan, không tự gán chuỗi rỗng/None).<br>Chỉ xét luật đã khai báo: <code>{\"role\":\"moderator\",\"content\":\"Hello\"}<\/code> và <code>{\"role\":\"assistant\",\"content\":\"\"}<\/code> đều <b>hợp lệ<\/b>.<br><b>Đổi một chỗ:<\/b> thêm <code>content: str = Field(..., min_length=1)<\/code> → chuỗi rỗng bị 422. Đổi thành <code>content: str | None = None<\/code> → thiếu content vẫn hợp lệ, content = None.<\/div><\/div><div class=\"card\" id=\"k4-trap-respmodel\"><b>Bẫy 4 — response_model lọc field (Q5)<\/b><div>Hàm trả <code>{\"id\":7,\"content\":\"Hello\",\"internal_token\":\"secret\"}<\/code> với <code>response_model=PublicMessage(id, content)<\/code> → client nhận <code>{\"id\": 7, \"content\": \"Hello\"}<\/code>. Field thừa bị <b>bỏ hẳn<\/b>, không thành <code>null<\/code>.<br><b>Đổi một chỗ:<\/b> bỏ <code>response_model<\/code> → token bị lộ ra client.<\/div><\/div><div class=\"card\"><b>Bẫy 5 — .env và lịch sử Git<\/b><div>Lỡ commit password rồi xóa dòng đó ở commit sau: <b>vẫn lộ<\/b> vì commit cũ còn trong lịch sử. Cách đúng: .env + .gitignore ngay từ đầu.<\/div><\/div><div class=\"card\" id=\"k4-depends\"><b>Bẫy 6 — pool và Depends<\/b><div>Pool tạo <b>một lần<\/b> lúc khởi động (lifespan), không phải mỗi request. <code>Depends(get_conn)<\/code> chạy trước endpoint và đưa connection vào; gọi cùng dependency hai lần trong <b>một request<\/b> thì dùng lại kết quả đầu (cache). Lợi ích: test có thể override <code>get_conn<\/code> bằng kết nối giả.<\/div><\/div><div class=\"card\"><b>Bẫy 7 — so sánh JSON trong test<\/b><div><code>/health<\/code> trong llm_app trả <code>{\"status\":\"ok\",\"model\":...}<\/code> → <code>assert response.json() == {\"status\": \"ok\"}<\/code> <b>FAIL<\/b> (thiếu key model). Muốn kiểm tra một phần: <code>response.json()[\"status\"] == \"ok\"<\/code>.<\/div><\/div>","checklist":["Client-server, cấu trúc HTTP request/response (method, header, body), status code 2xx/3xx/4xx/5xx (200, 201, 400, 401, 404, 422, 500, 503)","REST, endpoint, JSON; GET và POST","Cấu trúc project: main.py, routers/, schemas/, db/, .env; APIRouter(prefix=..., tags=...) + include_router (tags chỉ dùng cho /docs)","Uvicorn là ASGI server; ASGI và WSGI; cú pháp uvicorn package.module:biến --reload --port; trang /docs tự sinh","Pydantic BaseModel: thiếu field hoặc sai kiểu thì trả 422; Optional/giá trị mặc định; response_model lọc bỏ field thừa",".env + python-dotenv/settings, .env phải nằm trong .gitignore; tích hợp Gemini API key; các lỗi 401/429/timeout khi gọi LLM","PostgreSQL: thiết kế bảng, khóa chính/ngoại, DATABASE_URL, connection pool, session dependency (Depends), SQL cơ bản và JOIN","Test endpoint: /health, TestClient, assert response.status_code, response.json() == ...","＋ Depends cache kết quả trong một request; pool tạo một lần lúc startup (lifespan)","＋ 3 lỗi SQL hay gặp: connection refused · relation does not exist · invalid input syntax","＋ Migration với Alembic (revision --autogenerate, upgrade head)","＋ FastAPI vừa là server vừa là client khi gọi Gemini; 502 khi upstream lỗi; dự phòng Groq"],"quick":[{"de":"File <code>src/server.py<\/code> chứa <code>web = FastAPI()<\/code>. Lệnh uvicorn nào đúng?","dap_an":["<code>uvicorn src.server:web<\/code>","<code>uvicorn server.src:web<\/code>","<code>uvicorn src.web:server<\/code>","<code>uvicorn src.server:app<\/code>"],"dung":[0],"giai_thich":"Module path <code>src.server<\/code> (file src/server.py) + <code>:web<\/code> (tên biến).","code":null,
