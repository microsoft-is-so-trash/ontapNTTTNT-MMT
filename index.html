=\"img\" aria-label=\"Cây DNS và truy vấn lặp\">\n<g font-size=\"13\">\n<rect x=\"270\" y=\"10\" width=\"160\" height=\"34\" rx=\"8\" class=\"boxa\"/><text x=\"290\" y=\"32\" font-weight=\"700\">Root DNS servers<\/text>\n<rect x=\"90\" y=\"80\" width=\"120\" height=\"30\" rx=\"6\" class=\"box\"/><text x=\"104\" y=\"100\">com DNS<\/text>\n<rect x=\"290\" y=\"80\" width=\"120\" height=\"30\" rx=\"6\" class=\"box\"/><text x=\"304\" y=\"100\">org DNS<\/text>\n<rect x=\"490\" y=\"80\" width=\"120\" height=\"30\" rx=\"6\" class=\"box\"/><text x=\"504\" y=\"100\">edu DNS<\/text>\n<text x=\"620\" y=\"100\" font-size=\"11.5\" class=\"muted\">← TLD<\/text>\n<rect x=\"20\" y=\"148\" width=\"110\" height=\"28\" rx=\"6\" class=\"box\"/><text x=\"28\" y=\"167\" font-size=\"12\">yahoo.com<\/text>\n<rect x=\"140\" y=\"148\" width=\"120\" height=\"28\" rx=\"6\" class=\"box\"/><text x=\"148\" y=\"167\" font-size=\"12\">amazon.com<\/text>\n<rect x=\"290\" y=\"148\" width=\"110\" height=\"28\" rx=\"6\" class=\"box\"/><text x=\"298\" y=\"167\" font-size=\"12\">pbs.org<\/text>\n<rect x=\"440\" y=\"148\" width=\"100\" height=\"28\" rx=\"6\" class=\"box\"/><text x=\"448\" y=\"167\" font-size=\"12\">poly.edu<\/text>\n<rect x=\"550\" y=\"148\" width=\"120\" height=\"28\" rx=\"6\" class=\"box\"/><text x=\"558\" y=\"167\" font-size=\"12\">umass.edu<\/text>\n<text x=\"560\" y=\"194\" font-size=\"11.5\" class=\"muted\">← có thẩm quyền<\/text>\n<path d=\"M350 44 L150 80 M350 44 L350 80 M350 44 L550 80 M150 110 L75 148 M150 110 L200 148 M350 110 L345 148 M550 110 L490 148 M550 110 L610 148\" class=\"ln\"/>\n<\/g>\n<g font-size=\"12.5\">\n<text x=\"10\" y=\"222\" font-weight=\"700\">Truy vấn lặp:<\/text><text x=\"110\" y=\"222\">server được hỏi trả về “hãy hỏi server này” (root → TLD → có thẩm quyền)<\/text>\n<text x=\"10\" y=\"244\" font-weight=\"700\">Truy vấn đệ quy:<\/text><text x=\"130\" y=\"244\">server được hỏi tự phân giải thay bên hỏi → tải nặng ở cấp trên<\/text>\n<text x=\"10\" y=\"266\" class=\"muted\">Server cục bộ (của ISP) không hẳn thuộc cây: như proxy, có cache (hết hạn theo TTL).<\/text>\n<text x=\"10\" y=\"288\" class=\"muted\">Ví dụ www.amazon.com: root → .com TLD → amazon.com (có thẩm quyền) → IP.<\/text>\n<\/g><\/svg><div class=\"cap\">DNS: cơ sở dữ liệu phân tán, phân cấp (chuong 2 tr.53–59)<\/div><\/div>\n<h3 id=\"c2-http-time\">Thời gian tải trang HTTP<\/h3><div class=\"tw\"><table><tr><th>Kiểu<\/th><th>Mỗi đối tượng<\/th><th>Trang = HTML gốc + N đối tượng (tuần tự, không song song)<\/th><\/tr><tr><td>Không liên tục (non-persistent, HTTP/1.0)<\/td><td>1 RTT mở TCP + 1 RTT yêu cầu/đáp ứng + thời gian truyền tệp = <b>2RTT + t<sub>truyền<\/sub><\/b><\/td><td>(N+1) × 2RTT (+ thời gian truyền)<\/td><\/tr><tr><td>Liên tục (persistent, HTTP/1.1)<\/td><td>kết nối giữ mở; mỗi đối tượng tiếp theo 1 RTT (với pipelining: ít nhất 1 RTT cho tất cả)<\/td><td>2RTT (TCP + HTML) + N × RTT<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.22–26<\/p>\n<h3 id=\"c2-arch\">Client-server và P2P<\/h3><div class=\"tw\"><table><tr><th><\/th><th>Client-server<\/th><th>P2P<\/th><\/tr><tr><td>Server<\/td><td>host luôn hoạt động, IP cố định, ở data center<\/td><td>không có server luôn hoạt động<\/td><\/tr><tr><td>Bên kia<\/td><td>client có thể không kết nối liên tục, IP có thể đổi, <b>không<\/b> nói chuyện trực tiếp với client khác<\/td><td>peer nói chuyện trực tiếp, vừa yêu cầu vừa cung cấp dịch vụ; peer không kết nối liên tục, đổi IP<\/td><\/tr><tr><td>Mở rộng / quản lý<\/td><td>—<\/td><td>tự mở rộng (peer mới mang thêm năng lực), quản lý phức tạp<\/td><\/tr><tr><td>Ví dụ<\/td><td>Web, mail<\/td><td>BitTorrent, KanKan, Skype<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.6–8, 66<\/p>","bang":"<h3 id=\"c2-transport\">Ứng dụng cần gì từ tầng giao vận<\/h3><div class=\"tw\"><table><tr><th>Ứng dụng<\/th><th>Mất dữ liệu<\/th><th>Thông lượng<\/th><th>Thời gian thực<\/th><th>Giao thức ứng dụng / giao vận<\/th><\/tr><tr><td>Truyền file<\/td><td>không<\/td><td>mềm dẻo<\/td><td>không<\/td><td>FTP [RFC 959] / TCP<\/td><\/tr><tr><td>Thư điện tử<\/td><td>không<\/td><td>mềm dẻo<\/td><td>không<\/td><td>SMTP [RFC 5321] / TCP<\/td><\/tr><tr><td>Web<\/td><td>không<\/td><td>mềm dẻo<\/td><td>không<\/td><td>HTTP / TCP<\/td><\/tr><tr><td>Audio/video thời gian thực<\/td><td>chịu lỗi<\/td><td>audio 5 kbps–1 Mbps, video 10 kbps–5 Mbps<\/td><td>có, 100 ms<\/td><td>—<\/td><\/tr><tr><td>Trò chơi tương tác<\/td><td>chịu lỗi<\/td><td>vài kbps<\/td><td>có, 100 ms<\/td><td>—<\/td><\/tr><tr><td>Streaming multimedia<\/td><td><\/td><td><\/td><td><\/td><td>HTTP, RTP / <b>TCP hoặc UDP<\/b><\/td><\/tr><tr><td>Điện thoại Internet<\/td><td><\/td><td><\/td><td><\/td><td>SIP, RTP, độc quyền (Skype) / <b>TCP hoặc UDP<\/b><\/td><\/tr><tr><td>Truy nhập từ xa<\/td><td><\/td><td><\/td><td><\/td><td>Telnet / TCP<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>TCP<\/th><th>UDP<\/th><\/tr><tr><td>truyền tin cậy · điều khiển luồng (bên gửi không lấn át bên nhận) · điều khiển tắc nghẽn · <b>hướng kết nối<\/b><\/td><td>truyền <b>không tin cậy<\/b>; không có tin cậy, điều khiển luồng, tắc nghẽn, thiết lập kết nối<\/td><\/tr><tr><td>không cung cấp: thời gian thực, đảm bảo băng thông, bảo mật<\/td><td>không cung cấp: thời gian thực, băng thông, bảo mật<\/td><\/tr><\/table><\/div><p>TCP/UDP <b>không mã hoá<\/b>; SSL/TLS là bảo mật ở tầng ứng dụng: ứng dụng dùng thư viện TLS gọi xuống TCP → kết nối mã hoá, toàn vẹn dữ liệu, xác thực đầu cuối.<\/p><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.13–17<\/p>\n<h3 id=\"c2-http\">HTTP<\/h3><pre data-lang=\"text\">GET /index.html HTTP/1.1\\r\\n          &lt;- dòng yêu cầu: method sp URL sp version\nHost: www-net.cs.umass.edu\\r\\n        &lt;- các dòng tiêu đề\nUser-Agent: Firefox/3.6.10\\r\\n\nConnection: keep-alive\\r\\n\n\\r\\n                                   &lt;- dòng trống: hết phần tiêu đề\n(entity body)<\/pre><div class=\"tw\"><table><tr><th>Mục<\/th><th>Nội dung<\/th><\/tr><tr><td>Kết nối<\/td><td>client mở TCP tới server <b>cổng 80<\/b>; trao đổi thông điệp HTTP; đóng TCP<\/td><\/tr><tr><td>Không trạng thái<\/td><td>server không lưu thông tin về các yêu cầu trước của client<\/td><\/tr><tr><td>Method<\/td><td>HTTP/1.0: GET, POST, HEAD (HEAD: server bỏ đối tượng ra khỏi đáp ứng). HTTP/1.1: thêm PUT (tải tệp lên theo URL), DELETE<\/td><\/tr><tr><td>Mã trạng thái<\/td><td>200 OK · 301 Moved Permanently (vị trí mới ở <code>Location:<\/code>) · 400 Bad Request · 404 Not Found · 505 HTTP Version Not Supported<\/td><\/tr><tr><td>Cookie (4 thành phần)<\/td><td>① dòng <code>set-cookie<\/code> trong <b>đáp ứng<\/b> ② dòng <code>cookie<\/code> trong <b>yêu cầu<\/b> tiếp theo ③ tệp cookie trên host người dùng, do trình duyệt quản lý ④ CSDL back-end tại website. Dùng cho cấp phép, giỏ hàng, khuyến nghị, phiên làm việc<\/td><\/tr><tr><td>Web cache (proxy)<\/td><td>trình duyệt gửi mọi yêu cầu tới cache: có thì trả ngay, không có thì cache hỏi server nguồn rồi trả về. Giảm thời gian đáp ứng và lưu lượng trên liên kết truy nhập; thường do ISP cài đặt; cache vừa là server (với client) vừa là client (với server nguồn)<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.19–35<\/p>\n<h3 id=\"c2-ftp\">FTP<\/h3><ul><li>Client/server, RFC 959; điều khiển: <b>TCP cổng 21<\/b>; dữ liệu: <b>TCP cổng 20<\/b> — mỗi file một kết nối dữ liệu mới, truyền xong server đóng.<\/li><li>Điều khiển “out of band” (kênh riêng). Server duy trì <b>trạng thái<\/b>: thư mục hiện hành, cấp phép trước đó.<\/li><li>Lệnh ASCII: USER, PASS, LIST, RETR (lấy file), STOR (đặt file). Mã trả về: 331 Username OK, password required · 125 data connection already open · 425 Can't open data connection · 452 Error writing file.<\/li><\/ul><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.37–39<\/p>\n<h3 id=\"c2-mail\">Thư điện tử<\/h3><div class=\"tw\"><table><tr><th>Thành phần<\/th><th>Vai trò<\/th><\/tr><tr><td>User agent<\/td><td>“mail reader”: soạn/đọc thư (Outlook, Thunderbird)<\/td><\/tr><tr><td>Mail server<\/td><td>hộp thư (mailbox) thư đến + hàng đợi thông điệp đi<\/td><\/tr><tr><td>SMTP<\/td><td>TCP <b>cổng 25<\/b>, truyền trực tiếp server gửi → server nhận; 3 bước: bắt tay, truyền, đóng; lệnh HELO, MAIL FROM, RCPT TO, DATA, QUIT; thông điệp ASCII 7-bit; kết thúc bằng CRLF.CRLF; kết nối bền vững; <b>đẩy<\/b> (push)<\/td><\/tr><tr><td>POP3<\/td><td>truy nhập thư: cấp phép (user, pass) + giao dịch (list, retr, dele, quit); “tải và xoá” (đổi client là không đọc lại được) hoặc “tải và giữ”; <b>không giữ trạng thái<\/b> giữa các phiên<\/td><\/tr><tr><td>IMAP<\/td><td>giữ mọi thư trên server, tổ chức theo thư mục, <b>giữ trạng thái<\/b> người dùng qua các phiên<\/td><\/tr><tr><td>HTTP (webmail)<\/td><td>gmail, Hotmail, Yahoo! Mail<\/td><\/tr><\/table><\/div><p>Định dạng thư (RFC 822): dòng tiêu đề <code>To:<\/code>, <code>From:<\/code>, <code>Subject:<\/code> (khác lệnh SMTP MAIL FROM/RCPT TO) + dòng trống + thân.<\/p><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.41–49<\/p>\n<h3 id=\"c2-dns\">DNS<\/h3><div class=\"tw\"><table><tr><th>Mục<\/th><th>Nội dung<\/th><\/tr><tr><td>Dịch vụ<\/td><td>dịch tên host → IP; bí danh host; bí danh mail server; phân tán tải (một tên nhiều IP)<\/td><\/tr><tr><td>Vì sao không tập trung<\/td><td>một điểm chịu lỗi, lưu lượng lớn, CSDL ở xa, khó bảo trì → không mở rộng được<\/td><\/tr><tr><td>Root<\/td><td>được server cục bộ hỏi khi không tự phân giải được; trả về cho server cục bộ<\/td><\/tr><tr><td>TLD<\/td><td>com, org, net, edu… và tên quốc gia uk, fr, jp<\/td><\/tr><tr><td>Có thẩm quyền<\/td><td>DNS server của tổ chức, ánh xạ tên → IP cho host của tổ chức<\/td><\/tr><tr><td>Cục bộ (mặc định)<\/td><td>mỗi ISP có một; nhận truy vấn của host, có cache, hoạt động như proxy<\/td><\/tr><tr><td>Cache<\/td><td>mục cache hết hạn theo TTL; host đổi IP thì Internet có thể chưa biết cho tới khi TTL hết<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Bản ghi RR (name, value, type, ttl)<\/th><th>name → value<\/th><\/tr><tr><td>A<\/td><td>tên host → địa chỉ IP<\/td><\/tr><tr><td>NS<\/td><td>tên miền (foo.com) → tên host của server có thẩm quyền<\/td><\/tr><tr><td>CNAME<\/td><td>tên bí danh → tên chuẩn (www.ibm.com → servereast.backup2.ibm.com)<\/td><\/tr><tr><td>MX<\/td><td>tên → tên mail server<\/td><\/tr><\/table><\/div><p>Thông điệp truy vấn và trả lời <b>cùng định dạng<\/b>: identification 16 bit, flags (truy vấn/trả lời, đệ quy…), questions, answers, authority, additional. Đăng ký <code>networkutopia.com<\/code>: registrar chèn bản ghi NS + A của server có thẩm quyền vào TLD .com.<\/p><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.51–64<\/p>\n<h3 id=\"c2-bt\">BitTorrent<\/h3><ul><li>File chia thành <b>chunk<\/b> 256 Kb. <b>Torrent<\/b> = nhóm peer trao đổi chunk của một file; <b>tracker<\/b> theo dõi các peer trong torrent.<\/li><li>Peer mới: đăng ký với tracker lấy danh sách peer, kết nối với tập con (lân cận); vừa download vừa upload; churn: peer đến và đi.<\/li><li>Yêu cầu chunk: <b>hiếm nhất trước<\/b> (rarest first).<\/li><li>Gửi chunk — <b>tit-for-tat<\/b>: gửi cho 4 peer đang gửi cho mình nhanh nhất, đánh giá lại top 4 mỗi <b>10 giây<\/b>; mỗi <b>30 giây<\/b> chọn ngẫu nhiên một peer khác để gửi (“optimistically unchoke”).<\/li><\/ul><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.66–69<\/p>\n<h3 id=\"c2-socket\">Lập trình socket<\/h3><div class=\"tw\"><table><tr><th>UDP socket<\/th><th>TCP socket<\/th><\/tr><tr><td>không “kết nối”, không bắt tay trước khi gửi<\/td><td>client phải tiếp xúc server; tiến trình server phải chạy trước và tạo socket “cửa đón” (welcome)<\/td><\/tr><tr><td>bên gửi gắn IP + cổng đích vào <b>mỗi gói<\/b>; bên nhận trích IP + cổng nguồn từ gói<\/td><td>client tạo socket chỉ rõ IP + cổng server → TCP client thiết lập kết nối<\/td><\/tr><tr><td>dữ liệu có thể mất hoặc sai thứ tự<\/td><td>khi được tiếp xúc, server tạo <b>socket mới<\/b> cho client đó → nói chuyện với nhiều client; cổng nguồn phân biệt client<\/td><\/tr><tr><td>truyền không tin cậy các nhóm byte<\/td><td>truyền tin cậy, dòng byte đúng thứ tự<\/td><\/tr><\/table><\/div><p>Ví dụ: client gửi một dòng → server đổi sang chữ hoa → gửi lại → client hiển thị.<\/p><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.71–75<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>HTTP không liên tục vs liên tục<\/td><td>tối đa 1 đối tượng / kết nối TCP (2RTT mỗi đối tượng) vs nhiều đối tượng trên một kết nối giữ mở.<\/td><\/tr><tr><td>HTTP vs FTP<\/td><td>HTTP: một kết nối cổng 80, không trạng thái. FTP: điều khiển cổng 21 + dữ liệu cổng 20 (out-of-band), có trạng thái.<\/td><\/tr><tr><td>HTTP vs SMTP<\/td><td>HTTP <b>kéo<\/b> (pull), mỗi đối tượng trong một đáp ứng; SMTP <b>đẩy<\/b> (push), nhiều đối tượng trong thông điệp nhiều phần, ASCII 7-bit. Cả hai: lệnh/đáp ứng, mã trạng thái ASCII.<\/td><\/tr><tr><td>SMTP vs POP3/IMAP<\/td><td>SMTP phân phối thư tới server người nhận; POP3/IMAP trích thư từ server về user agent.<\/td><\/tr><tr><td>POP3 vs IMAP<\/td><td>POP3 tải (và xoá), không giữ trạng thái; IMAP giữ thư trên server, thư mục, giữ trạng thái.<\/td><\/tr><tr><td>Truy vấn lặp vs đệ quy<\/td><td>lặp: server trả lời “tôi không biết, hãy hỏi server này”; đệ quy: server được hỏi tự phân giải hộ → tải nặng ở cấp trên.<\/td><\/tr><tr><td>A vs NS vs CNAME vs MX<\/td><td>tên→IP · miền→server có thẩm quyền · bí danh→tên chuẩn · tên→mail server.<\/td><\/tr><tr><td>Client-server vs P2P<\/td><td>server cố định, IP cố định vs peer tự do, tự mở rộng, quản lý phức tạp.<\/td><\/tr><tr><td>TCP vs UDP<\/td><td>tin cậy, luồng, tắc nghẽn, hướng kết nối vs không có gì trong đó.<\/td><\/tr><tr><td>Socket TCP vs UDP<\/td><td>TCP: socket cửa đón + socket riêng cho mỗi client; UDP: mỗi gói mang địa chỉ đích, không bắt tay.<\/td><\/tr><tr><td>set-cookie vs cookie<\/td><td>set-cookie: trong đáp ứng của server (lần đầu); cookie: trong các yêu cầu sau của client.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 2 v1.pdf tr.7–8, 15, 22, 38, 45, 47–49, 57–58, 60, 73–74<\/p>","bay":"<div class=\"card\" id=\"c2-trap-id\"><b>Bẫy 1 — IP có đủ định danh tiến trình?<\/b><div>Không: nhiều tiến trình cùng chạy trên một host → cần <b>IP + số hiệu cổng<\/b> (HTTP server 80, mail server 25).<\/div><\/div><div class=\"card\" id=\"c2-trap-rtt\"><b>Bẫy 2 — đếm RTT<\/b><div>Trang HTML + 10 ảnh, HTTP không liên tục, tuần tự: 11 × 2RTT = <b>22 RTT<\/b> (+ thời gian truyền). <b>Đổi một chỗ:<\/b> HTTP liên tục, không pipelining: 2RTT + 10 RTT = <b>12 RTT<\/b>.<\/div><\/div><div class=\"card\" id=\"c2-trap-ftp\"><b>Bẫy 3 — FTP mấy kết nối<\/b><div>Mỗi lần truyền một file server mở một kết nối dữ liệu mới (cổng 20) và đóng sau khi xong; kết nối điều khiển (cổng 21) giữ suốt phiên.<\/div><\/div><div class=\"card\" id=\"c2-trap-mail\"><b>Bẫy 4 — dòng To:/From: không phải lệnh SMTP<\/b><div><code>MAIL FROM<\/code>, <code>RCPT TO<\/code> là lệnh SMTP; <code>To:<\/code>, <code>From:<\/code>, <code>Subject:<\/code> là dòng tiêu đề trong nội dung thư (RFC 822).<\/div><\/div><div class=\"card\" id=\"c2-trap-pop\"><b>Bẫy 5 — POP3 “tải và xoá”<\/b><div>Bob đọc thư bằng POP3 chế độ tải và xoá trên máy A → sang máy B không đọc lại được. IMAP giữ thư trên server nên đọc được ở mọi nơi.<\/div><\/div><div class=\"card\" id=\"c2-trap-ttl\"><b>Bẫy 6 — cache DNS lỗi thời<\/b><div>Đổi IP của web server nhưng người dùng vẫn vào IP cũ: bản ghi cũ còn trong cache cho tới khi <b>TTL<\/b> hết hạn.<\/div><\/div><div class=\"card\" id=\"c2-trap-tft\"><b>Bẫy 7 — tit-for-tat<\/b><div>Alice gửi chunk cho 4 peer <b>đang gửi cho cô nhanh nhất<\/b> (không phải 4 peer cô tải nhanh nhất từ đó theo kiểu ngẫu nhiên); top 4 xét lại mỗi 10 s; mỗi 30 s mở thêm một peer ngẫu nhiên.<\/div><\/div>","checklist":["Kiến trúc client-server và P2P; process, socket, địa chỉ gồm IP + port","Yêu cầu của ứng dụng (tin cậy, thông lượng, thời gian, bảo mật) và dịch vụ TCP so với UDP; ứng dụng nào dùng giao thức giao vận nào","HTTP: stateless, non-persistent và persistent, tính thời gian theo RTT (2RTT + thời gian truyền), định dạng request/response, method, status code, cookie, web cache/proxy, conditional GET (304) — <i>conditional GET không có trong slide chương 2 v1 (xem Đọc thêm)<\/i>","FTP: port 21 điều khiển, port 20 dữ liệu, out-of-band, stateful","Email: user agent, mail server, SMTP (port 25, push), POP3 và IMAP (pull), so sánh với HTTP","DNS: dịch vụ, cây phân cấp (root, TLD, authoritative, local), truy vấn lặp và đệ quy, cache, bản ghi A/NS/CNAME/MX, dùng UDP port 53 — <i>slide không ghi UDP 53<\/i>","P2P: thời gian phân phối file client-server và P2P, BitTorrent (tracker, torrent, chunk, tit-for-tat) — <i>công thức phân phối file không có trong slide v1; có trong Bài tính MMT<\/i>","Lập trình socket UDP và TCP: các bước, welcome socket và connection socket","＋ SSL/TLS là bảo mật ở tầng ứng dụng; TCP/UDP không mã hoá","＋ FTP lệnh USER/PASS/LIST/RETR/STOR và mã 331/125/425/452","＋ Thông điệp DNS (identification, flags, 4 phần) và cách đăng ký tên miền với registrar; tấn công DNS (DDoS, đầu độc)"],"quick":[{"de":"HTTP không liên tục: thời gian để lấy một đối tượng là?","dap_an":["1 RTT","2 RTT + thời gian truyền tệp","3 RTT","RTT/2"],"dung":[1],"giai_thich":"1 RTT mở TCP, 1 RTT yêu cầu + đáp ứng, cộng thời gian truyền.","code":null,"lang":null},{"de":"Bản ghi DNS nào ánh xạ tên miền tới tên server có thẩm quyền?","dap_an":["A","NS","CNAME","MX"],"dung":[1],"giai_thich":"NS: name = tên miền, value = tên host server có thẩm quyền.","code":null,"lang":null},{"de":"FTP dùng cổng nào cho kết nối điều khiển?","dap_an":["20","21","25","80"],"dung":[1],"giai_thich":"Điều khiển 21, dữ liệu 20.","code":null,"lang":null}],"docthem":"<ul><li><b>Conditional GET (304 Not Modified)<\/b> — Kurose &amp; Ross §2.2.5: cache gửi <code>If-modified-since: &lt;ngày&gt;<\/code>; nếu đối tượng chưa đổi server trả <code>304 Not Modified<\/code> không kèm đối tượng.<\/li><li><b>DNS chạy trên UDP cổng 53<\/b> — Kurose &amp; Ross §2.4 (slide không ghi).<\/li><li><b>Thời gian phân phối file<\/b> (Kurose &amp; Ross §2.5): client-server D<sub>cs<\/sub> ≥ max(NF/u<sub>s<\/sub>, F/d<sub>min<\/sub>); P2P D<sub>P2P<\/sub> ≥ max(F/u<sub>s<\/sub>, F/d<sub>min<\/sub>, NF/(u<sub>s<\/sub> + Σu<sub>i<\/sub>)) — luyện ở mục Bài tính MMT.<\/li><li>Mã nguồn socket Python (UDPClient/TCPServer) trong giáo trình §2.7.<\/li><\/ul>"}},{"id":"C3","mon":"MMT","title":"Tầng giao vận","src":"chuong 3 Tang giao van.pdf","page":{"y":"<p>Tầng giao vận cung cấp <b>truyền thông logic giữa các tiến trình<\/b> (tầng mạng: giữa các <b>host<\/b>). Bên gửi cắt thông điệp thành <b>segment<\/b>, bên nhận ráp lại. Internet có hai giao thức: <b>UDP<\/b> (không kết nối, “best effort”) và <b>TCP<\/b> (tin cậy, đúng thứ tự, điều khiển luồng, điều khiển tắc nghẽn, thiết lập kết nối). Không giao thức nào đảm bảo trễ hay băng thông.<\/p>\n<p>Ví dụ nhà Ann – nhà Bill: host = ngôi nhà · tiến trình = các em bé · thông điệp = lá thư · giao thức giao vận = quy ước giữa Ann và Bill · giao thức tầng mạng = dịch vụ bưu điện.<\/p><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.4–6<\/p>","mohinh":"<h3 id=\"c3-hs\">Bắt tay 3 bước và đóng kết nối<\/h3><div class=\"diagram\"><svg viewBox=\"0 0 700 330\" width=\"700\" role=\"img\" aria-label=\"Bắt tay 3 bước và đóng kết nối TCP\">\n<g font-size=\"12.5\">\n<text x=\"70\" y=\"16\" font-weight=\"700\">client<\/text><text x=\"560\" y=\"16\" font-weight=\"700\">server<\/text>\n<line x1=\"100\" y1=\"24\" x2=\"100\" y2=\"322\" class=\"ln dash\"/><line x1=\"590\" y1=\"24\" x2=\"590\" y2=\"322\" class=\"ln dash\"/>\n<text x=\"10\" y=\"40\" class=\"mono\" font-size=\"11\">LISTEN<\/text><text x=\"600\" y=\"40\" class=\"mono\" font-size=\"11\">LISTEN<\/text>\n<path d=\"M100 50 L586 80\" class=\"lna\"/><path d=\"M580 74 l7 6 l-9 2\" class=\"lna\"/><text x=\"220\" y=\"56\" class=\"mono\">SYNbit=1, Seq=x<\/text>\n<text x=\"10\" y=\"58\" class=\"mono\" font-size=\"11\">SYNSENT<\/text><text x=\"600\" y=\"86\" class=\"mono\" font-size=\"11\">SYN RCVD<\/text>\n<path d=\"M590 92 L104 122\" class=\"lna\"/><path d=\"M112 116 l-8 6 l9 2\" class=\"lna\"/><text x=\"250\" y=\"100\" class=\"mono\">SYNbit=1, Seq=y · ACKbit=1, ACKnum=x+1<\/text>\n<text x=\"10\" y=\"128\" class=\"mono\" font-size=\"11\">ESTAB<\/text>\n<path d=\"M100 132 L586 162\" class=\"lna\"/><path d=\"M580 156 l7 6 l-9 2\" class=\"lna\"/><text x=\"250\" y=\"140\" class=\"mono\">ACKbit=1, ACKnum=y+1 (có thể kèm dữ liệu)<\/text>\n<text x=\"600\" y=\"168\" class=\"mono\" font-size=\"11\">ESTAB<\/text>\n<path d=\"M100 196 L586 214\" class=\"ln\"/><path d=\"M580 208 l7 6 l-9 2\" class=\"ln\"/><text x=\"250\" y=\"198\" class=\"mono\">FINbit=1, seq=x<\/text><text x=\"10\" y=\"200\" class=\"mono\" font-size=\"11\">FIN_WAIT_1<\/text>\n<path d=\"M590 220 L104 238\" class=\"ln\"/><path d=\"M112 232 l-8 6 l9 2\" class=\"ln\"/><text x=\"300\" y=\"224\" class=\"mono\">ACKbit=1; ACKnum=x+1<\/text><text x=\"600\" y=\"224\" class=\"mono\" font-size=\"11\">CLOSE_WAIT<\/text>\n<text x=\"10\" y=\"244\" class=\"mono\" font-size=\"11\">FIN_WAIT_2<\/text>\n<path d=\"M590 256 L104 274\" class=\"ln\"/><path d=\"M112 268 l-8 6 l9 2\" class=\"ln\"/><text x=\"300\" y=\"260\" class=\"mono\">FINbit=1, seq=y<\/text><text x=\"600\" y=\"260\" class=\"mono\" font-size=\"11\">LAST_ACK<\/text>\n<text x=\"10\" y=\"282\" class=\"mono\" font-size=\"11\">TIMED_WAIT<\/text>\n<path d=\"M100 288 L586 306\" class=\"ln\"/><path d=\"M580 300 l7 6 l-9 2\" class=\"ln\"/><text x=\"250\" y=\"290\" class=\"mono\">ACKbit=1; ACKnum=y+1<\/text><text x=\"600\" y=\"312\" class=\"mono\" font-size=\"11\">CLOSED<\/text>\n<text x=\"10\" y=\"318\" font-size=\"11\" class=\"muted\">chờ 2 × thời gian sống tối đa của segment → CLOSED<\/text>\n<\/g><\/svg><div class=\"cap\">chuong 3 tr.80–83<\/div><\/div>\n<h3 id=\"c3-cwnd\">Đồ thị cwnd<\/h3><div class=\"diagram\"><svg viewBox=\"0 0 700 330\" width=\"700\" role=\"img\" aria-label=\"Đồ thị cwnd TCP Tahoe và Reno\"><line x1=\"50\" y1=\"250\" x2=\"680\" y2=\"250\" class=\"ln\"/><line x1=\"50\" y1=\"250\" x2=\"50\" y2=\"20\" class=\"ln\"/><text x=\"30\" y=\"220\" font-size=\"11\" class=\"muted\">2<\/text><line x1=\"46\" y1=\"216\" x2=\"680\" y2=\"216\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"30\" y=\"186\" font-size=\"11\" class=\"muted\">4<\/text><line x1=\"46\" y1=\"182\" x2=\"680\" y2=\"182\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"30\" y=\"152\" font-size=\"11\" class=\"muted\">6<\/text><line x1=\"46\" y1=\"148\" x2=\"680\" y2=\"148\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"30\" y=\"118\" font-size=\"11\" class=\"muted\">8<\/text><line x1=\"46\" y1=\"114\" x2=\"680\" y2=\"114\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"30\" y=\"84\" font-size=\"11\" class=\"muted\">10<\/text><line x1=\"46\" y1=\"80\" x2=\"680\" y2=\"80\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"30\" y=\"50\" font-size=\"11\" class=\"muted\">12<\/text><line x1=\"46\" y1=\"46\" x2=\"680\" y2=\"46\" stroke=\"currentColor\" stroke-opacity=\".08\"/><text x=\"50\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">1<\/text><text x=\"94\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">2<\/text><text x=\"138\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">3<\/text><text x=\"182\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">4<\/text><text x=\"226\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">5<\/text><text x=\"270\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">6<\/text><text x=\"314\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">7<\/text><text x=\"358\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">8<\/text><text x=\"402\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">9<\/text><text x=\"446\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">10<\/text><text x=\"490\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">11<\/text><text x=\"534\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">12<\/text><text x=\"578\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">13<\/text><text x=\"622\" y=\"266\" font-size=\"11\" class=\"muted\" text-anchor=\"middle\">14<\/text><text x=\"365\" y=\"288\" font-size=\"12\" text-anchor=\"middle\">vòng truyền (RTT)<\/text><text x=\"8\" y=\"14\" font-size=\"12\">cwnd (MSS)<\/text><line x1=\"50\" y1=\"114\" x2=\"400\" y2=\"114\" class=\"ln dash\"/><text x=\"56\" y=\"110\" font-size=\"11\" class=\"muted\">ssthresh = 8<\/text><line x1=\"400\" y1=\"148\" x2=\"680\" y2=\"148\" class=\"ln dash\"/><text x=\"560\" y=\"162\" font-size=\"11\" class=\"muted\">ssthresh mới = 6<\/text><polyline fill=\"none\" stroke=\"var(--bad)\" stroke-width=\"2\" points=\"50,233 94,216 138,182 182,114 226,97 270,80 314,63 358,46 402,233 446,216 490,182 534,148 578,131 622,114\"/><polyline fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"2.4\" points=\"50,233 94,216 138,182 182,114 226,97 270,80 314,63 358,46 402,148 446,131 490,114 534,97 578,80 622,63\"/><circle cx=\"50\" cy=\"233\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"94\" cy=\"216\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"138\" cy=\"182\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"182\" cy=\"114\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"226\" cy=\"97\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"270\" cy=\"80\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"314\" cy=\"63\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"358\" cy=\"46\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"402\" cy=\"148\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"446\" cy=\"131\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"490\" cy=\"114\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"534\" cy=\"97\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"578\" cy=\"80\" r=\"3\" fill=\"var(--acc)\"/><circle cx=\"622\" cy=\"63\" r=\"3\" fill=\"var(--acc)\"/><text x=\"370\" y=\"50\" font-size=\"11.5\">← 3 ACK trùng ở cwnd = 12<\/text><text x=\"60\" y=\"314\" font-size=\"12\" style=\"fill:var(--acc)\">━ TCP Reno: cwnd = ssthresh = 6<\/text><text x=\"330\" y=\"314\" font-size=\"12\" style=\"fill:var(--bad)\">━ TCP Tahoe: cwnd = 1 MSS rồi khởi động chậm<\/text><text x=\"64\" y=\"30\" font-size=\"11.5\" class=\"muted\">khởi động chậm (×2)<\/text><text x=\"210\" y=\"30\" font-size=\"11.5\" class=\"muted\">tránh tắc nghẽn (+1 MSS/RTT)<\/text><\/svg><div class=\"cap\">Khởi động chậm, tránh tắc nghẽn, phản ứng khi mất gói (chuong 3 tr.97–103) — số liệu minh hoạ<\/div><\/div>\n<h3 id=\"c3-win\">Cửa sổ Go-Back-N và Selective Repeat (N = 4, mất pkt2)<\/h3><div class=\"tw\"><table><tr><th><\/th><th>Go-Back-N<\/th><th>Selective Repeat<\/th><\/tr><tr><td>Bên nhận gặp pkt3, pkt4, pkt5<\/td><td><b>huỷ<\/b> (không đệm), gửi lại ack1 mỗi lần<\/td><td><b>đệm<\/b>, gửi ack3, ack4, ack5<\/td><\/tr><tr><td>Bên gửi<\/td><td>hết giờ → gửi lại pkt2, 3, 4, 5<\/td><td>chỉ gửi lại pkt2 (timer riêng của pkt2)<\/td><\/tr><tr><td>Khi pkt2 tới<\/td><td>nhận pkt2…5 lần lượt, ack2…ack5<\/td><td>giao pkt2, 3, 4, 5 lên trên, gửi ack2<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.50, 54<\/p>","bang":"<h3 id=\"c3-demux\">Ghép kênh / phân kênh<\/h3><div class=\"tw\"><table><tr><th><\/th><th>UDP (không kết nối)<\/th><th>TCP (hướng kết nối)<\/th><\/tr><tr><td>Socket xác định bởi<\/td><td>(IP đích, cổng đích)<\/td><td>bộ 4: IP nguồn, cổng nguồn, IP đích, cổng đích<\/td><\/tr><tr><td>Hệ quả<\/td><td>datagram cùng cổng đích nhưng khác IP/cổng nguồn → <b>cùng một socket<\/b><\/td><td>server có nhiều socket đồng thời; web server mỗi kết nối client một socket (HTTP không bền: mỗi yêu cầu một socket)<\/td><\/tr><\/table><\/div><p>Bên gửi ghép kênh: gom dữ liệu từ nhiều socket, thêm header giao vận. Bên nhận phân kênh: dùng IP + số cổng trong header để đưa segment tới đúng socket.<\/p><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.8–14<\/p>\n<h3 id=\"c3-udp\">UDP<\/h3><ul><li>Header 4 trường × 16 bit = <b>8 byte<\/b>: source port, dest port, <b>length<\/b> (số byte của cả segment, gồm header), checksum.<\/li><li>Vì sao dùng: không thiết lập kết nối (đỡ trễ), không lưu trạng thái, header nhỏ, <b>không điều khiển tắc nghẽn<\/b> (gửi nhanh tuỳ ý). Dùng cho streaming multimedia, DNS, SNMP; muốn tin cậy thì thêm ở tầng ứng dụng.<\/li><li><b>Checksum<\/b>: coi segment là dãy số 16 bit, <b>cộng<\/b>, bit nhớ tràn ra ngoài thì <b>cộng vòng<\/b> vào bit thấp nhất (wraparound), rồi <b>đảo bit<\/b> (bù 1). Bên nhận tính lại: khác → có lỗi; bằng → không phát hiện lỗi (vẫn có thể có lỗi).<\/li><\/ul><pre data-lang=\"text\">  1110011001100110\n+ 1101010101010101\n= 1 1011101110111011   (tràn 1 bit)\nwraparound → 1011101110111100   (tổng)\nchecksum   → 0100010001000011   (đảo bit)<\/pre><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.16–19<\/p>\n<h3 id=\"c3-rdt\">Truyền tin cậy: rdt1.0 → 3.0<\/h3><div class=\"tw\"><table><tr><th>Phiên bản<\/th><th>Giả thiết kênh<\/th><th>Cơ chế thêm<\/th><\/tr><tr><td>rdt1.0<\/td><td>hoàn toàn tin cậy<\/td><td>gửi/nhận thẳng<\/td><\/tr><tr><td>rdt2.0<\/td><td>có lỗi bit<\/td><td>checksum + phản hồi <b>ACK/NAK<\/b>, gửi lại khi NAK (dừng và chờ)<\/td><\/tr><tr><td>rdt2.1<\/td><td>ACK/NAK cũng có thể hỏng<\/td><td><b>số thứ tự<\/b> 0/1 để bên nhận bỏ gói trùng<\/td><\/tr><tr><td>rdt2.2<\/td><td>như 2.1<\/td><td><b>bỏ NAK<\/b>: ACK kèm số thứ tự gói nhận tốt cuối; ACK trùng = NAK<\/td><\/tr><tr><td>rdt3.0<\/td><td>có lỗi <b>và mất gói<\/b><\/td><td><b>bộ định thời<\/b>: không có ACK trong thời gian “chấp nhận được” → gửi lại; gói trễ gây trùng thì số thứ tự xử lý<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.26–41<\/p>\n<h3 id=\"c3-util\">Hiệu suất dừng-và-chờ và pipeline<\/h3>\n<p style=\"text-align:center;font-size:17px\"><b>U<sub>sender<\/sub> = (L/R) / (RTT + L/R)<\/b> · pipeline N gói: <b>U = (N·L/R) / (RTT + L/R)<\/b><\/p><div class=\"note \">Ví dụ slide: 1 Gbps, trễ lan truyền 15 ms (RTT 30 ms), gói 8000 bit → L/R = 8 μs; U = 0,008/30,008 = <b>0,00027<\/b>. Pipeline 3 gói → 0,00081. Thông lượng chỉ 33 kB/s trên đường 1 Gbps!<\/div><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.42–45<\/p>\n<h3 id=\"c3-tcp\">TCP segment, SEQ/ACK, RTT<\/h3><ul><li>TCP: điểm-tới-điểm, dòng byte tin cậy đúng thứ tự (không có ranh giới thông điệp), pipeline, <b>song công<\/b>, MSS, hướng kết nối, điều khiển luồng.<\/li><li>Header: cổng nguồn/đích, <b>sequence number<\/b>, <b>acknowledgement number<\/b>, cờ U A P R S F, <b>receive window<\/b> (rwnd), checksum, options.<\/li><li><b>Số thứ tự<\/b> = số thứ tự trong dòng byte của <b>byte đầu tiên<\/b> trong segment. <b>ACK<\/b> = số thứ tự của <b>byte tiếp theo mong đợi<\/b>, ACK tích lũy.<\/li><li>Telnet: A gửi <code>Seq=42, ACK=79, data='C'<\/code> → B trả <code>Seq=79, ACK=43, data='C'<\/code> → A gửi <code>Seq=43, ACK=80<\/code>.<\/li><\/ul><pre data-lang=\"text\">EstimatedRTT    = (1 − α)·EstimatedRTT + α·SampleRTT          α = 0,125\nDevRTT          = (1 − β)·DevRTT + β·|SampleRTT − EstimatedRTT|   β = 0,25\nTimeoutInterval = EstimatedRTT + 4·DevRTT<\/pre><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.57–63<\/p>\n<h3 id=\"c3-rel\">Truyền tin cậy trong TCP<\/h3><ul><li>Một bộ định thời cho segment chưa được ACK lâu nhất; timeout → gửi lại segment đó, khởi động lại timer.<\/li><li>Tình huống: <b>mất ACK<\/b> (gửi lại Seq=92), <b>timeout sớm<\/b>, <b>ACK tích luỹ<\/b> (ACK=100 mất nhưng ACK=120 tới → không cần gửi lại).<\/li><li><b>Fast retransmit<\/b>: nhận <b>3 ACK trùng<\/b> cho cùng dữ liệu → gửi lại ngay segment chưa ACK có số thứ tự nhỏ nhất, không chờ timeout.<\/li><li>Bên nhận: segment đúng thứ tự, mọi thứ trước đã ACK → <b>ACK trễ<\/b>, chờ 500 ms; segment sai thứ tự (lớn hơn mong đợi) → gửi ngay <b>ACK trùng<\/b>.<\/li><\/ul><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.65–72<\/p>\n<h3 id=\"c3-flow\">Điều khiển luồng<\/h3><p>Bên nhận báo không gian đệm còn trống qua trường <b>rwnd<\/b>; bên gửi giới hạn dữ liệu chưa được ACK ≤ rwnd → không làm tràn bộ đệm bên nhận. RcvBuffer thường mặc định 4096 byte. Công thức (giáo trình): <b>rwnd = RcvBuffer − (LastByteRcvd − LastByteRead)<\/b>.<\/p><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.74–75<\/p>\n<h3 id=\"c3-cc\">Điều khiển tắc nghẽn TCP<\/h3><div class=\"tw\"><table><tr><th>Sự kiện / giai đoạn<\/th><th>Hành động<\/th><\/tr><tr><td>Bắt đầu (khởi động chậm)<\/td><td>cwnd = 1 MSS, <b>tăng gấp đôi mỗi RTT<\/b> (tăng mỗi ACK); ssthresh ban đầu 64 KB<\/td><\/tr><tr><td>cwnd ≥ ssthresh (tránh tắc nghẽn)<\/td><td>tăng <b>tuyến tính<\/b> +1 MSS mỗi RTT (AIMD: tăng cộng)<\/td><\/tr><tr><td>3 ACK trùng — <b>Reno<\/b><\/td><td>ssthresh = cwnd/2, <b>cwnd = ssthresh<\/b> (một nửa), rồi tăng tuyến tính (FSM ghi cwnd = ssthresh + 3 MSS, pha khôi phục nhanh)<\/td><\/tr><tr><td>Timeout (Reno &amp; Tahoe)<\/td><td>ssthresh = cwnd/2, <b>cwnd = 1 MSS<\/b>, khởi động chậm lại<\/td><\/tr><tr><td><b>Tahoe<\/b><\/td><td>luôn đặt cwnd = 1 MSS cho cả timeout lẫn 3 ACK trùng<\/td><\/tr><\/table><\/div><ul><li>Tốc độ ≈ cwnd / RTT byte/s; bên gửi giữ LastByteSent − LastByteAcked ≤ cwnd.<\/li><li>Thông lượng trung bình ≈ <b>(3/4)·W / RTT<\/b> (W = cửa sổ khi mất gói).<\/li><li>Công bằng: K kết nối chung nút cổ chai R → mỗi kết nối ~R/K. Đường R đang có 9 kết nối: app mới mở 1 kết nối được R/10, mở 11 kết nối được ~R/2.<\/li><li>Tắc nghẽn ≠ điều khiển luồng: quá nhiều nguồn gửi quá nhanh vào <b>mạng<\/b> → mất gói (tràn đệm router), trễ dài. TCP dùng cách tiếp cận <b>end-end<\/b> (suy ra từ mất gói/trễ); cách khác: mạng hỗ trợ (ECN, DECbit, ATM).<\/li><\/ul><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.85–108<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>Tầng giao vận vs tầng mạng<\/td><td>giữa các tiến trình vs giữa các host.<\/td><\/tr><tr><td>UDP vs TCP demux<\/td><td>UDP: (IP, cổng) đích; TCP: bộ 4 giá trị.<\/td><\/tr><tr><td>Go-Back-N vs Selective Repeat<\/td><td>GBN: ACK tích luỹ, bên nhận không đệm gói sai thứ tự, một timer, timeout gửi lại <b>mọi<\/b> gói chưa ACK. SR: ACK riêng từng gói, đệm gói sai thứ tự, timer cho mỗi gói, chỉ gửi lại gói đó; cửa sổ ≤ nửa không gian số thứ tự.<\/td><\/tr><tr><td>rdt2.0 vs 2.1 vs 2.2 vs 3.0<\/td><td>ACK/NAK · + số thứ tự · bỏ NAK · + timer cho kênh mất gói.<\/td><\/tr><tr><td>Điều khiển luồng vs tắc nghẽn<\/td><td>luồng: bảo vệ <b>bộ đệm bên nhận<\/b> (rwnd); tắc nghẽn: bảo vệ <b>mạng<\/b> (cwnd).<\/td><\/tr><tr><td>Khởi động chậm vs tránh tắc nghẽn<\/td><td>×2 mỗi RTT khi cwnd &lt; ssthresh vs +1 MSS mỗi RTT khi cwnd ≥ ssthresh.<\/td><\/tr><tr><td>Timeout vs 3 ACK trùng (Reno)<\/td><td>timeout: cwnd = 1 MSS (nặng hơn); 3 ACK trùng: cwnd giảm một nửa (mạng vẫn chuyển được segment).<\/td><\/tr><tr><td>Tahoe vs Reno<\/td><td>Tahoe: luôn về 1 MSS; Reno: 3 ACK trùng thì giảm một nửa.<\/td><\/tr><tr><td>ACK của GBN vs ACK của TCP<\/td><td>GBN: ACK(n) = đã nhận tới gói n. TCP: ACK = byte tiếp theo mong đợi.<\/td><\/tr><tr><td>Bắt tay 2 bước vs 3 bước<\/td><td>2 bước hỏng khi thông điệp bị trễ/gửi lại/đổi thứ tự → kết nối mở nửa, nhận trùng dữ liệu; 3 bước (SYN, SYNACK, ACK) cho hai bên biết nhau đang hoạt động.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 3 Tang giao van.pdf tr.5, 10–12, 36–38, 46, 51, 55, 74–80, 85, 100–102<\/p>","bay":"<div class=\"card\" id=\"c3-trap-csum\"><b>Bẫy 1 — checksum quên wraparound<\/b><div>Cộng hai từ 16 bit mà bỏ bit nhớ tràn là sai; phải cộng bit nhớ vào bit thấp nhất rồi mới đảo bit.<\/div><\/div><div class=\"card\" id=\"c3-trap-ack\"><b>Bẫy 2 — ACK của TCP là byte tiếp theo<\/b><div>Segment Seq=92 mang 8 byte → ACK = <b>100<\/b> (không phải 92 hay 99). Segment kế Seq=100 mang 20 byte → ACK = 120.<\/div><\/div><div class=\"card\" id=\"c3-trap-sr\"><b>Bẫy 3 — SR với cửa sổ quá lớn<\/b><div>Số thứ tự 0..3 (4 số), cửa sổ 3: bên nhận không phân biệt gói 0 mới với gói 0 gửi lại → nhận trùng như dữ liệu mới. Điều kiện: <b>cửa sổ ≤ ½ không gian số thứ tự<\/b> (ở đây ≤ 2).<\/div><\/div><div class=\"card\" id=\"c3-trap-reno\"><b>Bẫy 4 — Reno vs Tahoe khi 3 ACK trùng<\/b><div>cwnd = 12: Reno → ssthresh = 6, cwnd = 6 rồi tăng tuyến tính. Tahoe → ssthresh = 6, cwnd = 1 rồi khởi động chậm tới 6. <b>Đổi một chỗ:<\/b> thay 3 ACK trùng bằng timeout → cả hai đều về cwnd = 1.<\/div><\/div><div class=\"card\" id=\"c3-trap-ss\"><b>Bẫy 5 — khởi động chậm không “chậm”<\/b><div>Tên gọi “chậm” vì bắt đầu từ 1 MSS, nhưng tăng <b>theo cấp số nhân<\/b>: 1 → 2 → 4 → 8 sau 3 RTT.<\/div><\/div><div class=\"card\" id=\"c3-trap-util\"><b>Bẫy 6 — U với pipeline<\/b><div>Nhân N vào <b>tử số<\/b>, mẫu vẫn là RTT + L/R; U không vượt 1 (N đủ lớn thì kênh bận liên tục).<\/div><\/div><div class=\"card\" id=\"c3-trap-len\"><b>Bẫy 7 — UDP length<\/b><div>Trường length tính <b>cả header<\/b> (8 byte). Dữ liệu 100 byte → length = 108.<\/div><\/div>","checklist":["Dịch vụ tầng giao vận (truyền thông logic giữa các process) so với tầng mạng (giữa các host), ví dụ nhà Ann và nhà Bill","Ghép kênh và phân kênh: UDP xác định bằng (IP đích, port đích); TCP xác định bằng bộ 4 giá trị","UDP: header 8 byte, không kết nối, lý do vẫn dùng; cách tính checksum (cộng bù 1, wraparound)","Nguyên lý truyền tin cậy: rdt1.0 → 2.0 (ACK/NAK) → 2.1 (số thứ tự) → 2.2 (bỏ NAK) → 3.0 (timer, kênh có mất gói); hiệu suất stop-and-wait U = (L/R)/(RTT + L/R)","Pipelining: Go-Back-N (ACK tích lũy, một timer, gửi lại cả cửa sổ) và Selective Repeat (ACK từng gói, đệm phía nhận, kích thước cửa sổ ≤ nửa không gian số thứ tự)","TCP segment: các trường header, số thứ tự tính theo byte, ACK là byte kế tiếp mong đợi; ước lượng RTT: EstimatedRTT, DevRTT, TimeoutInterval","Truyền tin cậy trong TCP: các tình huống gửi lại, fast retransmit khi nhận 3 ACK trùng","Điều khiển luồng: rwnd = RcvBuffer − (LastByteRcvd − LastByteRead)","Quản lý kết nối: bắt tay 3 bước (SYN, SYN-ACK, ACK), đóng kết nối (FIN, ACK, TIME_WAIT)","Nguyên lý điều khiển tắc nghẽn (nguyên nhân, chi phí); TCP: AIMD, slow start (cwnd tăng gấp đôi mỗi RTT), ssthresh, congestion avoidance, khi timeout (cwnd = 1 MSS) và khi 3 ACK trùng (Reno: cwnd giảm một nửa); TCP Tahoe và Reno; thông lượng TCP và tính công bằng","＋ Bảng sinh ACK của bên nhận TCP (ACK trễ 500 ms, ACK trùng khi có khoảng trống)","＋ Thông lượng TB = 3/4·W/RTT; công bằng R/K và mẹo mở nhiều kết nối song song","＋ Điều khiển tắc nghẽn end-end vs có hỗ trợ từ mạng (ECN)"],"quick":[{"de":"Segment TCP có Seq = 200 mang 50 byte, nhận đúng. ACK bên nhận gửi về là?","dap_an":["200","249","250","251"],"dung":[2],"giai_thich":"ACK = byte tiếp theo mong đợi = 200 + 50.","code":null,"lang":null},{"de":"Go-Back-N, timeout xảy ra. Bên gửi gửi lại gì?","dap_an":["Chỉ gói hết giờ","Gói hết giờ và mọi gói có số thứ tự lớn hơn trong cửa sổ","Không gửi gì","Gói cuối cùng"],"dung":[1],"giai_thich":"timeout(n): gửi lại n và mọi gói sau trong cửa sổ.","code":null,"lang":null},{"de":"TCP Reno, cwnd = 16 MSS, nhận 3 ACK trùng. cwnd mới?","dap_an":["1 MSS","8 MSS","16 MSS","17 MSS"],"dung":[1],"giai_thich":"ssthresh = cwnd/2 = 8, cwnd = ssthresh.","code":null,"lang":null}],"docthem":"<ul><li>Công thức Mathis (tr.105): thông lượng ≈ 1,22·MSS / (RTT·√L) — để đạt 10 Gbps với segment 1500 byte, RTT 100 ms cần tỷ lệ mất 2·10<sup>-10<\/sup>.<\/li><li>Pha khôi phục nhanh (fast recovery) của Reno trong FSM tr.103: cwnd = ssthresh + 3 MSS, mỗi ACK trùng thêm +1 MSS, ACK mới thì cwnd = ssthresh.<\/li><li>Giáo trình §3.5.6: giá trị khởi tạo TimeoutInterval là 1 s, và nhân đôi khi timeout.<\/li><\/ul>"}},{"id":"C4","mon":"MMT","title":"Tầng mạng","src":"chuong 4 v1.pdf","page":{"y":"<p>Tầng mạng đưa <b>datagram<\/b> từ host nguồn tới host đích qua nhiều router. Hai chức năng: <b>chuyển tiếp<\/b> (forwarding, cục bộ trong từng router — <b>mặt phẳng dữ liệu<\/b>) và <b>định tuyến<\/b> (routing, chọn đường toàn mạng — <b>mặt phẳng điều khiển<\/b>). Internet dùng giao thức <b>IP<\/b> (định dạng datagram, địa chỉ), <b>ICMP<\/b> (báo lỗi) và các giao thức định tuyến <b>RIP, OSPF<\/b> (trong AS) và <b>BGP<\/b> (giữa các AS).<\/p>\n<p>Ví dụ chuyến đi: định tuyến = lập kế hoạch đường đi từ nguồn đến đích; chuyển tiếp = đi qua một giao điểm.<\/p><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.4–6, 19<\/p>","mohinh":"<h3 id=\"c4-planes\">Hai mặt phẳng<\/h3><div class=\"tw\"><table><tr><th><\/th><th>Mặt phẳng dữ liệu<\/th><th>Mặt phẳng điều khiển<\/th><\/tr><tr><td>Phạm vi<\/td><td>cục bộ, trong từng router<\/td><td>logic toàn mạng<\/td><\/tr><tr><td>Việc<\/td><td>datagram đến cổng vào → cổng ra nào (theo bảng chuyển tiếp)<\/td><td>datagram đi qua những router nào từ nguồn tới đích<\/td><\/tr><tr><td>Thực hiện<\/td><td>phần cứng, cỡ <b>nano giây<\/b><\/td><td>phần mềm (bộ xử lý định tuyến), cỡ <b>mili giây<\/b><\/td><\/tr><tr><td>Cách tổ chức<\/td><td>—<\/td><td>truyền thống: thuật toán chạy <b>trên mỗi router<\/b> · <b>SDN<\/b>: bộ điều khiển từ xa (trên server) tính và cài bảng chuyển tiếp<\/td><\/tr><\/table><\/div><div class=\"flow\"><span class=\"s\">Cổng vào: vật lý → liên kết → tra bảng chuyển tiếp, xếp hàng<\/span><span class=\"ar\">→<\/span><span class=\"s a\">Switching fabric (memory / bus / crossbar)<\/span><span class=\"ar\">→<\/span><span class=\"s\">Cổng ra: xếp hàng (đệm), lập lịch → liên kết → vật lý<\/span><\/div>\n<h3 id=\"c4-graph\">Đồ thị định tuyến và Dijkstra<\/h3><div class=\"diagram\"><svg viewBox=\"0 0 600 260\" width=\"600\" role=\"img\" aria-label=\"Đồ thị ví dụ Dijkstra\"><line x1=\"50\" y1=\"130\" x2=\"210\" y2=\"40\" class=\"ln\"/><rect x=\"121\" y=\"76\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"130\" y=\"89\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"400\">7<\/text><line x1=\"50\" y1=\"130\" x2=\"210\" y2=\"130\" class=\"lna\"/><rect x=\"121\" y=\"121\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"130\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">3<\/text><line x1=\"50\" y1=\"130\" x2=\"210\" y2=\"222\" class=\"lna\"/><rect x=\"121\" y=\"167\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"130\" y=\"180\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">5<\/text><line x1=\"210\" y1=\"130\" x2=\"210\" y2=\"40\" class=\"lna\"/><rect x=\"201\" y=\"76\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"210\" y=\"89\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">3<\/text><line x1=\"210\" y1=\"130\" x2=\"210\" y2=\"222\" class=\"ln\"/><rect x=\"201\" y=\"167\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"210\" y=\"180\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"400\">4<\/text><line x1=\"210\" y1=\"130\" x2=\"390\" y2=\"80\" class=\"ln\"/><rect x=\"291\" y=\"96\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"300\" y=\"109\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"400\">8<\/text><line x1=\"210\" y1=\"40\" x2=\"390\" y2=\"80\" class=\"lna\"/><rect x=\"291\" y=\"51\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"300\" y=\"64\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">4<\/text><line x1=\"210\" y1=\"222\" x2=\"390\" y2=\"80\" class=\"ln\"/><rect x=\"291\" y=\"142\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"300\" y=\"155\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"400\">7<\/text><line x1=\"210\" y1=\"222\" x2=\"540\" y2=\"160\" class=\"ln\"/><rect x=\"366\" y=\"182\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"375\" y=\"195\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"400\">9<\/text><line x1=\"390\" y1=\"80\" x2=\"540\" y2=\"160\" class=\"lna\"/><rect x=\"456\" y=\"111\" width=\"18\" height=\"16\" rx=\"3\" style=\"fill:var(--bg)\"/><text x=\"465\" y=\"124\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">2<\/text><circle cx=\"50\" cy=\"130\" r=\"15\" class=\"nodea\"/><text x=\"50\" y=\"134\" text-anchor=\"middle\" class=\"mono\" font-size=\"13\" style=\"fill:#fff\">u<\/text><circle cx=\"210\" cy=\"40\" r=\"15\" class=\"node\"/><text x=\"210\" y=\"44\" text-anchor=\"middle\" class=\"mono\" font-size=\"13\" >v<\/text><circle cx=\"210\" cy=\"130\" r=\"15\" class=\"node\"/><text x=\"210\" y=\"134\" text-anchor=\"middle\" class=\"mono\" font-size=\"13\" >w<\/text><circle cx=\"210\" cy=\"222\" r=\"15\" class=\"node\"/><text x=\"210\" y=\"226\" text-anchor=\"middle\" class=\"mono\" font-size=\"13\" >x<\/text><circle cx=\"390\" cy=\"80\" r=\"15\" class=\"node\"/><text x=\"390\" y=\"84\" text-anchor=\"middle\" class=\"mono\" font-size=\"13\" >y<\/text><circle cx=\"540\" cy=\"160\" r=\"15\" class=\"node\"/><text x=\"540\" y=\"164\" text-anchor=\"middle\" class=\"mono\" font-size=\"13\" >z<\/text><text x=\"300\" y=\"252\" font-size=\"12\" class=\"muted\" text-anchor=\"middle\">Nét đậm = cây đường đi ngắn nhất từ u (kết quả bảng Dijkstra tr.51)<\/text><\/svg><div class=\"cap\">Ví dụ Dijkstra từ nút u (chuong 4 tr.51)<\/div><\/div><div class=\"tw\"><table><tr><th>Bước<\/th><th>N'<\/th><th>D(v),p(v)<\/th><th>D(w),p(w)<\/th><th>D(x),p(x)<\/th><th>D(y),p(y)<\/th><th>D(z),p(z)<\/th><\/tr><tr><td>0<\/td><td>u<\/td><td>7,u<\/td><td><b>3,u<\/b><\/td><td>5,u<\/td><td>∞<\/td><td>∞<\/td><\/tr><tr><td>1<\/td><td>uw<\/td><td>6,w<\/td><td><\/td><td><b>5,u<\/b><\/td><td>11,w<\/td><td>∞<\/td><\/tr><tr><td>2<\/td><td>uwx<\/td><td><b>6,w<\/b><\/td><td><\/td><td><\/td><td>11,w<\/td><td>14,x<\/td><\/tr><tr><td>3<\/td><td>uwxv<\/td><td><\/td><td><\/td><td><\/td><td><b>10,v<\/b><\/td><td>14,x<\/td><\/tr><tr><td>4<\/td><td>uwxvy<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><b>12,y<\/b><\/td><\/tr><tr><td>5<\/td><td>uwxvyz<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Đường ngắn nhất u→z: lần ngược nút trước z ← y ← v ← w ← u, tức <b>u–w–v–y–z, chi phí 12<\/b>. Bảng chuyển tiếp của u: tới v, y, z đi qua <b>w<\/b>; tới x đi thẳng.<\/p><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.45–51<\/p>","bang":"<h3 id=\"c4-router\">Kiến trúc router<\/h3><div class=\"tw\"><table><tr><th>Thành phần<\/th><th>Đặc điểm<\/th><\/tr><tr><td>Cổng vào<\/td><td>chuyển mạch <b>không tập trung<\/b>: biết đích → tìm cổng ra bằng bảng chuyển tiếp lưu ở cổng vào, xử lý theo “tốc độ dòng”; <b>xếp hàng<\/b> nếu datagram đến nhanh hơn tốc độ fabric<\/td><\/tr><tr><td>Fabric: memory<\/td><td>thế hệ đầu, CPU điều khiển, gói sao chép vào bộ nhớ hệ thống; giới hạn bởi băng thông bộ nhớ<\/td><\/tr><tr><td>Fabric: bus<\/td><td>bus chung từ bộ nhớ cổng vào tới cổng ra; tranh chấp bus, giới hạn bởi băng thông bus (Cisco 5600: 32 Gbps)<\/td><\/tr><tr><td>Fabric: crossbar / mạng kết nối<\/td><td>chuyển mạch đa tầng n×n từ các chuyển mạch nhỏ; có thể cắt datagram thành cell cố định (Cisco 12000: 60 Gbps)<\/td><\/tr><tr><td>Tốc độ fabric<\/td><td>N đầu vào → nên bằng N lần tốc độ dòng<\/td><\/tr><tr><td>Cổng ra<\/td><td>đệm khi datagram từ fabric tới nhanh hơn tốc độ truyền; bộ lập lịch chọn datagram để gửi<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.11–17<\/p>\n<h3 id=\"c4-ip\">IPv4 datagram<\/h3><div class=\"tw\"><table><tr><th>Trường<\/th><th>Ý nghĩa<\/th><\/tr><tr><td>ver · head len · type of service · length<\/td><td>phiên bản · độ dài header (byte) · loại dịch vụ · tổng chiều dài datagram (byte)<\/td><\/tr><tr><td>16-bit identifier · flgs · fragment offset<\/td><td>dùng cho phân mảnh/tập hợp lại<\/td><\/tr><tr><td>time to live (TTL)<\/td><td>số hop tối đa còn lại, <b>giảm 1 tại mỗi router<\/b><\/td><\/tr><tr><td>upper layer<\/td><td>giao thức tầng trên (TCP hoặc UDP)<\/td><\/tr><tr><td>header checksum<\/td><td>kiểm tra lỗi header<\/td><\/tr><tr><td>source / destination IP<\/td><td>32 bit mỗi địa chỉ<\/td><\/tr><tr><td>options<\/td><td>timestamp, ghi đường đi…<\/td><\/tr><\/table><\/div><p>Overhead: 20 byte TCP + 20 byte IP = <b>40 byte<\/b> + header tầng ứng dụng.<\/p><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.20<\/p>\n<h3 id=\"c4-addr\">Địa chỉ IPv4, subnet, CIDR<\/h3><ul><li>Địa chỉ IP: <b>32 bit<\/b> định danh một <b>giao diện<\/b> (interface) của host/router. Router có nhiều giao diện; host thường 1–2 (Ethernet, 802.11). Ví dụ 223.1.1.1 = 11011111 00000001 00000001 00000001.<\/li><li><b>Subnet<\/b>: các giao diện có cùng phần subnet (bit cao) của địa chỉ, tới được nhau <b>không qua router<\/b>. Cách xác định: tách mỗi giao diện khỏi host/router, mỗi “đảo” còn lại là một subnet. Mặt nạ /24.<\/li><li>Phân lớp A, B, C, D, E cứng nhắc → <b>lãng phí<\/b> không gian địa chỉ. <b>CIDR<\/b>: a.b.c.d/x, x = số bit phần subnet, độ dài tuỳ ý (vd 200.23.16.0/23).<\/li><li>ISP lấy khối địa chỉ từ <b>ICANN<\/b> (phân bổ địa chỉ, quản lý DNS, gán tên miền).<\/li><\/ul><div class=\"tw\"><table><tr><th>Với a.b.c.d/x<\/th><th>Cách tính (bài tính)<\/th><\/tr><tr><td>Số địa chỉ trong khối<\/td><td>2<sup>32−x<\/sup><\/td><\/tr><tr><td>Số host dùng được<\/td><td>2<sup>32−x<\/sup> − 2 (trừ địa chỉ mạng và broadcast)<\/td><\/tr><tr><td>Địa chỉ mạng<\/td><td>giữ x bit đầu, các bit host = 0<\/td><\/tr><tr><td>Địa chỉ broadcast<\/td><td>giữ x bit đầu, các bit host = 1<\/td><\/tr><tr><td>Ví dụ 192.168.10.77/26<\/td><td>khối 64 địa chỉ → mạng 192.168.10.64, broadcast 192.168.10.127, 62 host<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.21–27, 29; cách tính theo bảng bài tính của kế hoạch<\/p>\n<h3 id=\"c4-nat\">DHCP, NAT, ICMP<\/h3><ul><li><b>DHCP<\/b>: host mới (DHCP client) cần địa chỉ trong mạng thì xin từ DHCP server (thường nằm ở router). 4 thông điệp theo giáo trình: DISCOVER → OFFER → REQUEST → ACK (slide chỉ có sơ đồ kịch bản).<\/li><li><b>NAT<\/b>: mạng nhà 10.0.0/24 dùng địa chỉ riêng; <b>mọi datagram đi ra<\/b> có cùng địa chỉ nguồn NAT 138.76.29.7 với <b>số cổng nguồn khác nhau<\/b>; trong mạng cục bộ datagram dùng địa chỉ 10.0.0.x.<\/li><li><b>ICMP<\/b>: báo lỗi và yêu cầu/đáp ứng, mang trong IP datagram, gồm type, code + 8 byte đầu datagram gây lỗi. 0/0 echo reply · 8/0 echo request (ping) · 3/0..3 network/host/protocol/<b>port unreachable<\/b> · <b>11/0 TTL expired<\/b> · 12/0 bad IP header.<\/li><li><b>Traceroute<\/b>: gửi UDP segment TTL = 1, 2, …; router thứ n bỏ datagram và gửi ICMP <b>type 11 code 0<\/b> (kèm tên, IP router); tới đích thì đích trả ICMP <b>port unreachable (3/3)<\/b> → dừng.<\/li><\/ul><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.28, 30–32<\/p>\n<h3 id=\"c4-v6\">IPv6<\/h3><ul><li>Lý do: hết không gian 32 bit; header cố định giúp xử lý nhanh, hỗ trợ QoS.<\/li><li>Header <b>cố định 40 byte<\/b>, địa chỉ <b>128 bit<\/b>, trường priority, <b>flow label<\/b>, next header, hop limit.<\/li><li><b>Không phân mảnh<\/b> tại router, <b>bỏ checksum<\/b>, options nằm ngoài header (qua Next Header), ICMPv6 (vd “Packet Too Big”).<\/li><li><b>Tunneling<\/b>: không thể nâng cấp mọi router cùng lúc → IPv6 datagram được mang làm <b>payload<\/b> trong IPv4 datagram giữa các router IPv4 (B→C, D→E).<\/li><\/ul><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.33–38<\/p>\n<h3 id=\"c4-algo\">Thuật toán định tuyến<\/h3><div class=\"tw\"><table><tr><th><\/th><th>Link state (Dijkstra)<\/th><th>Distance vector (Bellman-Ford)<\/th><\/tr><tr><td>Thông tin<\/td><td><b>tập trung<\/b>: mọi router biết toàn bộ cấu trúc và chi phí (quảng bá trạng thái liên kết)<\/td><td><b>không tập trung<\/b>: chỉ biết hàng xóm và chi phí tới hàng xóm; lặp, trao đổi với hàng xóm<\/td><\/tr><tr><td>Công thức<\/td><td>D(v) = min(D(v), D(w) + c(w,v)); sau k vòng biết chi phí thấp nhất tới k đích<\/td><td>d<sub>x<\/sub>(y) = min<sub>v<\/sub>{ c(x,v) + d<sub>v<\/sub>(y) }; v đạt min là hop kế tiếp<\/td><\/tr><tr><td>Giao thức<\/td><td>OSPF, IS-IS<\/td><td>RIP<\/td><\/tr><\/table><\/div><div class=\"note \">Ví dụ Bellman-Ford tr.54: c(u,v)=2, c(u,x)=1, c(u,w)=5; d<sub>v<\/sub>(z)=5, d<sub>x<\/sub>(z)=3, d<sub>w<\/sub>(z)=3 → d<sub>u<\/sub>(z) = min{2+5, 1+3, 5+3} = <b>4<\/b>, hop kế tiếp là x.<\/div><p>Phân loại khác: <b>tĩnh<\/b> (đổi chậm) vs <b>động<\/b> (cập nhật định kỳ, phản ứng thay đổi chi phí).<\/p><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.47–54<\/p>\n<h3 id=\"c4-inet\">Định tuyến trên Internet<\/h3><div class=\"tw\"><table><tr><th>Giao thức<\/th><th>Đặc điểm<\/th><\/tr><tr><td>Phân cấp (AS)<\/td><td>router gom thành <b>hệ thống tự trị (AS)<\/b>; trong AS chạy cùng giao thức intra-AS (IGP); <b>gateway router<\/b> ở cạnh AS nối sang AS khác. Bảng chuyển tiếp do cả intra- và inter-AS cấu hình<\/td><\/tr><tr><td>RIP<\/td><td>distance vector; độ đo = <b>số hop<\/b> (mỗi liên kết = 1, <b>tối đa 15<\/b>); trao đổi DV mỗi <b>30 s<\/b> (advertisement, tối đa 25 subnet); 180 s không nghe → lân cận chết; <b>poison reverse<\/b> (vô hạn = 16) chống vòng lặp ping-pong<\/td><\/tr><tr><td>OSPF<\/td><td>link state + Dijkstra; quảng bá (flooding) toàn AS; mang <b>trực tiếp trên IP<\/b>; cải tiến so với RIP: xác thực, nhiều đường cùng chi phí, nhiều độ đo theo TOS, multicast (MOSPF), <b>phân cấp 2 mức<\/b>: vùng cục bộ + vùng xương sống (router biên vùng, router xương sống, router biên AS)<\/td><\/tr><tr><td>BGP<\/td><td>định tuyến liên miền (inter-AS) thực tế; <b>eBGP<\/b> lấy thông tin tới subnet từ AS lân cận, <b>iBGP<\/b> lan truyền trong AS; giao thức <b>path vector<\/b>, qua <b>kết nối TCP<\/b> bán bền vững; thuộc tính <b>AS-PATH<\/b>, <b>NEXT-HOP<\/b>; import policy; chọn tuyến: ① local preference ② AS-PATH ngắn nhất ③ NEXT-HOP gần nhất (hot potato) ④ tiêu chí khác; thông điệp OPEN, UPDATE, KEEPALIVE, NOTIFICATION<\/td><\/tr><tr><td>Vì sao intra ≠ inter<\/td><td>chính sách (inter: kiểm soát ai đi qua mạng mình) · quy mô (phân cấp giảm bảng và lưu lượng cập nhật) · hiệu năng (intra tập trung hiệu năng, inter chính sách quan trọng hơn)<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.56–74<\/p>","sosanh":"<div class=\"tw\"><table><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><tr><td>Forwarding vs routing<\/td><td>cục bộ, mặt phẳng dữ liệu, ns vs toàn mạng, mặt phẳng điều khiển, ms.<\/td><\/tr><tr><td>Điều khiển trên mỗi router vs SDN<\/td><td>thuật toán định tuyến chạy trong từng router vs bộ điều khiển từ xa tính và cài bảng chuyển tiếp.<\/td><\/tr><tr><td>Best effort vs ATM CBR<\/td><td>Internet không đảm bảo băng thông, mất mát, thứ tự, thời gian; ATM CBR đảm bảo tốc độ ổn định, không mất, đúng thứ tự, thời gian.<\/td><\/tr><tr><td>Memory vs bus vs crossbar<\/td><td>giới hạn bởi băng thông bộ nhớ (CPU sao chép) · tranh chấp bus · mạng kết nối song song, nhanh nhất.<\/td><\/tr><tr><td>Link state vs distance vector<\/td><td>toàn cục + Dijkstra vs hàng xóm + Bellman-Ford lặp.<\/td><\/tr><tr><td>RIP vs OSPF<\/td><td>DV, số hop ≤ 15, 30 s, một tuyến vs LS, Dijkstra, flooding, xác thực, nhiều tuyến cùng chi phí, phân vùng.<\/td><\/tr><tr><td>Intra-AS vs inter-AS<\/td><td>IGP (RIP, OSPF, IGRP) trong AS, tập trung hiệu năng vs BGP giữa các AS, theo chính sách.<\/td><\/tr><tr><td>eBGP vs iBGP<\/td><td>giữa router của hai AS khác nhau vs lan truyền trong cùng AS.<\/td><\/tr><tr><td>IPv4 vs IPv6<\/td><td>32 vs 128 bit; header biến đổi (≥ 20 byte) vs cố định 40 byte; có vs không phân mảnh tại router; có vs không checksum.<\/td><\/tr><tr><td>Địa chỉ riêng vs địa chỉ NAT<\/td><td>10.0.0.x dùng trong mạng nhà; ra ngoài thay bằng một IP công khai + cổng khác nhau.<\/td><\/tr><\/table><\/div><p class=\"src\">Nguồn: chuong 4 v1.pdf tr.4–9, 13–16, 33–35, 47, 61–74<\/p>","bay":"<div class=\"card\" id=\"c4-trap-host\"><b>Bẫy 1 — số host<\/b><div>/24 có 256 địa chỉ nhưng <b>254<\/b> host (trừ mạng và broadcast). /23 (200.23.16.0/23) → 512 địa chỉ, 510 host. /30 → 2 host.<\/div><\/div><div class=\"card\" id=\"c4-trap-subnet\"><b>Bẫy 2 — đếm subnet<\/b><div>Ba router nối nhau từng cặp (3 liên kết điểm-điểm) và mỗi router nối một LAN → <b>6 subnet<\/b> (mỗi liên kết giữa hai router cũng là một subnet).<\/div><\/div><div class=\"card\" id=\"c4-trap-dij\"><b>Bẫy 3 — Dijkstra cập nhật sai<\/b><div>Chỉ cập nhật D(v) cho nút <b>kề với w vừa thêm<\/b> và <b>chưa thuộc N'<\/b>; chọn nút có D nhỏ nhất <b>ngoài N'<\/b>. Hoà nhau thì chọn tuỳ ý.<\/div><\/div><div class=\"card\" id=\"c4-trap-icmp\"><b>Bẫy 4 — traceroute dừng khi nào<\/b><div>Router trung gian trả ICMP <b>11/0 (TTL expired)<\/b>; host đích trả <b>3/3 (port unreachable)<\/b> vì UDP gửi tới cổng không có → nguồn dừng.<\/div><\/div><div class=\"card\" id=\"c4-trap-rip\"><b>Bẫy 5 — RIP vô hạn = 16<\/b><div>Đường tối đa 15 hop; 16 nghĩa là không tới được (dùng trong poison reverse).<\/div><\/div><div class=\"card\" id=\"c4-trap-ospf\"><b>Bẫy 6 — OSPF không chạy trên TCP/UDP<\/b><div>Thông điệp OSPF mang <b>trực tiếp trên IP<\/b>; BGP thì chạy trên <b>TCP<\/b>.<\/div><\/div><div class=\"card\" id=\"c4-trap-v6\"><b>Bẫy 7 — IPv6 không phân mảnh, không checksum<\/b><div>Router IPv6 không phân mảnh (gói quá lớn → ICMPv6 “Packet Too Big”); checksum bị bỏ để giảm xử lý tại mỗi hop.<\/div><\/div>","checklist":["Forwarding (cục bộ, data plane) và routing (toàn mạng, control plane); control plane truyền thống so với SDN","Các mô hình dịch vụ tầng mạng (best effort, ATM CBR/ABR…)","Kiến trúc router: cổng vào, switching fabric (bộ nhớ, bus, mạng kết nối), cổng ra, hàng đợi, HOL blocking; longest prefix match — <i>slide v1 không nêu HOL blocking và longest prefix match (xem Đọc thêm)<\/i>","IPv4 datagram: TTL, protocol, checksum, phân mảnh (ID, flag, offset tính theo đơn vị 8 byte) — <i>slide chỉ nêu các trường; cách tính offset có trong Bài tính MMT<\/i>","Địa chỉ IPv4: subnet, CIDR a.b.c.d/x, tính địa chỉ mạng, broadcast, số host; chia subnet; DHCP (DISCOVER, OFFER, REQUEST, ACK); NAT; tổng quan IPv6 và tunneling","Thuật toán định tuyến: link state (Dijkstra, chạy tay được bảng) và distance vector (Bellman-Ford, count-to-infinity, poisoned reverse); định tuyến phân cấp, AS","Định tuyến trên Internet: RIP (DV, số hop, tối đa 15), OSPF (LS, phân vùng area), BGP (giữa các AS, eBGP/iBGP, chính sách)","＋ ICMP type/code và traceroute (11/0, 3/3)","＋ BGP: AS-PATH, NEXT-HOP, thứ tự chọn tuyến (local pref → AS-PATH ngắn → hot potato), 4 loại thông điệp","＋ Vì sao intra-AS và inter-AS khác nhau (chính sách, quy mô, hiệu năng)"],"quick":[{"de":"Khối 10.1.4.0/22 có bao nhiêu host dùng được?","dap_an":["1024","1022","512","254"],"dung":[1],"giai_thich":"2<sup>10<\/sup> − 2 = 1022.","code":null,"lang":null},{"de":"RIP dùng độ đo gì?","dap_an":["Băng thông","Số hop (tối đa 15)","Độ trễ","Chính sách"],"dung":[1],"giai_thich":"RIP: distance vector, đếm hop.","code":null,"lang":null},{"de":"Giao thức định tuyến nào chạy giữa các AS?","dap_an":["RIP","OSPF","BGP","ICMP"],"dung":[2],"giai_thich":"BGP là giao thức inter-AS.","code":null,"lang":null}],"docthem":"<ul><li><b>Longest prefix match<\/b> (Kurose &amp; Ross §4.2.1): khi nhiều mục trong bảng chuyển tiếp khớp địa chỉ đích, chọn mục có tiền tố <b>dài nhất<\/b>.<\/li><li><b>HOL blocking<\/b> (§4.2.4): datagram đầu hàng đợi cổng vào bị chặn (chờ cổng ra bận) làm các datagram phía sau dù đi cổng ra khác cũng phải chờ.<\/li><li><b>Phân mảnh IPv4<\/b> (§4.3.2): datagram lớn hơn MTU được cắt; các mảnh cùng ID, cờ = 1 trừ mảnh cuối, offset tính theo đơn vị <b>8 byte<\/b>. Ví dụ 4000 byte (20 header) qua MTU 1500 → 3 mảnh dữ liệu 1480, 1480, 1020; offset 0, 185, 370. Luyện ở Bài tính MMT.<\/li><li><b>Count-to-infinity<\/b> (§5.2.2): khi chi phí liên kết tăng, DV có thể hội tụ rất chậm (tin xấu lan chậm); poisoned reverse chỉ chữa được vòng lặp 2 nút.<\/li><\/ul>"}}],"questions":[{"id":"K1-01","mon":"TTNT","khoi":"K1","loai":"single","de":"In a clean repository on <code>master<\/code>, you run the commands below. How does <code>git status<\/code> report README?","code":"echo 'My Project' > README\ngit status","lang":"bash","dap_an":["Under \"Changes to be committed: new file\"","Under \"Untracked files\"","Under \"Changes not staged for commit: modified\"","It does not appear because it is ignored by default"],"dung":[1],"giai_thich":"File mới chưa từng <code>git add<\/code> là untracked. Sau <code>git add README<\/code> nó mới vào “Changes to be committed”.","nguon":"week01.pdf tr.47–49","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-02","mon":"TTNT","khoi":"K1","loai":"multi","de":"Which statements about <code>git commit -a -m \"Update notes.txt\"<\/code> are correct?","code":null,"lang":null,"dap_an":["It automatically stages every tracked file that has been modified.","A brand-new untracked file is not included in the commit.","It also adds every new file in the working directory.","It uploads the commit to origin."],"dung":[0,1],"giai_thich":"commit -a bỏ qua bước git add <b>chỉ cho file đã track<\/b>. Commit luôn là thao tác local; push mới đưa lên remote.","nguon":"week01.pdf tr.56; ex1.docx Part B.6","muc":"k1-trap-a","demo":null,"hoi":null},{"id":"K1-03","mon":"TTNT","khoi":"K1","loai":"multi","de":"Given this short status output, which statements are correct?","code":" M README\nMM Rakefile\nA  lib/git.rb\nM  lib/simplegit.rb\n?? LICENSE.txt","lang":"text","dap_an":["README is modified in the working tree but not staged.","Rakefile has both staged and unstaged changes.","LICENSE.txt is untracked.","lib/simplegit.rb is modified but not yet staged."],"dung":[0,1,2],"giai_thich":"Cột trái = staging, cột phải = working tree. <code>M␣<\/code> ở lib/simplegit.rb nghĩa là đã sửa <b>và đã stage<\/b>.","nguon":"week01.pdf tr.51; Pro Git tr.37–38","muc":"k1-short","demo":null,"hoi":null},{"id":"K1-04","mon":"TTNT","khoi":"K1","loai":"single","de":"You edit <code>notes.txt<\/code> (already tracked) and then run the commands below. What does the last command print?","code":"git add notes.txt\ngit diff","lang":"bash","dap_an":["The changes to notes.txt","Nothing, because all changes are staged; use <code>git diff --staged<\/code> to see them","The full history of notes.txt","An error, because notes.txt is staged"],"dung":[1],"giai_thich":"<code>git diff<\/code> so working tree với staging area → không còn gì khác biệt. <code>git diff --staged<\/code> mới so staging với commit cuối.","nguon":"week01.pdf tr.53; Pro Git tr.40","muc":"k1-trap-diff","demo":null,"hoi":null},{"id":"K1-05","mon":"TTNT","khoi":"K1","loai":"multi","de":"With this <code>.gitignore<\/code> at the repository root, which files are ignored?","code":"*.a\n!lib.a\n/TODO\nbuild/\ndoc/*.txt","lang":"bash","dap_an":["<code>src/foo.a<\/code>","<code>lib.a<\/code>","<code>subdir/TODO<\/code>","<code>doc/notes.txt<\/code>"],"dung":[0,3],"giai_thich":"<code>*.a<\/code> áp dụng đệ quy nên src/foo.a bị bỏ qua; <code>!lib.a<\/code> phủ định nên lib.a vẫn track; <code>/TODO<\/code> chỉ áp dụng ở gốc; <code>doc/*.txt<\/code> khớp doc/notes.txt.","nguon":"week01.pdf tr.52; Pro Git tr.38–39","muc":"k1-trap-glob","demo":null,"hoi":null},{"id":"K1-06","mon":"TTNT","khoi":"K1","loai":"single","de":"You accidentally committed <code>config.env<\/code>. You run the command below and commit. What happens to the file?","code":"git rm --cached config.env","lang":"bash","dap_an":["Git stops tracking it, but the file stays on your disk.","It is deleted from the disk and from Git.","It is moved into .gitignore automatically.","Nothing; --cached only affects the remote."],"dung":[0],"giai_thich":"<code>git rm --cached<\/code> chỉ gỡ khỏi staging/tracking, giữ file local. Nên thêm nó vào .gitignore để không bị add lại.","nguon":"week01.pdf tr.57; Pro Git tr.44–45","muc":"k1-trap-ignore","demo":null,"hoi":null},{"id":"K1-07","mon":"TTNT","khoi":"K1","loai":"single","de":"<code>git mv draft.md README2.md<\/code> is a shortcut for which sequence?","code":null,"lang":null,"dap_an":["<code>mv draft.md README2.md; git rm draft.md; git add README2.md<\/code>","<code>cp draft.md README2.md; git add draft.md<\/code>","<code>git rm --cached draft.md<\/code>","<code>git commit -a<\/code>"],"dung":[0],"giai_thich":"Slide: git mv = đổi tên + git rm tên cũ + git add tên mới; Git nhận diện rename bằng độ tương đồng.","nguon":"week01.pdf tr.58","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-08","mon":"TTNT","khoi":"K1","loai":"multi","de":"A teammate edited README.md directly on GitHub. Which statements are correct?","code":null,"lang":null,"dap_an":["<code>git fetch origin<\/code> downloads the new commit and moves origin/main, without merging it.","<code>git pull<\/code> fetches and then merges it into your current branch.","<code>git fetch<\/code> immediately changes README.md in your working directory.","<code>git push<\/code> succeeds even though the remote has a commit you don't have."],"dung":[0,1],"giai_thich":"fetch chỉ tải và cập nhật remote-tracking branch; pull = fetch + merge. Push thất bại nếu remote có commit bạn chưa có.","nguon":"week01.pdf tr.69–70; week02.pdf tr.42–44; ex1.docx Part C","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-09","mon":"TTNT","khoi":"K1","loai":"single","de":"Which email will commits made inside <code>project<\/code> use?","code":"git config --global user.email \"a@x.com\"\ncd project\ngit config user.email \"b@y.com\"","lang":"bash","dap_an":["<code>a@x.com<\/code>, because --global always wins","<code>b@y.com<\/code>, because the repository (local) level overrides global","Both emails","The system-level email"],"dung":[1],"giai_thich":"Thứ tự ưu tiên: Local &gt; Global &gt; System.","nguon":"week01.pdf tr.38–39","muc":"k1-config","demo":null,"hoi":null},{"id":"K1-10","mon":"TTNT","khoi":"K1","loai":"single","de":"After these commands, what does the history contain?","code":"git commit -m 'Initial commit'\ngit add forgotten_file\ngit commit --amend","lang":"bash","dap_an":["Two commits: 'Initial commit' and a second one with forgotten_file","One commit, which now also includes forgotten_file","One commit without forgotten_file; it stays staged","An error: you cannot amend after adding files"],"dung":[1],"giai_thich":"<code>--amend<\/code> thay thế commit trước bằng commit mới chứa nội dung staging hiện tại → chỉ còn 1 commit.","nguon":"week01.pdf tr.63; Pro Git tr.53","muc":"k1-trap-amend","demo":null,"hoi":null},{"id":"K1-11","mon":"TTNT","khoi":"K1","loai":"multi","de":"Which statements about these commands are correct?","code":"git tag -a v1.4 -m \"my version 1.4\"\ngit push origin main","lang":"bash","dap_an":["The annotated tag stores the tagger name, email, date and message.","<code>git push origin main<\/code> also uploads the tag v1.4.","<code>git push origin v1.4<\/code> shares the tag with the remote.","The tag moves forward automatically with new commits, like a branch."],"dung":[0,2],"giai_thich":"Tag không được push mặc định, phải push tên tag. Tag đánh dấu một điểm cố định, không di chuyển như branch.","nguon":"week01.pdf tr.73–76","muc":"k1-trap-push","demo":null,"hoi":null},{"id":"K1-12","mon":"TTNT","khoi":"K1","loai":"multi","de":"Which statements about <code>git clone &lt;url&gt;<\/code> are correct?","code":null,"lang":null,"dap_an":["It copies the entire project history, not just the latest snapshot.","It adds a remote named origin by default.","It downloads only the latest snapshot to save space.","Every clone is effectively a full backup of the project."],"dung":[0,1,3],"giai_thich":"clone: tạo thư mục, git init, thêm remote origin, git fetch, checkout commit mới nhất. Vì chép toàn bộ lịch sử nên mỗi clone là một bản backup.","nguon":"week01.pdf tr.12, 45–46","muc":"k1-cmd","demo":null,"hoi":null},{"id":"K1-13","mon":"TTNT","khoi":"K1","loai":"single","de":"In a new repository you run the commands below. Which objects does Git store for this commit?","code":"git add README test.rb LICENSE\ngit commit -m 'Initial commit'","lang":"bash","dap_an":["3 blobs + 1 tree + 1 commit","3 diffs + 1 commit","1 blob + 3 trees + 1 commit","3 commits, one per file"],"dung":[0],"giai_thich":"Mỗi nội dung file là một blob, cấu trúc thư mục là một tree, cộng một commit object trỏ tới tree.","nguon":"week01.pdf tr.81–83","muc":"k1-objects","demo":null,"hoi":null},{"id":"K2-01","mon":"TTNT","khoi":"K2","loai":"single","de":"You are on <code>master<\/code> and run the commands below. Which branch pointer moves to the new commit?","code":"git branch testing\nvim test.rb\ngit commit -a -m 'Make a change'","lang":"bash","dap_an":["testing","master","Both master and testing","Neither; the commit is detached"],"dung":[1],"giai_thich":"<code>git branch<\/code> chỉ tạo con trỏ, không chuyển HEAD. HEAD vẫn trỏ master nên master tiến lên.","nguon":"week02.pdf tr.4–7","muc":"k2-trap-branch","demo":null,"hoi":null},{"id":"K2-02","mon":"TTNT","khoi":"K2","loai":"multi","de":"Which commands create a branch named <code>iss53<\/code> and switch to it?","code":null,"lang":null,"dap_an":["<code>git branch iss53<\/code> followed by <code>git checkout iss53<\/code>","<code>git switch -c iss53<\/code>","<code>git switch iss53<\/code> (when iss53 does not exist yet)","<code>git branch -d iss53<\/code>"],"dung":[0,1],"giai_thich":"<code>checkout -b<\/code> / <code>switch -c<\/code> tạo và chuyển trong một lệnh. <code>switch<\/code> không có -c chỉ chuyển sang nhánh đã tồn tại.","nguon":"week02.pdf tr.10–11","muc":"k2-cmd","demo":null,"hoi":null},{"id":"K2-03","mon":"TTNT","khoi":"K2","loai":"single","de":"<code>master<\/code> points to C2 and <code>hotfix<\/code> points to C4, a direct descendant of C2. What does Git do?","code":"git checkout master\ngit merge hotfix","lang":"bash","dap_an":["Moves master forward to C4 without creating a new commit (fast-forward).","Creates a merge commit with two parents.","Reports a conflict because history diverged.","Rewrites C4 on top of master."],"dung":[0],"giai_thich":"Commit được merge có thể đi tới bằng cách theo lịch sử của commit hiện tại → không có công việc rẽ nhánh → fast-forward.","nguon":"week02.pdf tr.12–13; Pro Git tr.79","muc":"k2-ff","demo":null,"hoi":null},{"id":"K2-04","mon":"TTNT","khoi":"K2","loai":"multi","de":"<code>master<\/code> and <code>iss53<\/code> have diverged. You run <code>git checkout master; git merge iss53<\/code> with no conflicts. Which statements are correct?","code":null,"lang":null,"dap_an":["Git uses the two branch tips and their common ancestor.","The result is a new merge commit with two parents.","It is a fast-forward.","Git rewrites the commits of iss53."],"dung":[0,1],"giai_thich":"Three-way merge khi hai nhánh đã rẽ: hai đầu nhánh + tổ tiên chung → merge commit có 2 cha. Merge không viết lại commit (rebase mới làm vậy).","nguon":"week02.pdf tr.14; week01.pdf tr.82","muc":"k2-mohinh","demo":null,"hoi":null},{"id":"K2-05","mon":"TTNT","khoi":"K2","loai":"multi","de":"You ran <code>git merge iss53<\/code> while on <code>master<\/code> and index.html now contains the block below. Which statements are correct?","code":"<<<<<<< HEAD:index.html\n<div id=\"footer\">contact : email.support@github.com<\/div>\n=======\n<div id=\"footer\">please contact us at support@github.com<\/div>\n>>>>>>> iss53:index.html","lang":"text","dap_an":["The part above <code>=======<\/code> is the version from master (HEAD).","After editing the file and removing all markers, run <code>git add index.html<\/code> and then <code>git commit<\/code>.","Git has already created the merge commit automatically.","The part above <code>=======<\/code> comes from iss53."],"dung":[0,1],"giai_thich":"HEAD = nhánh đang đứng (master) ở phía trên. Khi conflict, Git dừng lại, chưa tạo merge commit; sửa xong add để đánh dấu đã giải quyết rồi commit.","nguon":"Pro Git tr.83–84","muc":"k2-conflict","demo":null,"hoi":null},{"id":"K2-06","mon":"TTNT","khoi":"K2","loai":"single","de":"What happens, and how can you delete the branch anyway?","code":"$ git branch --no-merged\n  testing\n$ git branch -d testing","lang":"bash","dap_an":["It fails with 'not fully merged'; <code>git branch -D testing<\/code> forces the deletion and discards the unmerged work.","It succeeds silently.","It fails; <code>git push origin --delete testing<\/code> is required first.","It merges testing into the current branch, then deletes it."],"dung":[0],"giai_thich":"<code>-d<\/code> chặn xoá nhánh còn công việc chưa merge; <code>-D<\/code> bỏ qua kiểm tra và mất công việc đó vĩnh viễn.","nguon":"week02.pdf tr.25–27","muc":"k2-cmd","demo":null,"hoi":null},{"id":"K2-07","mon":"TTNT","khoi":"K2","loai":"single","de":"Which command lists the branches whose work is <b>not yet<\/b> merged into the branch you currently have checked out?","code":null,"lang":null,"dap_an":["<code>git branch --no-merged<\/code>","<code>git branch --merged<\/code>","<code>git branch -v<\/code>","<code>git log --graph<\/code>"],"dung":[0],"giai_thich":"--merged / --no-merged lọc theo trạng thái merge so với nhánh hiện tại.","nguon":"week02.pdf tr.22–25; ex2.docx Part B.2","muc":"k2-cmd","demo":null,"hoi":null},{"id":"K2-08","mon":"TTNT","khoi":"K2","loai":"single","de":"You want to rename the shared branch <code>wip<\/code> to <code>work-in-progress<\/code> so collaborators see the new name. Which sequence is correct?","code":null,"lang":null,"dap_an":["<code>git branch --move wip work-in-progress<\/code> → <code>git push --set-upstream origin work-in-progress<\/code> → <code>git push origin --delete wip<\/code>","<code>git push origin --delete wip<\/code> only","<code>git checkout -b work-in-progress<\/code> → <code>git branch -D wip<\/code>","<code>git remote rename wip work-in-progress<\/code>"],"dung":[0],"giai_thich":"Đổi tên local, đẩy tên mới lên và đặt upstream, rồi xoá tên cũ trên remote (tên cũ vẫn còn cho tới khi xoá).","nguon":"week02.pdf tr.29–31; ex2.docx Part B.4","muc":"k2-trap-rename","demo":null,"hoi":null},{"id":"K2-09","mon":"TTNT","khoi":"K2","loai":"multi","de":"Consider this output. Which statements are correct?","code":"$ git branch -vv\n  iss53     7e424c3 [origin/iss53: ahead 2] Add forgotten brackets\n  master    1ae2a45 [origin/master] Deploy index fix\n* serverfix f8674d9 [teamone/server-fix-good: ahead 3, behind 1] This should do it\n  testing   5ea463a Try something new","lang":"text","dap_an":["serverfix has 3 local commits not pushed and 1 commit on the server not yet merged locally.","testing has no upstream branch.","The ahead/behind numbers are always live, even without fetching.","master tracks origin/master and was up to date at the last fetch."],"dung":[0,1,3],"giai_thich":"Số ahead/behind chỉ mới bằng lần fetch cuối; muốn số mới: <code>git fetch --all; git branch -vv<\/code>.","nguon":"week02.pdf tr.54; Pro Git tr.100","muc":"k2-trap-vv","demo":null,"hoi":null},{"id":"K2-10","mon":"TTNT","khoi":"K2","loai":"multi","de":"Which statements about this sequence are correct?","code":"git checkout experiment\ngit rebase master\ngit checkout master\ngit merge experiment","lang":"bash","dap_an":["The final snapshot equals what a three-way merge would produce.","The history becomes linear.","The final <code>git merge experiment<\/code> is a fast-forward.","The original experiment commits keep their hashes."],"dung":[0,1,2],"giai_thich":"Rebase phát lại các patch thành commit mới (C3', C4' — hash mới). Sau đó merge từ master là fast-forward. Snapshot cuối giống merge.","nguon":"week02.pdf tr.58–62","muc":"k2-trap-rebase","demo":null,"hoi":null},{"id":"K2-11","mon":"TTNT","khoi":"K2","loai":"single","de":"Which practice follows the lecture's guidance on rebase vs. merge?","code":null,"lang":null,"dap_an":["Rebase local, unpushed commits to clean up; never rebase anything already pushed publicly.","Always rebase the shared main branch after every push.","Never use merge once rebase is available.","Rebase is always correct; merge is always wrong."],"dung":[0],"giai_thich":"Không có cách nào đúng tuyệt đối; thỏa hiệp: rebase thay đổi local chưa push, không rebase thứ đã public.","nguon":"week02.pdf tr.67; Pro Git tr.106","muc":"k2-rebase","demo":null,"hoi":null},{"id":"K2-12","mon":"TTNT","khoi":"K2","loai":"single","de":"<code>client<\/code> branched off <code>server<\/code>, which branched off <code>master<\/code>. What does this command do?","code":"git rebase --onto master server client","lang":"bash","dap_an":["Replays the commits of client made since it diverged from server onto master.","Replays server onto client.","Merges master into server and client.","Deletes server after rebasing client."],"dung":[0],"giai_thich":"--onto master server client: lấy client, tìm các patch kể từ khi tách khỏi server, phát lại như thể dựa trực tiếp trên master; sau đó có thể fast-forward master.","nguon":"week02.pdf tr.63–64; Pro Git tr.104","muc":"k2-rebase","demo":null,"hoi":null},{"id":"K2-13","mon":"TTNT","khoi":"K2","loai":"single","de":"A collaborator pushed <code>serverfix<\/code>. After <code>git fetch origin<\/code>, what does this command create?","code":"git checkout -b sf origin/serverfix","lang":"bash","dap_an":["A local branch <code>sf<\/code> that tracks <code>origin/serverfix<\/code>; <code>git pull<\/code> on sf pulls from it.","A remote branch named sf.","A tag called sf.","Nothing; fetch already created an editable local serverfix."],"dung":[0],"giai_thich":"Fetch chỉ tạo remote-tracking branch origin/serverfix (không sửa được). <code>checkout -b sf origin/serverfix<\/code> tạo nhánh local (tên khác) có upstream là origin/serverfix.","nguon":"week02.pdf tr.48–52","muc":"k2-remote","demo":null,"hoi":null},{"id":"K3-01","mon":"TTNT","khoi":"K3","loai":"single","de":"A prompt reads <code>admin@web01:/var/log#<\/code>. Which statement is correct?","code":null,"lang":null,"dap_an":["The session has superuser privileges and the current directory is /var/log.","The user is admin without privileges, in the home directory.","The last command failed.","The shell is not bash."],"dung":[0],"giai_thich":"Định dạng prompt: user@máy:thư-mục; kết thúc bằng # thay vì $ = superuser.","nguon":"week3.pdf tr.4","muc":"k3-nav","demo":null,"hoi":null},{"id":"K3-02","mon":"TTNT","khoi":"K3","loai":"single","de":"What does the last command print?","code":"me@linuxbox:~$ cd Desktop\nme@linuxbox:~/Desktop$ cd ../..\n$ pwd","lang":"bash","dap_an":["<code>/home<\/code>","<code>/home/me<\/code>","<code>/<\/code>","<code>/home/me/Desktop/../..<\/code>"],"dung":[0],"giai_thich":"<code>..<\/code> lên một cấp: Desktop → me → home.","nguon":"week3.pdf tr.8–9","muc":"k3-nav","demo":null,"hoi":null},{"id":"K3-03","mon":"TTNT","khoi":"K3","loai":"multi","de":"Which file names match the pattern <code>BACKUP.[0-9][0-9][0-9]<\/code>?","code":null,"lang":null,"dap_an":["<code>BACKUP.001<\/code>","<code>BACKUP.1<\/code>","<code>BACKUP.123<\/code>","<code>backup.123<\/code>"],"dung":[0,2],"giai_thich":"Pattern yêu cầu đúng “BACKUP.” (phân biệt hoa thường) và đúng ba chữ số.","nguon":"week3.pdf tr.11","muc":"k3-files","demo":null,"hoi":null},{"id":"K3-04","mon":"TTNT","khoi":"K3","loai":"multi","de":"In <code>dir2<\/code>, <code>Hi.txt<\/code> contains \"hello\". After running the commands below, which statements are correct?","code":"ln Hi.txt Hi-hard\nln -s Hi.txt Hi-sym\nrm Hi.txt","lang":"bash","dap_an":["<code>cat Hi-hard<\/code> still prints hello.","<code>Hi-sym<\/code> is now a broken link.","Before the rm, Hi-hard and Hi.txt showed the same inode number in <code>ls -li<\/code>.","Hi-sym has the same inode number as Hi.txt."],"dung":[0,1,2],"giai_thich":"Hard link chia sẻ inode nên dữ liệu còn khi xoá một tên. Symlink là file riêng chứa đường dẫn, đích mất thì link hỏng.","nguon":"week3.pdf tr.17–18; ex3.docx Part B; TLCL tr.63–65","muc":"k3-trap-link","demo":null,"hoi":null},{"id":"K3-05","mon":"TTNT","khoi":"K3","loai":"multi","de":"Which statements about these pipelines are correct?","code":null,"lang":null,"dap_an":["<code>ls /bin | sort | uniq | wc -l<\/code> counts unique program names.","<code>ls /bin | grep zip<\/code> prints only names containing \"zip\".","<code>ls /bin | tee list.txt<\/code> saves the list to list.txt and still shows it on the screen.","<code>uniq<\/code> removes all duplicates correctly even if its input is not sorted."],"dung":[0,1,2],"giai_thich":"uniq chỉ bỏ dòng trùng liền kề → cần sort trước. tee ghi file đồng thời chuyển tiếp ra stdout.","nguon":"week3.pdf tr.19; ex3.docx Part C; TLCL tr.89","muc":"k3-trap-u
